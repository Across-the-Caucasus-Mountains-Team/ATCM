#IFV
ifv_equipment: "Боевая машина пехоты"
ifv_equipment_short: "БМП"
ifv_equipment_desc: "Боевая машина пехоты"
ifv_0_equipment: "БМП-1"
ifv_0_equipment_short: "БМП-1"
ifv_0_equipment_desc: "БМП-1 — советская гусеничная боевая машина пехоты, вооружённая 73-мм орудием 2А28 «Гром» и противотанковым ракетным комплексом. Машина сочетает перевозку пехоты, огневую поддержку и способность преодолевать водные преграды вплавь."
ifv_1_equipment: "БМП-2"
ifv_1_equipment_short: "БМП-2"
ifv_1_equipment_desc: "БМП-2 — развитие БМП-1 с 30-мм автоматической пушкой 2А42, улучшенными возможностями борьбы с пехотой и воздушными целями и противотанковым ракетным вооружением. Сохраняет высокую подвижность и амфибийность."
ifv_2_equipment: "БМП-3"
ifv_2_equipment_short: "БМП-3"
ifv_2_equipment_desc: "БМП-3 — боевая машина пехоты с мощным комплексом вооружения, включающим 100-мм орудие 2А70 и 30-мм автоматическую пушку 2А72. Отличается высокой огневой мощью, хорошей подвижностью и способностью действовать на воде."
ifv_3_equipment: "Боевая машина пехоты IV"
ifv_3_equipment_short: "БМП IV"
ifv_3_equipment_desc: "Боевая машина пехоты IV"
#apc
apc_equipment: "Бронетранспортёр"
apc_equipment_short: "БТР"
apc_equipment_desc: "Бронетранспортёр"
apc_0_equipment: "БТР-152"
apc_0_equipment_short: "БТР-152"
apc_0_equipment_desc: "БТР-152"
apc_1_equipment: "БТР-60ПБ"
apc_1_equipment_short: "БТР-60ПБ"
apc_1_equipment_desc: "БТР-60ПБ — советский колёсный бронетранспортёр с формулой 8×8, предназначенный для перевозки мотострелковых подразделений. Вооружён крупнокалиберным пулемётом КПВТ и способен преодолевать водные преграды вплавь."
apc_2_equipment: "БТР-70"
apc_2_equipment_short: "БТР-70"
apc_2_equipment_desc: "БТР-70 — советский колёсный бронетранспортёр 8×8, предназначенный для защищённой перевозки пехоты и её огневой поддержки. Машина вооружена 14,5-мм пулемётом КПВТ и обладает высокой проходимостью на пересечённой местности."
apc_3_equipment: "БТР-80"
apc_3_equipment_short: "БТР-80"
apc_3_equipment_desc: "БТР-80 — колёсный бронетранспортёр 8×8 с дизельным двигателем, улучшенной подвижностью и более удобной высадкой десанта. Вооружён 14,5-мм пулемётом КПВТ и сохраняет способность преодолевать водные преграды вплавь."
apc_4_equipment: "БТР-90"
apc_4_equipment_short: "БТР-90"
apc_4_equipment_desc: "БТР-90"
#acv
airborne_combat_vehicle: "Боевая машина десанта"
airborne_combat_vehicle_short: "БМД"
airborne_combat_vehicle_desc: "Боевая машина десанта"
airborne_combat_vehicle_0: "БМД-1"
airborne_combat_vehicle_0_short: "БМД-1"
airborne_combat_vehicle_0_desc: "БМД-1 — советская боевая машина воздушно-десантных войск, приспособленная к десантированию парашютным способом. Вооружена 73-мм орудием 2А28 «Гром» и обеспечивает десанту мобильность и огневую поддержку."
airborne_combat_vehicle_1: "БМД-2"
airborne_combat_vehicle_1_short: "БМД-2"
airborne_combat_vehicle_1_desc: "БМД-2 — модернизированная боевая машина десанта с 30-мм автоматической пушкой 2А42 и противотанковым ракетным вооружением. Сохраняет малую массу, высокую подвижность и возможность воздушного десантирования."
airborne_combat_vehicle_2: "БМП-1"
airborne_combat_vehicle_2_short: "БМП-1"
airborne_combat_vehicle_2_desc: "БМП-1 — советская гусеничная боевая машина пехоты с 73-мм орудием 2А28 «Гром» и противотанковым ракетным комплексом. Она предназначена для перевозки пехоты и непосредственной огневой поддержки на поле боя."
airborne_combat_vehicle_3: "БМП-2"
airborne_combat_vehicle_3_short: "БМП-2"
airborne_combat_vehicle_3_desc: "БМП-2 — гусеничная боевая машина пехоты с 30-мм автоматической пушкой 2А42 и противотанковым ракетным вооружением. По сравнению с БМП-1 она обладает значительно большей эффективностью против пехоты и лёгкой техники."
