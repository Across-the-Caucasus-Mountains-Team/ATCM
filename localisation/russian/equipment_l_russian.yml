#Ak
infantry_equipment: "Пехотное оружие"
infantry_equipment_desc: "Пехотное оружие"
infantry_equipment_0: "АКМ"
infantry_equipment_0_desc: "Модернизированный автомат Калашникова под промежуточный патрон. Простое, надёжное и пригодное для массового производства оружие."
infantry_equipment_1: "АКМС"
infantry_equipment_1_desc: "Вариант АКМ со складным прикладом, предназначенный для воздушно-десантных войск, экипажей боевых машин и подразделений, нуждающихся в более компактном оружии."
infantry_equipment_2: "АКС-74У"
infantry_equipment_2_desc: "Компактный автомат с укороченным стволом и складным прикладом, предназначенный для экипажей техники, специальных подразделений и ближнего боя."
infantry_equipment_3: "АК-74М"
infantry_equipment_3_desc: "Модернизированный вариант АК-74 со складным полимерным прикладом, повышенной износостойкостью и возможностью установки современных прицелов и дополнительного оборудования."
