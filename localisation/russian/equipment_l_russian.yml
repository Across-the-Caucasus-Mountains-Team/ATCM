# Default Modern Tank Equipment
modern_tank_equipment: "Основной боевой танк"
modern_tank_equipment_short: "ОБТ"
modern_tank_equipment_desc: "Основной боевой танк сочетает огневую мощь, броневую защиту и высокую подвижность, являясь основой современных бронетанковых войск."
modern_tank_equipment_1: "Т-54"
modern_tank_equipment_1_short: "Т-54"
modern_tank_equipment_1_desc: "Т-54 — послевоенный советский средний танк со 100-мм пушкой Д-10Т, низким силуэтом и мощным для своего времени бронированием. Его конструкция стала основой для дальнейшего развития советских основных боевых танков."
modern_tank_equipment_2: "Т-55"
modern_tank_equipment_2_short: "Т-55"
modern_tank_equipment_2_desc: "Т-55 — глубокая модернизация Т-54 с улучшенной надёжностью, защитой от оружия массового поражения и доработанной силовой установкой. Простота конструкции и большой модернизационный потенциал обеспечили ему исключительно долгую службу."
modern_tank_equipment_3: "Т-72"
modern_tank_equipment_3_short: "Т-72"
modern_tank_equipment_3_desc: "Т-72 — массовый основной боевой танк с 125-мм гладкоствольной пушкой, автоматом заряжания и комбинированной бронёй. Компактная конструкция сочетает высокую огневую мощь с хорошей подвижностью и сравнительно невысокой стоимостью."
modern_tank_equipment_4: "Т-80"
modern_tank_equipment_4_short: "Т-80"
modern_tank_equipment_4_desc: "Т-80 — основной боевой танк с газотурбинной силовой установкой, высокой подвижностью и 125-мм пушкой с автоматом заряжания. Улучшенные системы управления огнём и броневая защита сделали его одной из наиболее совершенных советских машин своего поколения."
modern_tank_equipment_5: "Т-90"
modern_tank_equipment_5_short: "Т-90"
modern_tank_equipment_5_desc: "Т-90 — дальнейшее развитие семейства Т-72 с усиленной комбинированной и динамической защитой, модернизированной 125-мм пушкой и современными средствами управления огнём. Машина сочетает проверенную платформу с повышенной живучестью и боевой эффективностью."