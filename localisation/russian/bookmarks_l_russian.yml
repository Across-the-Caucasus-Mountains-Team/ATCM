 BM_HISTORY_TITLE:0 "Краткая история"
 Across_the_Caucasus_NAME:0 "Across the Caucasus"
 Across_the_Caucasus_DESC:0 "Настали тёмные времена для Советского Союза: каждая республика — от Прибалтики до Кавказа — рушится. Горбачёв всё ещё у власти, но что может сделать один человек, если даже его собственный народ не поддерживает его?"
 SAK_Across_the_Caucasus_DESC:0 "С 1990 года Грузия движется к независимости, и в этом сыграли важную роль Звиад Гамсахурдия и ошибки Советского Союза, усилившие сепаратистские настроения. Горная Республика стоит на распутье, и перед ней открываются разные пути. Однако одно остаётся неизменным: хаоса не избежать."
 RAS_Across_the_Caucasus_DESC:0 "Ситуация на Кавказе становится всё более мрачной: усиливаются этнические конфликты и требования независимости. ГКЧП использует это в своих целях, выставляя себя защитником Советского Союза от сепаратистов. Бог знает, что будет дальше, но ясно одно: Кавказ станет полем битвы за будущее СССР."
 CHE_Across_the_Caucasus_DESC:0 "Кавказ — стратегически важный регион, и Советский Союз стремится сохранить своё влияние здесь. Однако подъём Чечни показывает, что советская хватка слабеет, и, возможно, независимость неизбежна. ГКЧП полон решимости подавить любые сепаратистские движения, но ситуация становится всё более нестабильной."
 AZR_Across_the_Caucasus_DESC:0 "§RЭто описание появится здесь в ближайшее время.§!"
