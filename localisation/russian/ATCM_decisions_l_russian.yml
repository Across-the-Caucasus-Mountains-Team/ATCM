 CHE_georgia_activate_cells: "Активировать чеченское подполье"
 CHE_georgia_activate_cells_desc: "Вызвать кризис в Панкисском ущелье. Грузия потеряет национальный статус Тушетии и Панкиси и в обоих регионах начнётся сопротивление"
 CHE_panci_crisis_decision: "Огонь в Грузии"
 CHE_panci_crisis_decision_desc: "В грузии проживает более 600 тысяч мусульман, которых мы должны спасти от грузинских националистов. Большая их часть компактно проживает в Панкийском ущелье и Аджарии. Мы можем подержать Абхазию и южную осетию во время их войны с Тбилиси.\n\nСопротивление в Тушетии: §Y[?34.resistance|0]%§!; подчинение: §Y[?34.compliance|0]%§!.\nСопротивление в Панкиси: §Y[?120.resistance|0]%§!; подчинение: §Y[?120.compliance|0]%§!."
 CHE_georgia_expand_underground: "Расширить подполье в Панкийском ущелье"
 CHE_georgia_expand_underground_desc: "Передать подполью 50 единиц стрелкового оружия и 50 комплектов формы."
 CHE_georgia_launch_operation: "Начать операцию в Грузии"
 CHE_georgia_launch_operation_desc: "Начать войну с Грузией."
 CHE_georgia_offer_peace: "Предложить мир в обмен на Панкийское ущелье"
 CHE_georgia_offer_peace_desc: "Предложить Грузии прекращение войны в обмен на Панкийское ущелье Чечне. Необходимо полностью контролировать оба региона. Грузия может отказаться; повторное предложение доступно через 60 дней."
 CHE_georgia_political_pressure: "Поддержать противников Тбилиси"
 CHE_georgia_political_pressure_desc: "Затруднить политическую работу грузинского правительства."
 CHE_georgia_send_gelayev: "Отправить отряд Гелаева в Грузию"
 CHE_georgia_send_gelayev_desc: "Подготовить горный отряд из 300 человек под командованием Гелаева. Отряд будет оставаться на территории грузии, подежруя местное подполье."
 CHE_georgia_send_instructors: "Отправить инструкторов: [FROM.GetName]"
 CHE_georgia_send_volunteers: "Отправить добровольцев: [FROM.GetName]"
 CHE_georgia_send_volunteers_desc: "Отправить 200 добровольцев с 200 единицами стрелкового оружия и 200 комплектами формы."
 CHE_georgia_send_weapons: "Поставки оружия: [FROM.GetName]"
 CHE_georgia_send_weapons_desc: "Передать 200 единиц стрелкового оружия, 200 комплектов формы и 30 единиц дополнительного оснащения."
