 SAK_georgia_reintegrate_region: "Восстановить национальный статус Панкийского ущелия"
 SAK_georgia_reintegrate_region_desc: "Вернуть национальный статус Грузии обоим регионам. Необходимо владеть обоими регионами и полностью их контролировать. В каждом регионе нужно подчинение не ниже 70% и сопротивление ниже 20%. Во время войны с Чечнёй решение недоступно."
 SAK_georgia_restore_administration: "Восстановить администрацию в Дуиси"
