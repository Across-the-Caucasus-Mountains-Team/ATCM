 CHE_georgia_support_protests: "Поддержать антиправительственные выступления"
 CHE_georgia_support_protests_desc: "Усилить политическое недовольство в Грузии. Грузинское правительство может противодействовать."
 SAK_georgia_counter_agitation: "Противодействовать чеченскому вмешательству"
 SAK_georgia_counter_agitation_desc: "Прекратить действующие кампании чеченской политической агитации и давления."
 SAK_panci_crisis_decision: "Панкийский кризис"
 SAK_panci_crisis_decision_desc: "Противодействовать вмешательству Чечни и восстановить власть в Панкийском ущелье."
 SAK_georgia_reintegrate_region: "Восстановить национальный статус Панкийского ущелия"
 SAK_georgia_reintegrate_region_desc: "Вернуть национальный статус Грузии обоим регионам. Необходимо владеть обоими регионами и полностью их контролировать. В каждом регионе нужно подчинение не ниже 70% и сопротивление ниже 20%. Во время войны с Чечнёй решение недоступно."
 SAK_georgia_restore_administration: "Восстановить администрацию в Дуиси"
 SAK_georgia_restore_administration_desc: "Необходимо владеть обоими регионами и полностью их контролировать."
 SAK_georgia_restore_security: "Укрепить государственную границу"
 SAK_georgia_restore_security_desc: "Необходимо владеть обоими регионами и полностью их контролировать."

