l_russian:
 ATCM_world_sanctions:0 "Международные санкции"
 ATCM_world_sanctions_desc:0 "Большая часть стран мира ввела против России жёсткие санкции: заморожены счета, закрыты рынки, торговля почти остановлена."
 ATCM_high_alert:0 "Повышенная боеготовность"
 ATCM_high_alert_desc:0 "Вооружённые силы приведены в повышенную боеготовность. Резервисты призваны, части на границе находятся в полной готовности."
 ATCM_NATO_faction:0 "НАТО"
 ATCM_nuke_chechnya_tt:0 "Ядерные удары будут нанесены по всем провинциям, которые контролирует Чечня. Через несколько дней начнутся международные последствия."
 atcmnuke.1.t:0 "Мир отвечает на удар"
 atcmnuke.1.d:0 "Применение тактического ядерного оружия на территории Чеченской Республики всколыхнуло планету и вызвало небывалую в современной истории волну международного гнева и осуждения. То, что казалось немыслимым табу после августа 1945 года, произошло в разгар сложнейших и без того нестабильных девяностых годов. Мировое сообщество отреагировало мгновенно и бескомпромиссно: на экстренном заседании Совета Безопасности ООН, невзирая на вето российской делегации, Генеральная Ассамблея приняла подавляющим большинством голосов жёсткую резолюцию, квалифицирующую действия Москвы как бессмысленное военное преступление и акцию тотального уничтожения мирного населения.\n\nЗа политическими заявлениями незамедлительно последовали сокрушительные экономические удары. Соединённые Штаты Америки, государства Европейского союза, Япония и десятки других стран объявили о введении абсолютной экономической блокады и полной изоляции Российской Федерации. Зарубежные золотовалютные резервы страны были мгновенно заморожены на банковских счетах в Лондоне, Нью-Йорке и Франкфурте. Все международные финансовые транзакции с участием российских банков были заблокированы, а экспортно-импортные контракты на поставку сырья, нефти и газа расторгнуты в одностороннем порядке. Прекращены даже гуманитарные поставки критически важных медикаментов, продовольствия и технологического оборудования.\n\nРоссийская экономика, которая и до этого находилась в глубочайшем системном кризисе после распада СССР, пережила гигантский шок. Национальная валюта обесценилась за считанные часы, на биржах началась паника, а банкоматы и обменные пункты по всей стране закрылись из-за отсутствия наличности. Население охватил страх перед голодом и абсолютной неопределённостью. Россия оказалась в полной изоляции, превратившись в государство-изгой."
 atcmnuke.1.a:0 "Санкции введены"
 atcmnuke.2.t:0 "Разведывательные полёты НАТО"
 atcmnuke.2.d:0 "Небо над южными рубежами России окончательно перестало быть безопасным. Сразу после ослепительных вспышек над Кавказом активность авиации Североатлантического альянса вдоль российских границ возросла в геометрической прогрессии. Тяжёлые стратегические самолёты-разведчики RC-135, высотные разведчики U-2, а также летающие локаторы системы AWACS E-3 Sentry совершают ежедневные, круглосуточные патрулирования над нейтральными водами Чёрного моря и в воздушном пространстве сопредельных стран.\n\nВоенные эксперты и аналитики Главного разведывательного управления в закрытых докладах Генеральному штабу отмечают, что НАТО уже не просто ведёт визуальное или радиотехническое наблюдение за зоной катастрофы. Идёт планомерное, методичное сканирование всей системы противовоздушной и противоракетной обороны на юге России. Самолеты противника провоцируют включение российских РЛС, чтобы точнейшим образом засечь их координаты, определить рабочие частоты, а также вскрыть местоположение подземных командных пунктов, позиций зенитно-ракетных комплексов С-300 и шахтных пусковых установок Стратегических ядерных сил.\n\nКаждый такой полёт проходит на грани фола, вынуждая российские дежурные средства ПВО работать в стрессовом режиме. Зенитно-ракетные дивизионы переведены в состояние постоянной боевой готовности, а пилоты истребителей-перехватчиков Су-27 и МиГ-31 дежурят в кабинах своих машин прямо на рулёжных дорожках аэродромов. В воздухе висит ощутимый запах пороха: в штабах понимают, что противник проводит детальную доразведку перед вероятным нанесением первого нейтрализующего удара."
 atcmnuke.2.a:0 "Принято к сведению"
 atcmnuke.3.t:0 "Учения НАТО в Чёрном море"
 atcmnuke.3.d:0 "Под официальным предлогом «обеспечения безопасности судоходства, контроля за экологической обстановкой и стабилизации ситуации в регионе» крупная ударная корабельная группировка военно-морских сил НАТО демонстративно вошла в акваторию Чёрного моря через проливы Босфор и Дарданеллы. Десятки современных ракетных эсминцев, крейсеров и фрегатов под флагами США, Великобритании, Франции и Турции развернули масштабные военно-морские манёвры в непосредственной близости от российских территориальных вод.\n\nКомандование Черноморского флота из Севастополя докладывает о серии беспрецедентных и наглых провокаций. Натовские корабли приближаются к российскому побережью и военно-морским базам на расстояние визуального контакта, полностью игнорируя предупреждающие сигналы по международным каналам связи. Несколько раз фиксировались критические, опасные сближения боевых кораблей, а палубная авиация противника имитировала заходы на атаку российских береговых батарей и кораблей дежурных сил.\n\nВ штабе Черноморского флота царит высочайшее напряжение. Стареющие советские корабли, испытавшие на себе все лишения постсоветского недофинансирования, сталкиваются со строгим дефицитом топлива и запчастей, в то время как технологически превосходящий противник открыто демонстрирует силу, показывая, что Чёрное море больше не является защищённым задним двором России. Это прямая психологическая атака и проверка руководства страны на прочность."
 atcmnuke.3.a:0 "Усилить наблюдение"
 atcmnuke.4.t:0 "Войска у турецкой границы"
 atcmnuke.4.d:0 "Южные границы страны замерли в оцепенении и предчувствии неизбежной катастрофы. Анкара, заручившись поддержкой своих союзников по Североатлантическому альянсу и воспользовавшись абсолютной дипломатической изоляцией Москвы, начала масштабную переброску регуляторных армейских корпусов к границам Закавказья. Военная разведка докладывает о непрерывных колоннах бронетехники, подвозе тысяч тонн боеприпасов, развёртывании полевых госпиталей, складов снабжения и передовых пунктов управления.\n\nТурецкая армия, обладающая одной из крупнейших и хорошо оснащенных сухопутных группировок в регионе, приведена в высшую степень боевой готовности. Местные жители по обе стороны границы спешно бросают свои дома и имущество, спасаясь бегством вглубь материка, предчувствуя, что региональный конфликт вот-вот перерастёт в масштабное кровопролитие. Вдоль всего пограничного периметра ускоренными темпами возводятся фортификационные сооружения, оборудуются замаскированные позиции для тяжелой артиллерии и реактивных систем залпового огня.\n\nВсе дипломатические каналы связи с Анкарой фактически разорваны. Турецкое руководство полностью игнорирует запросы Министерства иностранных дел России, делая резкие и агрессивные заявления о «необходимости защиты братских народов Закавказья от безумной ядерной угрозы со стороны Москвы». Кольцо сжимается, и южный флаг страны оказывается перед лицом прямой военной угрозы."
 atcmnuke.4.a:0 "Принято к сведению"
 atcmnuke.5.t:0 "Нарушения воздушного пространства"
 atcmnuke.5.d:0 "Обстановка на южном стратегическом направлении стремительно катится к абсолютному неуправляемому хаосу. Истребители-бомбардировщики ВВС США и стран НАТО за последние сутки неоднократно и дерзко нарушали государственную границу Российской Федерации. Пользуясь сложностью горного рельефа Кавказа и выполняя полёты на предельно малых высотах, боевые самолёты противника уходят от зон обнаружения устаревших РЛС и совершают демонстративные пролёты прямо над российскими военными объектами, гарнизонами и узлами связи.\n\nДежурные пары истребителей-перехватчиков ВВС России неоднократно поднимались в воздух по тревоге. Пилоты докладывают о визуальном контакте с натовскими самолётами, которые ведут себя крайне агрессивно, захватывая российские машины в прицелы бортовых радиолокационных станций управления оружием. Однако жесткого, однозначного приказа из Москвы на открытие огня и уничтожение нарушителей до сих пор не поступает из-за страха высшего руководства спровоцировать прямой повод для глобальной войны.\n\nВ рядах военных на местах нарастает глухой ропот и отчаяние. Противник видит паралич политической воли в столице и откровенно глумится над суверенитетом страны, превращая охраняемое воздушное пространство в собственный полигон. Каждый подобный вылет доводит нервы офицеров на командных пунктах ПВО до предела. До роковой ошибки, после которой заговорят пушки, остаются считанные минуты."
 atcmnuke.5.a:0 "Выразить протест"
 atcmnuke.6.t:0 "Инцидент на грузинской границе"
 atcmnuke.6.d:0 "Хрупкий и шаткий мир на Кавказе окончательно рухнул в огонь прямого военного противостояния. На участке границы с Грузией вспыхнул ожесточённый и кровопролитный пограничный инцидент, который за считанные часы перерос в полноценный локальный бой с применением тяжелого вооружения. Российские пограничные заставы и прилегающие грузинские посты подверглись массированному миномётному и артиллерийскому обстрелу, после чего в бой вступила бронетехника и пехотные соединения.\n\nОфициальный Тбилиси и Москва незамедлительно обменялись яростными обвинениями. Грузинская сторона утверждает, что российские войска совершили вероломное вторжение, в то время как Министерство обороны РФ докладывает о спланированной провокации со стороны грузинских силовиков при поддержке иностранных инструкторов. На месте боя имеются многочисленные убитые и раненые с обеих сторон, подбиты несколько единиц бронетехники, уничтожена пограничная инфраструктура.\n\nВ обычных условиях 90-х годов такой инцидент попытались бы урегулировать путем переговоров, но в текущей обстановке, когда Кавказ отравлен радиацией после ядерного удара, этот конфликт моментально становится детонатором. Западаные средства массовой информации мгновенно подхватывают новость, раздувая её до масштабов «новой агрессии Кремля». Этот пограничный бой становится идеальным юридическим и информационным предлогом для открытого военного вмешательства третьих сил."
 atcmnuke.6.a:0 "Принято к сведению"
 atcmnuke.7.t:0 "Заявление о «гуманитарной миссии»"
 atcmnuke.7.d:0 "Западные столицы окончательно отбросили дипломатическую вежливость и перешли к прямому политическому и военному ультиматуму. На экстренном саммите НАТО в Брюсселе было принято официальное заявление о необходимости немедленного начала масштабной «гуманитарной и миротворческой операции» в зоне кавказского конфликта. Под громкими лозунгами о «защите мирного населения от экологической катастрофы и радиоактивной угрозы» скрывается подготовка к прямой интервенции.\n\nСевероатлантический альянс выдвинул требование о немедленном и беспрепятственном допуске иностранных военных контингентов, инспекторов и техники на территорию Кавказа, а также о создании «бесполётной зоны» над всем югом России. Практически это означает требование добровольно отказаться от суверенитета над собственной территорией и полностью передать контроль над регионом войскам западной коалиции.\n\nВ Москве эти заявления расценивают не иначе как неприкрытый ультиматум и прямую подготовку к вооружённому вторжению. В высших эшелонах власти становится очевидно: Запад больше не считает Россию державой, способной защитить себя. Военные округа на юге страны переводятся на режим военного времени. Дипломатия бессильна, и вопрос теперь заключается лишь в том, когда именно первые колонны натовской бронетехники пересекут государственную границу."
 atcmnuke.7.a:0 "Принято к сведению"
 atcmnuke.8.t:0 "Приказ о повышенной готовности"
 atcmnuke.8.d:0 "Генеральный штаб Вооружённых сил Российской Федерации представил высшему руководству страны предельно жесткий и неутешительный аналитический доклад: сухопутные и военно-воздушные группировки НАТО закончили сосредоточение сил на южном фланге и полностью готовы к началу широкомасштабной наступательной операции. Отдавать инициативу врагу далее равносильно самоубийству.\n\nПрезидент подписал экстренный указ о приведении всех Вооружённых сил, включая Стратегические ядерные силы, в режим «Полная боевая готовность». По всей стране объявляется экстренная мобилизация резервистов, из баз хранения извлекаются тысячи единиц бронетехники и артиллерии, а стратегические ракетные комплексы «Тополь» выходят из боксов и рассредотачиваются в глухих лесных массивах для боевого дежурства. Атомные подводные ракетоносцы экстренно покидают базы в Мурманске и Камчатке, уходя под льды Арктики.\n\nВ российских городах царит тревожное, оцепенелое молчание. Улицы патрулируются усиленными нарядами милиции и внутренних войск, идет проверка гражданской обороны и бомбоубежищ. Страна полностью перестроилась на военные рельсы. Военные офицеры застыли у пультов управления, ожидая финального приказа. Рубикон перейдён, отступать больше некуда — Россия готовятся вступить в схватку с сильнейшим военным блоком планеты."
 atcmnuke.8.a:0 "Подтвердить приказ"
 atcmnuke.9.t:0 "Грузия вступает в НАТО"
 atcmnuke.9.d:0 "На фоне стремительно нарастающего военного хаоса и полного краха системы безопасности в регионе руководство в Тбилиси приняло судьбоносное и бескомпромиссное решение. В ходе экстренно созванного заседания Североатлантического совета было официально объявлено о применении ускоренной процедуры принятия Республики Грузия в состав военно-политического блока НАТО.\n\nТурция, как ключевая военная сила альянса в Черноморском и Кавказском регионе, берёт на себя прямые обязательства по обеспечению безопасности Грузии и интеграции её вооружённых сил в единую систему командования НАТО. На грузинские аэродромы уже приземляются транспортные самолёты с передовыми частями морской пехоты США, подразделениями спецназа и современными системами ПВО. Военно-морская база в Поти переходит под контроль сил альянса.\n\nДля Москвы этот шаг означает окончательное крушение многовекового баланса сил на Кавказе. Вражеский военный блок закрепился непосредственно на южном рубеже Российской Федерации, создав идеально подготовленный плацдарм для наступления вглубь российской территории. Военная инфраструктура НАТО теперь развернута прямо у подножия Кавказского хребта, исключая любые возможности для дипломатического маневра."
 atcmnuke.9.a:0 "Недопустимо"
 atcmnuke.10.t:0 "Армения вступает в НАТО"
 atcmnuke.10.d:0 "Геополитическая домино-катастрофа на Кавказе завершает свой бег. Вслед за Тбилиси о своем экстренном решении присоединиться к Североатлантическому альянсу объявил Ереван. Оказавшись в абсолютной изоляции, в окружении нестабильности и перед лицом колоссальной ядерной катастрофы по соседству, армянское руководство предпочло полностью разорвать традиционные союзнические связи с Москвой и принять покровительство Запада.\n\nВ Ереване подписаны все необходимые протоколы о вступлении страны в НАТО. Этим шагом альянс окончательно замкнул кольцо окружения на юге. Региональный блок в составе Турции, Грузии и Армении сформировал единый, монолитный военный плацдарм, полностью контролирующий Закавказье и перекрывающий России выход к южным границам.\n\nНа армянских аэродромах начинается оперативное развертывание американской и французской авиации, а турецкие и европейские сухопутные части занимают ключевые высоты и узлы дорог. Российские военные базы в регионе оказываются блокированными и фактически взятыми в заложники. Южный стратегический флаг России полностью перешёл под контроль противника. Война становится не просто неизбежной — она начинает свой отсчет."
 atcmnuke.10.a:0 "Недопустимо"
 atcmnuke.11.t:0 "Война с НАТО"
 atcmnuke.11.d:0 "Точка невозврата окончательно пройдена, и худший кошмар человечества воплотился в реальность. Объединённый военно-политический блок в составе Турции, Грузии и Армении при прямой и всеобъемлющей поддержке экспедиционных сил и авиации НАТО официально объявил войну Российской Федерации. Дипломатические отношения разорваны, а на фронте заговорили орудия.\n\nМноготысячные механизированные соединения противника, поддерживаемые армадами танков, артиллерии и штурмовой авиации, перешли государственную границу России и начали широкомасштабную наступательную операцию на Кавказском направлении. Вражеская авиация наносит массированные высокоточные ракетно-бомбовые удары по российским военным аэродромам, узлам связи, складам боеприпасов и командным пунктам от Ростова до Владикавказа.\n\nНачинается полномасштабная, кровопролитная конвенциональная война между сверхдержавой и сильнейшей коалицией мира. Российские солдаты и офицеры, несмотря на нехватку снабжения и численное превосходство врага, оказывают отчаянное и мужественное сопротивление на каждом рубеже. Однако фронт неумолимо трещит по швам под непрерывным молотом натовской военной машины. Перед лицом неизбежного военного разгрома у российского командования остается лишь один, самый крайний и ужасный аргумент — применение всего стратегического ядерного арсенала."
 atcmnuke.11.a:0 "К оружию"
 atcmnuke.12.t:0 "Ядерный удар по Москве"
 atcmnuke.12.d:0 "Судный день настал. Вражеская термоядерная боеголовка пробила ослабленную и перегруженную систему противоракетной обороны столицы и детонировала прямо над центром Москвы. Ослепительная вспышка, сопоставимая со вспышкой тысячи солнц, на долю секунды испепелила древний город, превратив его в пыль, радиоактивный пепел и расплавленный бетон.\n\nУдарная волна колоссальной силы и огненный шторм сметут Кремль, правительственные здания, командные бункеры, жилые кварталы и миллионы человеческих жизней за несколько мгновений. В радиусе десятков километров не осталось ничего живого. Связь с высшим политическим и военным руководством страны полностью прервана, централизованное управление государством мгновенно прекратило своё существование, а страна погрузилась в полную тьму и хаос.\n\nОднако враг просчитался. Наземные защищённые пункты управления и автоматизированные комплексы «Периметр», расположенные глубоко под землей в Уральских горах, зафиксировали гибель столицы, падение уровня сигналов и всплеск радиации. Алгоритмы системы Судного дня окончательно передали право на нанесение ответного удара уцелевшим офицерам ракетных войск. Начинается финал истории человечества."
 atcmnuke.12.a:0 "Катастрофа"
 atcmnuke.13.t:0 "Ответный огонь"
 atcmnuke.13.d:0 "Автоматическая система ответного ядерного удара «Периметр» и уцелевшие расчеты на атомных подводных крейсерах стратегического назначения, находящихся в глубинах мирового океана, выполнили свой последний и страшный долг. Из подземных шахт Сибири, из лесных массивов и из-под воды со скрежетом и ревом устремились в раскаленное небо сотни межконтинентальных баллистических ракет.\n\nИх цели — Вашингтон, Лондон, Париж, Анкара, Брюссель и сотни других городов, военных баз и промышленных центров противника по всему Северному полушарию. В небесах Земли разворачивается жуткая картинами: тысячи ядерных боеголовок вычерчивают огненные дуги в стратосфере, пересекаясь в смертельном танце с ракетами противника. Наземные системы ПВО и ПРО бесполезны перед лицом этой апокалиптической лавины.\n\nВся планета превращается в единый пылающий ад. Океаны кипят от подводных взрывов, города сгорают в огненных торнадо, а атмосфера наполняется миллиардами тонн сажи и радиоактивного пепла. Последние офицеры в командных бункерах смотрят на гаснущие экраны мониторов, понимая, что через несколько минут на планете не останется никого, кто мог бы отдать приказ или услышать ответ."
 atcmnuke.13.a:0 "Огонь"
 atcmnuke.14.t:0 "Тишина"
 atcmnuke.14.d:0 "Когда безумный огненный шторм наконец утих, а плотная завеса радиоактивного пепла и сажи медленно опустилась на истерзанную и выжженную поверхность Земли, перед остатками живого открылся абсолютно новый, мертвый мир. Великие цивилизации, процветавшие тысячи лет, гигантские мегаполисы, культура, наука и государственность — всё это превратилось в отравленные руины и горы обугленного мусора за считанные часы.\n\nНаступила эпоха бесконечной, лютой ядерной зимы. Солнечный свет больше не пробивается сквозь непроницаемый сажевый купол в атмосфере, температура на планете стремительно падает, убивая оставшуюся фауну и флору. На территории бывшего Кавказа, России, Европы и Америки больше нет государств, границ, армий и правительств. Лишь редкие горстки доживающих свои последние дни облученных выживших прячутся в руинах метрополитенов и глубоких подвалах.\n\nНаступила гробовая, абсолютная тишина. На этой отравленной планете больше нет победителей и побежденных, нет правых и виноватых. Геополитические амбиции, войны за территории и ядерные доктрины потеряли всякий смысл. Человечество совершило окончательное самоубийство, оставив после себя лишь холодные, радиоактивные руины и тишину."
 atcmnuke.14.a:0 "Всё кончено"
 RAS_nuclear_strike_on_chechnya:0 "Ядерный удар по Чечне"
 RAS_nuclear_strike_on_chechnya_desc:0 "Кровавый тупик, катастрофические потери в горных ущельях и угроза полного обвала кавказского фронта подталкивают отчаявшееся военное командование к крайней, немыслимой мере. Применение тактического ядерного оружия мгновенно выжжет чеченские позиции, уничтожит руководство боевиков и сломает любое сопротивление на Кавказе.\n\nОднако цена такой «победы» будет катастрофической. Этот шаг навсегда перечеркнет прежний мировой порядок, превратит Россию в изгоя и запустит необратимую цепную реакцию эскалации с НАТО, которая неизбежно приведет мир к порогу Третьей мировой войны. Готовы ли мы открыть врата ада ради решения локального конфликта?"