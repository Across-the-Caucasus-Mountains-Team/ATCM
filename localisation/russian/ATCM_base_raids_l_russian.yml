﻿l_russian:
 CHE_hold_raids_on_soviet_millitary_bases_desc: "На военных базах, автопарках и аэродромах остаются запасы бывшей Советской армии. Организованные рейды помогут вооружить нашу армию до вывода войск."
 CHE_base_raids: "Советские базы"
 CHE_base_raids_desc: "Четыре конечных запаса. Одновременно можно проводить один рейд. Уже изъято: военные базы — [?CHE_base_taken_military|%0], автопарки — [?CHE_base_taken_vehicles|%0], аэродромы — [?CHE_base_taken_airfields|%0], тяжёлая техника — [?CHE_base_taken_heavy|%0]."
 CHE_base_raid_start_tt: "§G90%§! — успех: первый рейд даёт §G40%§!, последующие — по §G20%§! от первоначального запаса цели, и §G+2§! опыта армии. §R10%§! — неудача: погибнут §R25§! бойцов, трофеев и опыта не будет. При неудаче запас цели сохраняется. Повтор — через §Y30 дней§! после завершения. Требуется не менее §Y25§! человек в резерве. При отмене операции возвращается §Y25§! ед. политической власти."
 CHE_base_handover_tt: "Оставшиеся запасы разделены поровну."
 CHE_base_handover_che_desc: "Российские части завершают вывод. Оставшееся военное имущество разделено между сторонами поровну. Ниже наша доля, полученная при передаче:\n\n§YВоенные базы§!\nАКМ — §Y[?base_raid_handover^0|0]§!, АКМС — §Y[?base_raid_handover^1|0]§!, доп. оснащение — §Y[?base_raid_handover^2|0]§!, форма — §Y[?base_raid_handover^3|0]§!, миномёты — §Y[?base_raid_handover^4|0]§!, РПГ-7 — §Y[?base_raid_handover^5|0]§!, РПГ-18 — §Y[?base_raid_handover^6|0]§!, бронежилеты — §Y[?base_raid_handover^7|0]§!.\n\n§YАвтопарки§!\nдоп. оснащение — §Y[?base_raid_handover^8|0]§!, ГАЗ-69 — §Y[?base_raid_handover^9|0]§!, УАЗ-469 — §Y[?base_raid_handover^10|0]§!, грузовики — §Y[?base_raid_handover^11|0]§!, поезда — §Y[?base_raid_handover^12|0]§!.\n\n§YАэродромы§!\nБМД-1 — §Y[?base_raid_handover^13|0]§!, БМД-2 — §Y[?base_raid_handover^14|0]§!, доп. оснащение — §Y[?base_raid_handover^15|0]§!, ПЗРК «Стрела-2» — §Y[?base_raid_handover^16|0]§!, АКМС — §Y[?base_raid_handover^17|0]§!, форма — §Y[?base_raid_handover^18|0]§!, бронежилеты — §Y[?base_raid_handover^19|0]§!.\n\n§YПарк тяжёлой техники§!\nТ-55 — §Y[?base_raid_handover^20|0]§!, Т-72 — §Y[?base_raid_handover^21|0]§!, БМП-1 — §Y[?base_raid_handover^22|0]§!, БМП-2 — §Y[?base_raid_handover^23|0]§!, БТР-70 — §Y[?base_raid_handover^24|0]§!, БТР-80 — §Y[?base_raid_handover^25|0]§!, БМ-21 «Град» — §Y[?base_raid_handover^26|0]§!, Д-20 — §Y[?base_raid_handover^27|0]§!."
 atcm_base_raids.1.t: "Передача военного имущества"
 atcm_base_raids.1.d: "Вывод российских частей из Чечни сопровождается разделом военного имущества. В наши запасы поступило:\n\n§YВоенные базы§!\nАКМ — §Y[?base_raid_handover^0|0]§!, АКМС — §Y[?base_raid_handover^1|0]§!, доп. оснащение — §Y[?base_raid_handover^2|0]§!, форма — §Y[?base_raid_handover^3|0]§!, миномёты — §Y[?base_raid_handover^4|0]§!, РПГ-7 — §Y[?base_raid_handover^5|0]§!, РПГ-18 — §Y[?base_raid_handover^6|0]§!, бронежилеты — §Y[?base_raid_handover^7|0]§!.\n\n§YАвтопарки§!\nдоп. оснащение — §Y[?base_raid_handover^8|0]§!, ГАЗ-69 — §Y[?base_raid_handover^9|0]§!, УАЗ-469 — §Y[?base_raid_handover^10|0]§!, грузовики — §Y[?base_raid_handover^11|0]§!, поезда — §Y[?base_raid_handover^12|0]§!.\n\n§YАэродромы§!\nБМД-1 — §Y[?base_raid_handover^13|0]§!, БМД-2 — §Y[?base_raid_handover^14|0]§!, доп. оснащение — §Y[?base_raid_handover^15|0]§!, ПЗРК «Стрела-2» — §Y[?base_raid_handover^16|0]§!, АКМС — §Y[?base_raid_handover^17|0]§!, форма — §Y[?base_raid_handover^18|0]§!, бронежилеты — §Y[?base_raid_handover^19|0]§!.\n\n§YПарк тяжёлой техники§!\nТ-55 — §Y[?base_raid_handover^20|0]§!, Т-72 — §Y[?base_raid_handover^21|0]§!, БМП-1 — §Y[?base_raid_handover^22|0]§!, БМП-2 — §Y[?base_raid_handover^23|0]§!, БТР-70 — §Y[?base_raid_handover^24|0]§!, БТР-80 — §Y[?base_raid_handover^25|0]§!, БМ-21 «Град» — §Y[?base_raid_handover^26|0]§!, Д-20 — §Y[?base_raid_handover^27|0]§!."
 atcm_base_raids.1.a: "Разве там было не больше?"
 atcm_base_raids.2.t: "Рейд сорван"
 atcm_base_raids.2.d: "Операция завершилась неудачей. Мы потеряли 25 солдат. Оружие и техника остались на базе."
 atcm_base_raids.2.a: "Ах"
 CHE_raid_base_military: "Рейд: военные базы"
 CHE_raid_base_military_desc: "Первоначальный запас: 3200 АКМ, 2400 АКМС, 240 комплектов дополнительного оснащения, 10000 комплектов формы, 40 миномётов, 100 РПГ-7, 40 РПГ-18, 7000 бронежилетов.\n\nУже изъято: [?CHE_base_taken_military|%0].\n\nПервый успех — 40%, последующие — по 20% от первоначального запаса. Вероятность успеха — 90%, неудачи — 10%. Трофеи сразу поступают в запас страны."
 CHE_raid_base_vehicles: "Рейд: автопарки"
 CHE_raid_base_vehicles_desc: "Первоначальный запас: 400 комплектов дополнительного оснащения, 100 ГАЗ-69, 50 УАЗ-469, 100 грузовиков, 5 поездов.\n\nУже изъято: [?CHE_base_taken_vehicles|%0].\n\nПервый успех — 40%, последующие — по 20% от первоначального запаса. Вероятность успеха — 90%, неудачи — 10%. Трофеи сразу поступают в запас страны."
 CHE_raid_base_airfields: "Рейд: аэродромы"
 CHE_raid_base_airfields_desc: "Первоначальный запас: 20 БМД-1, 10 БМД-2, 200 комплектов дополнительного оснащения, 30 ПЗРК «Стрела-2», 500 АКМС, 1000 комплектов формы, 500 бронежилетов.\n\nУже изъято: [?CHE_base_taken_airfields|%0].\n\nПервый успех — 40%, последующие — по 20% от первоначального запаса. Вероятность успеха — 90%, неудачи — 10%. Трофеи сразу поступают в запас страны."
 CHE_raid_base_heavy: "Рейд: парк тяжёлой техники"
 CHE_raid_base_heavy_desc: "Первоначальный запас: 20 Т-55, 10 Т-72, 20 БМП-1, 10 БМП-2, 30 БТР-70, 10 БТР-80, 10 БМ-21 «Град», 50 Д-20.\n\nУже изъято: [?CHE_base_taken_heavy|%0].\n\nПервый успех — 40%, последующие — по 20% от первоначального запаса. Вероятность успеха — 90%, неудачи — 10%. Трофеи сразу поступают в запас страны."