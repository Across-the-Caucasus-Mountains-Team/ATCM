l_russian:
FE_DIFFICULTY_VERY_EASY: "Дух"
FE_DIFFICULTY_VERY_EASY_TOOLTIP: "§L«Мы справимся!»§!"
FE_DIFFICULTY_EASY: "Салага"
FE_DIFFICULTY_EASY_TOOLTIP: "§L«Я не сомневаюсь в вашей отваге, преданности долгу и боевых умениях. Мы не согласимся ни на что, кроме абсолютной победы. Удачи!»§!"
FE_DIFFICULTY_NORMAL: "Слон"
FE_DIFFICULTY_NORMAL_TOOLTIP: "§L«Ибо наш противник силен. Он может отбросить наши войска. Успех может прийти к нам не сразу, но мы будем возвращаться снова и снова».§!"
FE_DIFFICULTY_HARD: "Черпак"
FE_DIFFICULTY_HARD_TOOLTIP: "§L«Через тридцать лет, когда вы будете сидеть у домашнего очага с вашим внуком на коленях, и он спросит вас: ''Что ты делал во время Второй мировой войны?'', вам не придется ему отвечать: ''Ну, я копал дерьмо в Луизиане''».§!"
FE_DIFFICULTY_VERY_HARD: "Дембель"
FE_DIFFICULTY_VERY_HARD_TOOLTIP: "§L«Я не могу предложить ничего, кроме крови, тяжелого труда, слез и пота».§!"