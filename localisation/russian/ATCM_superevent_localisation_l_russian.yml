l_russian:
  sp_event_SOV_August_Coup_title: "Августовский путч"
  sp_event_SOV_August_Coup_quote: "“СССР как государство, как единое целое, как геополитическая единица — прекратит своё существование». \n- §YГеннадий Янаев§!"
  sp_event_SOV_August_Coup_remark: "Конец Союза близок..."

  sp_event_SOV_End_Of_The_Ussr_title: "Распад СССР"
  sp_event_SOV_End_Of_The_Ussr_quote: "“Мы не строили то, что нужно было народу. Пришло время создать другое государство — свободное и демократическое». \n- §YБорис Ельцин§!"
  sp_event_SOV_End_Of_The_Ussr_remark: "Конец целой эпохи"

  sp_event_RAS_Black_October_title: "Чёрный Октябрь"
  sp_event_RAS_Black_October_quote: "“Это был государственный переворот. Ельцин распустил парламент — это и был переворот». \n- §YСторонники парламента§!"
  sp_event_RAS_Black_October_remark: "Закат демократии в России"

  sp_event_RAS_First_Chechen_War_title: "Первая Чеченская война"
  sp_event_RAS_First_Chechen_War_quote: "“У меня нет злобы к России, только отвращение, как к мёртвому скоту». \n- §YДжохар Дудаев§!"
  sp_event_RAS_First_Chechen_War_remark: "Начало кровавой бойни"
