  AZR_Soviet_State: "Советская республика"
  AZR_Soviet_State_desc: "Азербайджанская ССР, как и другие советские республики, стоит на пороге больших перемен. Нарастающее недовольство и ослабление центральной власти в Москве предвещают скорую бурю."
  AZR_Sovereignty_Question: "Вопрос суверенитета"
  AZR_Sovereignty_Question_desc: "В Азербайджане, как и в других советских республиках, нарастает недовольство политикой Москвы. Народный фронт и другие национальные движения требуют большей автономии и независимости от центральной власти."
  AZR_Preservation_of_USSR: "Сохранить Союз?"
  AZR_Preservation_of_USSR_desc: "Про-советские элиты Азербайджана задаются вопросом: стоит ли выходить из состава СССР? Они опасаются, что это приведёт к хаосу и нестабильности в республике."
  AZR_Soviet_Loyalty: "Верность СССР"
  AZR_Soviet_Loyalty_desc: "Азербайджан должен оставаться верным Советскому Союзу. Мы должны поддерживать единство и стабильность в республике, несмотря на растущее недовольство и требования независимости."
  AZR_Support_Coup: "Поддержать переворот"
  AZR_Support_Coup_desc: "Вместе с поддержкой Москвы, про-советские элиты Азербайджана решили совершить государственный переворот, чтобы предотвратить приход к власти Народного фронта и других национальных движений."
  AZR_Communist_Preservation: "Сохранение коммунизма"
  AZR_Communist_Preservation_desc: "Азербайджан останется в составе СССР. Это будет начало новой эры для нашей республики, где мы будем бороться за сохранение социалистических идеалов и противостоять националистическим движениям."

  AZR_Pursuit_of_Independence: "Курс на независимость"
  AZR_Pursuit_of_Independence_desc: "Народный фронт и другие национальные движения не видят никакого другого решения кроме полного отделения от СССР. Чтобы прийти к светлому будущему надо стать суверенным государством."
  AZR_Anti_Communist_Protests: "Антикоммунистические протесты"
  AZR_Anti_Communist_Protests_desc: "Народ начал выходить на улицы с требованием свержения коммунистического режима. Протесты становятся всё более массовыми и агрессивными, и в кремле начинают осознавать, что ситуация выходит из-под контроля."
  AZR_Musavat_Revival: "Возрождение Мусавата"
  AZR_Musavat_Revival_desc: "\"Мусават\", азербайджанская демократическая партия, запрещённая в 1920 году, возрождается. Она выступает за независимость Азербайджана и против коммунистического режима. Партия начинает набирать популярность среди населения."
  AZR_New_Parties_Creation: "Создание новых партий"
  AZR_New_Parties_Creation_desc: "В условиях растущего недовольства и политической нестабильности в Азербайджане, появляются новые политические партии, которые выступают за независимость и демократические реформы. Эти партии начинают набирать популярность среди населения."
  AZR_Pro_Democratic_Speeches: "Прозападные речи"
  AZR_Pro_Democratic_Speeches_desc: "Лидеры различных оппозиционных партий выступают с речами, призывающими к демократическим реформам и независимости от Советского Союза. Эти речи становятся всё более популярными среди населения."
  AZR_Founding_Democratic_Institutions: "Создание демократических институтов"
  AZR_Founding_Democratic_Institutions_desc: "Новые политические партии начинают создавать свои собственные институты, такие как пресс-службы, молодежные организации и т.д. Это позволяет им укрепить свои позиции и расширить влияние на общество."
  AZR_Declare_Independence: "Объявление независимости"
  AZR_Declare_Independence_desc: "Азербайджан спустя долгие годы борьбы за независимость, наконец, объявляет о своей независимости от Советского Союза. Это событие становится знаковым для всей страны и открывает новую эру в её истории."
