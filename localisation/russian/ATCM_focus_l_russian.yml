 ARM_Prepare_for_the_inevitable_desc: "Военная обстановка диктует свои условия. План «Подготовиться к неизбежному» позволит сосредоточиться на подготовке сил и выполнении поставленных задач."
 ARM_tensions_in_karabakh_desc: "События развиваются стремительно, и бездействовать больше нельзя. Решение «Пламя в Карабахе» станет новым этапом нашего пути."
 ARM_demand_referendum_in_karabakh_desc: "Перед нами стоит непростая задача. Реализация направления «Референдум или война» определит дальнейшие возможности страны."
