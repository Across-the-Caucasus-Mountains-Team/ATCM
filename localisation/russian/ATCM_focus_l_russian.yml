 SAK_Our_Actions_desc: "События развиваются стремительно, и бездействовать больше нельзя. Решение «Наши действия» станет новым этапом нашего пути."
 SAK_integration_of_south_ossetia_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Интеграция Южной Осетии»."
 SAK_equal_rights_to_ossetians_desc: "Перед нами стоит непростая задача. Реализация направления «Равные права для осетин» определит дальнейшие возможности страны."
 SAK_public_schools_for_everyone_desc: "Идеи и убеждения формируют будущее общества. Курс «Государственные школы для всех» станет частью нашей внутренней политики."
 SAK_more_autonomy_desc: "Политическая стабильность не возникнет сама собой. Решение «Расширение автономии» станет важным шагом в борьбе за будущее государства."
 SAK_Little_fish_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Мелкая рыбка»."
 SAK_Arrest_Oppositions_desc: "Военная обстановка диктует свои условия. План «Арестовать оппозицию» позволит сосредоточиться на подготовке сил и выполнении поставленных задач."
 SAK_Raid_their_offices_desc: "От исхода боевых действий зависит слишком многое. Необходимо реализовать «Рейд на их офисы» и подготовиться к дальнейшему развитию кампании."
 SAK_Fortify_Political_Prisons_desc: "От исхода боевых действий зависит слишком многое. Необходимо реализовать «Укрепить политические тюрьмы» и подготовиться к дальнейшему развитию кампании."
 SAK_Crackdown_kitovani_national_guard_desc: "От исхода боевых действий зависит слишком многое. Необходимо реализовать «Разгром Национальной гвардии Китовани» и подготовиться к дальнейшему развитию кампании."
 SAK_Our_National_Speechs_desc: "Общественные настроения способны изменить ход событий. Политика «Наши национальные речи» поможет направить эти перемены в нужное русло."
 SAK_Interview_with_foreign_journalists_desc: "Поддержка извне может сыграть решающую роль в будущем страны. Настало время реализовать «Интервью с иностранными журналистами»."
 SAK_Ban_Communism_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Запретить коммунизм»."
 SAK_Send_National_Guard_desc: "Военная обстановка диктует свои условия. План «Отправить Национальную гвардию» позволит сосредоточиться на подготовке сил и выполнении поставленных задач."
 SAK_Battle_of_tskhinvali_desc: "От исхода боевых действий зависит слишком многое. Необходимо реализовать «Битва за Цхинвали» и подготовиться к дальнейшему развитию кампании."
 SAK_Close_Rock_mountain_pass_desc: "События развиваются стремительно, и бездействовать больше нельзя. Решение «Закрыть туннель Рокский» станет новым этапом нашего пути."
 SAK_negotiate_with_Abkhazia_desc: "Поддержка извне может сыграть решающую роль в будущем страны. Настало время реализовать «Вести переговоры с абхазской властью»."
 SAK_Crackdown_Abkhazians_desc: "Перед нами стоит непростая задача. Реализация направления «Противодействовать абхазам» определит дальнейшие возможности страны."
 SAK_Take_Sukhumi_desc: "Перед нами стоит непростая задача. Реализация направления «Захватить Сухуми» определит дальнейшие возможности страны."
 SAK_Integrate_Abkhazia_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Интегрировать Абхазию»."
 SAK_arrest_gamasakhurdia_desc: "Стране предстоит пройти через серьёзные внутренние перемены. Меры «Арестовать Гамсахурдию» помогут определить новый политический порядок."
 SAK_secure_socialist_control_desc: "Общественные настроения способны изменить ход событий. Политика «Укрепить социалистическую власть» поможет направить эти перемены в нужное русло."
 SAK_continue_the_course_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Продолжить прежний курс»."
 SAK_glasnost_desc: "Идеи и убеждения формируют будущее общества. Курс «Гласность» станет частью нашей внутренней политики."
 SAK_prerestroika_desc: "Перед нами стоит непростая задача. Реализация направления «Перестройка» определит дальнейшие возможности страны."
 SAK_embrace_the_legacy_of_stalin_desc: "Общественные настроения способны изменить ход событий. Политика «Обратиться к наследию Сталина» поможет направить эти перемены в нужное русло."
 SAK_a_political_revolution_desc: "Вопрос власти требует конкретных действий. Реализация курса «Политическая революция» определит дальнейшее развитие политической ситуации."
 SAK_georgianization_policies_desc: "Стране предстоит пройти через серьёзные внутренние перемены. Меры «Политика огрузинивания» помогут определить новый политический порядок."
 SAK_Aftermath_of_Coup_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Последствия переворота»."
 SAK_Where_is_Gamsakhurdia_desc: "Перед нами стоит непростая задача. Реализация направления «Где Гамсахурдия?» определит дальнейшие возможности страны."
 SAK_We_need_President_desc: "Вопрос власти требует конкретных действий. Реализация курса «Нам нужен президент» определит дальнейшее развитие политической ситуации."
 SAK_Contact_Shevardnadze_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Связаться с Шеварднадзе»."
 SAK_Ensure_Full_Control_on_media_desc: "Идеи и убеждения формируют будущее общества. Курс «Обеспечить полный контроль над СМИ» станет частью нашей внутренней политики."
 SAK_Start_Propaganda_Campaign_desc: "Идеи и убеждения формируют будущее общества. Курс «Начать пропагандистскую кампанию» станет частью нашей внутренней политики."
 SAK_ban_Opposition_media_desc: "От исхода боевых действий зависит слишком многое. Необходимо реализовать «Запретить оппозиционные СМИ» и подготовиться к дальнейшему развитию кампании."
 SAK_Support_Svobodnaya_Gruziya_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Финансировать прорежимные СМИ»."
 SAK_Start_Economy_Reform_desc: "Без надёжной хозяйственной основы невозможно обеспечить стабильное будущее. Начнём работу по направлению «Начать экономическую реформу»."
 SAK_Ensure_Full_Control_on_Military_desc: "Военная обстановка диктует свои условия. План «Обеспечить полный контроль над армией» позволит сосредоточиться на подготовке сил и выполнении поставленных задач."
 SAK_Purge_Zviadists_desc: "Стране предстоит пройти через серьёзные внутренние перемены. Меры «Чистка звиадистов» помогут определить новый политический порядок."
 SAK_Reinforce_Militia_desc: "Нашим войскам требуется чёткий план действий. Меры по направлению «Реструктурировать милицию» помогут укрепить позиции в ходе конфликта."
 SAK_Fight_back_Zviadists_Resistance_desc: "Военная обстановка диктует свои условия. План «Сразиться с сопротивлением звиадистов» позволит сосредоточиться на подготовке сил и выполнении поставленных задач."
 SAK_The_Large_Speech_desc: "Борьба за поддержку населения не менее важна, чем борьба за территорию. Следует заняться вопросом «Большая речь»."
 SAK_what_are_we_going_to_do_next_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Что будем делать дальше?»."
 SAK_Ensure_Full_Control_on_Parliament_desc: "Стране предстоит пройти через серьёзные внутренние перемены. Меры «Обеспечить полный контроль над парламентом» помогут определить новый политический порядок."
 SAK_Start_military_Reform_desc: "Нашим войскам требуется чёткий план действий. Меры по направлению «Начать военную реформу» помогут укрепить позиции в ходе конфликта."
 SAK_Clear_Tbilisi_From_Criminals_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Очистить Тбилиси от преступников»."
 SAK_Adjara_Autonomy_Question_desc: "Вопрос власти требует конкретных действий. Реализация курса «Вопрос автономии Аджарии» определит дальнейшее развитие политической ситуации."
 SAK_Strenght_Parliament_Guard_desc: "Нашим войскам требуется чёткий план действий. Меры по направлению «Укрепить охрану парламента» помогут укрепить позиции в ходе конфликта."
 SAK_ask_for_negotiations_desc: "Международная обстановка требует осторожного подхода. Инициатива «Попросить переговоров» должна укрепить наши позиции на дипломатической арене."
 SAK_status_of_the_army_desc: "От исхода боевых действий зависит слишком многое. Необходимо реализовать «Состояние армии» и подготовиться к дальнейшему развитию кампании."
 SAK_status_of_the_Economy_desc: "Экономический потенциал страны необходимо использовать эффективнее. Инициатива «Состояние экономики» определит наши ближайшие приоритеты."
 SAK_Daily_bread_delivery_car_desc: "Грузия переживает переломный период своей истории. Настало время заняться вопросом «Ежедневная доставка хлеба»."
 SAK_privatize_agriculturale_sectors_desc: "Экономический потенциал страны необходимо использовать эффективнее. Инициатива «Приватизировать сельскохозяйственные отрасли» определит наши ближайшие приоритеты."
 SAK_invest_into_hospitals_desc: "Экономика нуждается в восстановлении и новых возможностях. Программа «Инвестировать в больницы» станет очередным шагом к решению накопившихся проблем."
 SAK_Reconstructe_Roads_desc: "Экономика нуждается в восстановлении и новых возможностях. Программа «Восстановить дороги» станет очередным шагом к решению накопившихся проблем."
 SAK_Reform_Lari_desc: "Экономический потенциал страны необходимо использовать эффективнее. Инициатива «Реформа лари» определит наши ближайшие приоритеты."
 SAK_liberalize_trade_and_markets_desc: "Без надёжной хозяйственной основы невозможно обеспечить стабильное будущее. Начнём работу по направлению «Либерализовать торговлю и рынки»."
