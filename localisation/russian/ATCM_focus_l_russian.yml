  Georgia_focus: "Дерево фокусов Советской Грузии"
  SAK_gamsakhurdia_speech: "Речь Гамсахурдия"
  SAK_gamsakhurdia_speech_desc: "Звиад Гамсахурдия выступает по всей Грузинской ССР, призывая поддержать независимость. Ослабление союзного центра открывает новые возможности, но воспользоваться ими можно лишь при поддержке населения."
  SAK_the_last_steps_toward_independence: "Последние шаги к независимости"
  SAK_the_last_steps_toward_independence_desc: "На фоне кризиса Советского Союза настало время завершить подготовку к независимости. Следующим шагом станет референдум, на котором граждане определят будущее республики."
  SAK_consolidate_the_nationalist_government: "Укрепить националистическое правительство"
  SAK_consolidate_the_nationalist_government_desc: "Национальное движение набирает силу. Укрепление правительства и его общественной поддержки поможет провести республику через переход к независимости."
  SAK_shida_konplikti: "Шидский конфликт"
  SAK_shida_konplikti_desc: "Противоречия внутри Грузии обостряются по мере ослабления союзного центра. Государству необходимо подготовиться к внутренним столкновениям и возможному внешнему вмешательству."
  SAK_tensions_in_south_ossetia: "Напряжённость в Южной Осетии"
  SAK_tensions_in_south_ossetia_desc: "Противостояние в Южной Осетии становится всё опаснее. Правительство должно определить свои действия до того, как дальнейшее обострение сделает положение неуправляемым."
  SAK_reinforce_the_national_guard: "Укрепить Национальную гвардию"
  SAK_reinforce_the_national_guard_tt: "Баланс бюджета: §R-15 млн§!"
  SAK_reinforce_the_national_guard_desc: "Национальная гвардия становится опорой вооружённых сил республики. Ей необходимы реорганизация, снабжение и подготовка к защите страны."
  SAK_mobilize_the_economy: "Мобилизовать экономику"
  SAK_mobilize_the_economy_tt: "Баланс бюджета: §G+5 млн§!"
  SAK_mobilize_the_economy_desc: "Защита независимости требует ресурсов. Мы должны подготовить хозяйство к обеспечению армии оружием, боеприпасами и другими необходимыми поставками."
  SAK_diplomatia: "Дипломатия"
  SAK_diplomatia_desc: "Грузии необходимо добиться признания за рубежом. Дипломатические контакты помогут найти поддержку её стремлению стать самостоятельной республикой."
  SAK_pro_western_diplomacy: "Прозападная дипломатия"
  SAK_pro_western_diplomacy_desc: "Самостоятельная внешняя политика требует новых партнёров. Развитие отношений с западными государствами может укрепить международное положение Грузии."
  SAK_ask_for_international_recognition: "Добиваться международного признания"
  SAK_ask_for_international_recognition_desc: "Независимость нуждается в международном признании. Мы обратимся к другим государствам и Организации Объединённых Наций с просьбой поддержать суверенитет Грузии."
  SAK_ask_for_international_recognition_tt: "Баланс бюджета: §R-100 тыс§!"
  SAK_foreign_policy_independence: "Независимость внешней политики"
  SAK_foreign_policy_independence_desc: "Внешняя политика республики больше не должна определяться только в Москве. Нам предстоит создать собственные каналы взаимодействия с другими государствами."
  SAK_independence_referendum: "Референдум о независимости"
  SAK_independence_referendum_desc: "Подготовка завершена: настало время вынести вопрос о независимости на всенародное голосование. Решение граждан определит дальнейший путь Грузии."
  Independent_Georgia_focus: "Дерево фокусов Независимой Грузии"
  SAK_rise_from_the_dead: "Воскресли из мёртвых"
  SAK_rise_from_the_dead_desc: "Сегодня мы восстали против наших угнетателей — Советского Союза. После почти века оккупации мы вновь обрели независимость. Слава Независимой Сакартвело!"
  SAK_decommunization: "Декоммунизация"
  SAK_decommunization_desc: "Демонтаж советских политических структур должен закрепить независимость страны. Новым учреждениям предстоит заменить партийный аппарат и определить своё отношение к советскому наследию."
  SAK_begin_our_work: "Начать нашу работу"
  SAK_begin_our_work_desc: "Провозглашение независимости — только начало. Теперь необходимо наладить работу государственных учреждений и приступить к решению накопившихся проблем."
  SAK_mtavroba: "Мтавроба"
  SAK_mtavroba_desc: "Новому государству нужно работоспособное правительство. Распределение полномочий и ответственности позволит перейти от политических заявлений к повседневному управлению страной."
  SAK_draft_a_new_constitution: "Разработка новой конституции"
  SAK_draft_a_new_constitution_desc: "Мы, граждане Грузии, твёрдо стремясь к созданию демократического общественного порядка, экономической свободы, правового и социального государства, к обеспечению всеобщих прав и свобод человека, к укреплению государственной независимости и мирных отношений с другими народами, вдохновляясь вековыми традициями грузинской государственности и историко-правовым наследием Конституции 1921 года, провозглашаем настоящую Конституцию перед Богом и нацией."
  SAK_establish_national_sovereignty: "Установить национальный суверенитет"
  SAK_establish_national_sovereignty_desc: "Суверенитет должен существовать не только на бумаге. Мы должны утвердить полномочия грузинских органов власти и обеспечить исполнение их решений."
  SAK_a_political_revolution: "Политическая революция"
  SAK_privatization: "Приватизация"
  SAK_privatization_desc: "Переход от плановой экономики требует решения судьбы государственных предприятий. Приватизация откроет пространство для частной инициативы, но потребует контроля за распределением собственности."
  SAK_nationalize_resources: "Национализировать ресурсы"
  SAK_nationalize_resources_desc: "Ресурсы страны должны служить её восстановлению. Сохранение государственного контроля над ними позволит направлять доходы на наиболее насущные нужды республики."
  SAK_abkhazians: "Абхазы..."
  SAK_abkhazians_desc: "Отношения с Абхазией становятся одним из главных испытаний независимой Грузии. Власти должны определить свой подход к требованиям автономии и предотвратить дальнейшее углубление конфликта."
  SAK_khalkhi: "Халкхи"
  SAK_khalkhi_desc: "Без поддержки населения независимость останется хрупкой. Государство должно уделить внимание общественным нуждам и укреплению доверия между гражданами и новыми учреждениями."
  SAK_reform_schools: "Реформа школ"
  SAK_reform_schools_desc: "Школам предстоит работать в условиях нового государства. Обновление учебных программ и подготовка преподавателей помогут сохранить доступ к образованию во время перемен."
  SAK_georgianization_policies: "Политика огрузинивания"
  SAK_rebuild_the_faith: "Возрождение веры"
  SAK_rebuild_the_faith_desc: "После десятилетий государственного атеизма религиозная жизнь возвращается в общественное пространство. Сотрудничество с церковью станет частью восстановления культурных и духовных традиций."
  SAK_create_a_new_currency: "Создание новой валюты"
  SAK_create_a_new_currency_desc: "Финансовая самостоятельность требует подготовки собственной денежной системы. Необходимо организовать выпуск валюты и обеспечить доверие к новым платёжным средствам."
  SAK_the_9th_april_tragedy: "Трагедия 9 апреля"
  SAK_the_9th_april_tragedy_desc: "События 9 апреля 1989 года стали переломным моментом в борьбе за независимость. Память о погибших должна занять достойное место в общественной жизни республики."
  SAK_ossetians: "Осетины..."
  SAK_ossetians_desc: "Спор вокруг статуса Южной Осетии угрожает устойчивости государства. Нам предстоит определить политику в отношении региона и найти выход из нарастающего противостояния."
  SAK_the_power_struggle: "§RБорьба за власть§!"
  SAK_the_power_struggle_desc: "Разногласия между политическим руководством и вооружёнными формированиями становятся открытой борьбой за власть. От её исхода зависит будущее правительства и всей республики."
