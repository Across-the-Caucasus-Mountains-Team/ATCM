  CHE_General_Staff_of_Chechnya:0 "Главный Штаб Чечни"
  CHE_General_Staff_of_Chechnya_desc:0 "Главный Штаб Чечни — это высший военный орган в стране, ответственный за стратегическое планирование и координацию военных операций. Он играет ключевую роль в организации обороны Чеченской Республики от внешних угроз и обеспечении безопасности её граждан."
  CHE_adapt_their_weapons:0 "Приспособить их оружие"
  CHE_establish_engineer_squads:0 "Отряды инженеров"
  CHE_Information_war:0 "Информационная война"
  CHE_Information_war_desc:0 "Информационная война — это важный аспект современного конфликта, включающий использование пропаганды, дезинформации и психологических операций для влияния на общественное мнение и подрыва морального духа противника. В контексте Чеченской Республики она играет ключевую роль в формировании нарратива борьбы за независимость и противодействии российской пропаганде."
  CHE_relase_battle_footage:0 "Опубликовать боевые кадры"
  CHE_Russia_is_still_communist:0 "Россия всё ещё коммунистическая"
  CHE_appear_in_internet:0 "Появиться в интернете"
  CHE_deny_our_own_war_crimes:0 "Отрицать собственные военные преступления"
  CHE_show_Russian_pows:0 "Показать российских военнопленных"
  CHE_money_in_return_of_good_propaganda:0 "Деньги в обмен на хорошую пропаганду"
  CHE_loyal_military_correspondents:0 "Лояльные военные корреспонденты"
  CHE_fight_back_russian_misinformation:0 "Бороться с российской дезинформацией"
  CHE_Aftermath_of_First_wave:0 "Последствия Первой Волны"
  CHE_Aftermath_of_First_wave_desc:0 "Первая волна Чеченской войны оставила глубокий след в регионе, приведя к значительным жертвам и разрушениям. Чеченская Республика стоит на распутье, перед необходимостью восстановления и продолжения сопротивления российской агрессии. Последствия войны будут формировать будущее Чечни и её борьбу за независимость."
