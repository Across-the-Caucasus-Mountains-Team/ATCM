  CHE_Aftermath_of_First_wave:0 "Последствия Первой Волны"
  CHE_Aftermath_of_First_wave_desc:0 "Первая волна Чеченской войны оставила глубокий след в регионе, приведя к значительным жертвам и разрушениям. Чеченская Республика стоит на распутье, перед необходимостью восстановления и продолжения сопротивления российской агрессии. Последствия войны будут формировать будущее Чечни и её борьбу за независимость."
