  CHE_peace_negotiations_first_chechen_war_decision:0 "Мирные переговоры"
  CHE_peace_negotiations_first_chechen_war_decision_desc:0 "Война затянулась. Несмотря на храбрость наших бойцов и поддержку народа, мы не можем игнорировать разрушения, голод и истощение, которые она приносит. Некоторые командиры и политические деятели начали рассматривать возможность диалога с Москвой. \n\nХод переговоров: §G[?RAS_negotiation_process_fcw_value|%%]§"
  CHE_stability_of_republic_decision:0 "Решение о стабильности республики"
  CHE_stability_of_republic_decision_desc:0 "После победы Джохара Дудаева на президентских выборах, новая Республика Ичкерия встала на хрупкий путь к полной независимости. Однако страна сталкивается с огромными трудностями: крахом советских институтов, экономической нестабильностью и существованием мощной внутренней оппозиции.\n\nЛегитимность Дудаева: §Y[?CHE_legitimacy_of_dudayev_value|%%]§! \n\nСила оппозиции: §Y[?CHE_power_of_opposition_value|%%]§!"
  CHE_hold_Grozny:0 "Удержать Грозный"
  CHE_hold_Grozny_desc:0 "Столица Чеченской Республики, Грозный, находится под постоянной угрозой со стороны российских войск. Город является символом нашей борьбы и должен быть защищён любой ценой."
  CHE_hold_Shali:0 "Удержать Шали"
  CHE_hold_Shali_desc:0 "Город Шали — ключевая стратегическая точка Чеченской Республики. Его оборона крайне важна для контроля над регионом и безопасности нашего народа."
  CHE_hold_Gudermes:0 "Удержать Гудермес"
  CHE_hold_Gudermes_desc:0 "Гудермес — важный транспортный узел и центр сопротивления российским войскам. Его оборона необходима для сохранения наших линий снабжения и связи."
  CHE_hold_Argun:0 "Удержать Аргун"
  CHE_hold_Argun_desc:0 "Город Аргун является важной точкой обороны Чеченской Республики. Его захват российскими войсками может поставить под угрозу наш контроль над регионом и нарушить линии снабжения."
  CHE_hold_UrusMartan:0 "Удержать Урус-Мартан"
  CHE_hold_UrusMartan_desc:0 "Урус-Мартан — стратегически важное место в Чеченской Республике. Его оборона необходима для сохранения контроля над регионом и обеспечения безопасности наших граждан."
  CHE_mobilize_additional_forces_in_Grozny:0 "Мобилизовать дополнительные силы"
  CHE_mobilize_additional_forces_in_Grozny_desc:0 "Оборона Грозного критически важна для выживания Чеченской Республики. Мобилизация дополнительных сил укрепит наши позиции и отпугнёт российские атаки."

  chechnya.68.t:0 "Наследие советской авиации"
  chechnya.68d:0 "Вывод российских войск с территории Чечни завершился. Покидая республику, российские военные оставили на аэродромах Ханкала и Калиновская сотни самолётов, ранее принадлежавших советским авиационным училищам. На первый взгляд, в наших руках оказался внушительный авиационный арсенал, способный стать основой собственных военно-воздушных сил.\n\nСогласно проведённой инвентаризации, нам достались:\n\n§Y149§! учебно-тренировочных L-29 «Дельфин»;\n§Y111§! учебно-боевых L-39 «Альбатрос»;\n§Y3§! истребителя МиГ-17;\n§Y2§! учебных истребителя МиГ-15УТИ;\n§Y6§! транспортных самолётов Ан-2;\n§Y2§! многоцелевых вертолёта Ми-8.\n\nТаким образом, в нашем распоряжении оказались §Y271 самолёт и 2 вертолёта§!. Однако впечатляющие цифры скрывают крайне тяжёлое положение.\n\nПодавляющее большинство полученной техники предназначалось для обучения лётчиков, а не для ведения полноценной войны. Многие самолёты годами находились на хранении, были частично разукомплектованы либо ожидали списания. При отступлении российские специалисты демонтировали с части машин важнейшие приборы и оборудование. На восстановление авиационного парка у молодой республики нет ни достаточных денежных средств, ни современной ремонтной базы, ни необходимых технологий и запасных частей.\n\nНе менее острой проблемой стала нехватка квалифицированного персонала. Опытных пилотов и авиационных техников катастрофически мало. Запасы авиационного вооружения ограничены, значительная часть сохранившихся боеприпасов устарела либо предназначена для учебных целей. Даже исправные самолёты невозможно использовать одновременно из-за нехватки экипажей и технического обслуживания.\n\nПредварительная оценка командования показала, что в нынешних условиях мы способны содержать лишь небольшую эскадрилью. Для немедленного использования решено выделить §G3 МиГ-17, 6 L-39, 2 L-29 и 2 Ми-8§!. Остальные машины остаются на хранении в ожидании ремонта или будут разобраны на запасные части.\n\nМы получили сотни самолётов, но настоящие военно-воздушные силы нам ещё только предстоит создать."
  chechnya.68.a:0 "Начнём с того, что ещё способно летать."
  CHE_weapon_depreservation:0 "Расконсервация оружия"
  CHE_weapon_depreservation_desc:0 "Чеченская Республика остро нуждается в оружии и боеприпасах. Расконсервация складского вооружения обеспечит наших бойцов необходимым снаряжением для продолжения борьбы против российских войск."
  CHE_first_chechen_war_decision:0 "Первая Чеченская война"
  CHE_first_chechen_war_decision_desc:0 "Началась Первая Чеченская война. Чеченская Республика столкнулась с жестоким вторжением российских войск, стремящихся подавить нашу борьбу за независимость. Эта война станет испытанием стойкости и решимости нашего народа."
