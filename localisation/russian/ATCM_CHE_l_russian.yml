  CHE_islamic_republic_stability_decision_desc: "После победы исламистких сил на президентских выборах, новая Исламская Республика Ичкерия встала на хрупкий путь к полной независимости. Однако страна сталкивается с огромными трудностями: крахом советских институтов, экономической нестабильностью и существованием мощной внутренней оппозиции.\n\nРадикализация исламистов: §Y[?CHE_the_radicalism_of_islamists_value|%%]§! \n\nСила оппозиции: §Y[?CHE_moderate_opposition_value|%%]§!"
