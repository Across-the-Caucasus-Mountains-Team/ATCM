 chechnya.70.t: "Судьба коммунистов"
 chechnya.70.d: "После установления исламской власти перед нами встал вопрос о дальнейшей судьбе представителей прежнего советского режима.\n\nВ республике по-прежнему проживает значительное число русских, многие из которых занимают важные должности в государственных учреждениях, промышленности, образовании и здравоохранении. К коммунистической партии также принадлежали представители чеченского населения, включая некоторых бывших руководителей республики.\n\nЭти люди обладают знаниями и опытом, необходимыми для функционирования нашего государства.\n\nОднако многие считают коммунистов безбожниками, атеистами и прислужниками советской оккупационной системы, десятилетиями подавлявшей ислам и чеченские национальные традиции. Радикальное крыло нашего движения требует окончательного уничтожения политического влияния коммунистов и наказания представителей старого режима.\n\nТеперь нам предстоит решить, какое место эти люди займут в новой исламской Чечне."
 chechnya.70.a: "Не трогайте их."
 chechnya.70.b: "Они должны принять ислам!"
 chechnya.70.c: "Лишите их занимаемых должностей!"

 chechnya.71.t: "Договор с Дудаевым"
 chechnya.71.d: "Одним из главных противников нашего правительства остаётся Джохар Дудаев — бывший генерал-майор советской авиации и председатель Общенационального конгресса чеченского народа.\n\nВозглавляемое им национальное движение остаётся одной из крупнейших политических сил республики. Дудаев пользуется значительным авторитетом среди сторонников независимости, военных и части чеченской интеллигенции. Несмотря на общую заинтересованность в освобождении Чечни от власти Москвы, наши представления о будущем государства существенно различаются.\n\nДудаев и его сторонники выступают прежде всего за национальную независимость и создание чеченского государства, тогда как наше правительство намерено построить государство на основе исламских законов.\n\nНекоторые советники предлагают арестовать генерала, пока он не сумел объединить оппозицию. Другие считают, что его военный опыт и авторитет можно использовать, назначив его командующим формирующимися военно-воздушными силами. Наиболее умеренные члены правительства предлагают заключить соглашение с националистами и создать коалицию.\n\nКак нам поступить с Дудаевым?"
 chechnya.71.a: "Арестовать Дудаева!"
 chechnya.71.b: "Пусть возглавит наши ВВС."
 chechnya.71.c: "Мы можем создать с ним коалицию."

 chechnya.72.t: "Будущее нефтяной отрасли"
 chechnya.72.d: "Нефтяная промышленность на протяжении десятилетий оставалась основой чеченской экономики. В окрестностях Грозного расположены нефтяные месторождения, нефтеперерабатывающие заводы, нефтехранилища и предприятия нефтехимической промышленности. Через территорию республики проходят важные трубопроводы, связывающие нефтедобывающие районы Кавказа с другими регионами бывшего Советского Союза.\n\nВ 1991 году на территории Чечни добывалось более четырёх миллионов тонн нефти в год. Нефтеперерабатывающая промышленность обеспечивала работой десятки тысяч человек и была тесно связана с предприятиями за пределами республики.\n\nОднако большая часть отрасли по-прежнему находится под управлением директоро и хозяйственных руководителей, получивших свои должности ещё при советской власти.\n\nСторонники сохранения существующего порядка предупреждают, что вмешательство государства может нарушить производство, вызвать отток специалистов и поставить под угрозу поставки нефти. В то же время радикальное крыло правительства требует национализации отрасли, считая, что природные богатства Чечни должны находиться под непосредственным контролем исламского государства.\n\nКому будет принадлежать чеченская нефть?"
 chechnya.72.a: "Пусть продолжают добывать нефть."
 chechnya.72.b: "Национализировать нефтяную отрасль!"

 chechnya.73.t: "Переговоры со старейшинами"
 chechnya.73.d: "Несмотря на установление нового правительства в Грозном, значительная часть чеченского общества продолжает руководствоваться многовековыми обычаями и традициями. В сельских общинах большим уважением пользуются старейшины, представители влиятельных семей и авторитетные посредники, к мнению которых прислушиваются при разрешении споров и принятии важных решений.\n\nОсобое место в чеченском обществе занимает адат — система традиционных норм и обычаев, регулирующих отношения между семьями, общинами и отдельными людьми. Некоторые положения адата могут вступать в противоречие с тем толкованием шариата, которое намерено установить наше правительство.\n\nПредставители старейшин заявляют о готовности признать новую власть при условии сохранения местных традиций и определённой самостоятельности общин. Они предлагают создать совет старейшин, который будет участвовать в разрешении споров и представлять интересы населения перед центральным правительством.\n\nОднако радикальные сторонники исламизации выступают против подобных уступок. По их мнению, государственные законы должны иметь безусловное превосходство над местными обычаями, а власть старейшин необходимо ограничить.\n\nПризнание их авторитета может укрепить положение правительства в сельских районах, но одновременно затруднит централизацию государства."
 chechnya.73.a: "Создать совет старейшин."
 chechnya.73.b: "Шариат должен стоять выше адата!"

 chechnya.74.t: "Проблема светских мусульман"
 chechnya.74.d: "Ислам занимает важнейшее место в культуре и истории чеченского народа. Однако далеко не все мусульмане республики разделяют политические и религиозные взгляды нашего правительства.\n\nЗначительная часть населения придерживается традиционных исламских обычаев, но не поддерживает радикальный исламизм, ваххабизм и идею объединения всего Северного Кавказа в единое исламское государство. Для многих чеченцев религия является прежде всего вопросом личной веры, семейных традиций и национальной культуры, а не основанием для полного переустройства общества.\n\nОсобенно заметны подобные настроения среди светской интеллигенции, городского населения и части молодых людей, выросших в советских образовательных учреждениях. Многие из них поддерживают независимость Чечни, но выступают против принудительной исламизации, религиозных ограничений и вмешательства духовенства в повседневную жизнь.\n\nРадикальное крыло правительства требует введения единых религиозных норм для всех мусульман. Более умеренные представители власти предупреждают, что подобная политика может вызвать массовое недовольство и превратить даже сторонников независимости в наших противников.\n\nДолжно ли государство определять, каким образом его граждане исповедуют ислам?"
 chechnya.74.a: "Им придётся научиться правильно почитать Аллаха!"
 chechnya.74.b: "Пусть почитают Аллаха так, как считают нужным."

 chechnya.75.t: "Суфийское духовенство"
 chechnya.75.d: "Одним из наиболее влиятельных элементов религиозной жизни Чечни остаются суфийские братства. На протяжении поколений последователи кадирийского и накшбандийского тарикатов сохраняли исламские традиции даже в годы советских преследований.\n\nСуфийские шейхи и религиозные наставники пользуются значительным авторитетом среди населения, особенно в сельских районах. Их влияние не ограничивается мечетями: они участвуют в общественной жизни, поддерживают отношения с местными общинами и способны оказывать заметное воздействие на настроения верующих.\n\nОднако отношения между традиционным суфийским духовенством и радикальным крылом нашего правительства постепенно обостряются. Некоторые сторонники строгой исламской реформы осуждают отдельные суфийские обряды, почитание религиозных наставников и местные традиции, считая их несовместимыми со своим пониманием ислама.\n\nПредставители суфийского духовенства, в свою очередь, опасаются, что новое правительство попытается подчинить религиозную жизнь единой государственной идеологии и ограничить многовековые традиции чеченских мусульман.\n\nСтоит выбор: признать влияние суфийских братств и добиться их сотрудничества либо подчинить религиозные учреждения непосредственному контролю государства."
 chechnya.75.a: "Заключить союз с суфийскими шейхами."
 chechnya.75.b: "Подчинить духовенство государству!"
 
 chechnya.76.t: "Смена руководства"
 chechnya.76.d: "С момента гибели Джохара Дудаева прошло достаточно времени. Временное руководство страны больше не может откладывать вопрос о стабильной власти. В условиях продолжающегося хаоса и боевых действий командиры и политические фракции собрались, чтобы определить будущего лидера ЧРИ"
 chechnya.76.a: "Аслах Масхадов"
 chechnya.76.b: "Шамиль Басаев"

 CHE_Deport_Russians_desc: "Положение русского населения стало предметом спора внутри власти. Дудаев может отказаться от депортации или разрешить ограниченную кампанию. Решение будет принято в отдельном событии."
 CHE_deports_of_russians_desc: "Радикальное правительство намерено провести более масштабное выселение русского населения. Отъезд тысяч семей затронет прежде всего Грозный и север республики, ухудшит отношения с Россией и вызовет её ответную реакцию."
