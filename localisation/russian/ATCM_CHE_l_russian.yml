  CHE_General_Staff_of_Chechnya:0 "Главный Штаб Чечни"
  CHE_General_Staff_of_Chechnya_desc:0 "Главный Штаб Чечни — это высший военный орган в стране, ответственный за стратегическое планирование и координацию военных операций. Он играет ключевую роль в организации обороны Чеченской Республики от внешних угроз и обеспечении безопасности её граждан."
  CHE_adapt_their_weapons:0 "Приспособить их оружие"
  CHE_establish_engineer_squads:0 "Отряды инженеров"
  CHE_Information_war:0 "Информационная война"
  CHE_Information_war_desc:0 "Информационная война — это важный аспект современного конфликта, включающий использование пропаганды, дезинформации и психологических операций для влияния на общественное мнение и подрыва морального духа противника. В контексте Чеченской Республики она играет ключевую роль в формировании нарратива борьбы за независимость и противодействии российской пропаганде."
