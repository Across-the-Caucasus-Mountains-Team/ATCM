 CHE_foreign_volunteers_dm: "Иностранные добровольцы"
 CHE_foreign_volunteers_dm_desc: "Действует с первого дня игры, в том числе в сценарии 1996 года: Чечня получает организацию +2 %, еженедельные людские ресурсы +5, прирост политической власти −2 % и максимум планирования +5 %. Каждое принятое решение о добровольцах усиливает модификатор и добавляет к этим значениям ещё столько же."
 CHE_unso_corps_cat: "Расширение корпуса УНСО"
 CHE_unso_corps_cat_desc: "«Расширение корпуса УНСО» — вторая, неофициальная часть украинской истории в Чечне. Отряд «Викинг» был символом: несколько десятков украинских националистов в Грозном, которых показывали по телевидению и обсуждали в Думе. Корпус УНСО — уже не символ, а попытка построить настоящую армию на чужой земле.\n\nВкладка открывается только после того, как Киев даёт согласие на расширенную помощь. Это согласие не появляется само: в историческом режиме официальная Украина 1990-х балансирует между Москвой и Западом и никогда не признает себя стороной войны, поэтому расширение недоступно. Вне исторического режима считается, что украинские националисты получили достаточно веса, чтобы протолкнуть решение, и согласие даётся всегда.\n\nВнутри вкладки — три решения и три бригады: пехотная, артиллерийская и бронетанковая. Пехота открывается первой: винтовки, миномёты, снайперские пары и опыт уличных боёв. Артиллерия требует уже настоящей логистики — орудия, снаряды, прислуга, сапёры и пехотное охранение. Бронетанковый корпус — вершина плана: танки и БТР, купленные у украинской армии, трофеи и ремонт на месте.\n\nКаждое решение стоит политической власти, приводит одну бригаду с полным снаряжением и увеличивает общий счёт людей, которых Украина готова отпустить. Счёт ограничен: корпус существует, пока Киев делает вид, что ничего не происходит, и каждый новый батальон приближает тот момент, когда делать вид станет невозможно.\n\nКорпус УНСО не заменяет чеченскую армию и не решает исход войны. Он даёт то, чего у добровольцев из Грозного никогда не было, — штаб, тыл и вторую линию обороны.\n\nИ ещё одна деталь: любая помощь из Киева — это всегда игра на грани. Пока официально Украины в Чечне нет, любую поставку можно объявить частной инициативой, а любого пленного — туристом. Чем больше корпус, тем труднее держать эту маску: рано или поздно в Москве и в Киеве найдутся люди, которым выгодно назвать вещи своими именами. Поэтому расширение корпуса — не только военное, но и политическое решение, и принимать его стоит с ясной головой."
 CHE_vol_afghan: "Афганские моджахеды"
 CHE_vol_afghan_desc: "Афганские моджахеды — самая неоднозначная группа иностранцев в Чечне. В источниках 1999–2000 годов афганцы упоминаются постоянно: ветераны войны с советскими войсками, талибы, бойцы из Кабула и Кандагара, приезжавшие через Пакистан и Иран. Одни исследователи считают, что речь шла о десятках людей, другие — что о сотнях, но сам факт присутствия афганцев у Хаттаба и в дагестанских джамаатах не оспаривается. Они приносили с собой опыт партизанской войны, минно-подрывного дела и работы в горах, а также афганскую дисциплину, которая плохо сочеталась с вольницей чеченских отрядов. Отдельного признанного командира-афганца в Чечне назвать нельзя, поэтому в игре отряд представлен как сборная группа. При этом именно афганский опыт считался у Хаттаба образцовым: выпускники лагерей в Хосте и Джелалабаде ценились выше всех, а их учебные конспекты ходили по Чечне в виде самодельных брошюр.\n\nОфицер дивизии: §YКомандир афганского отряда§!."
 CHE_vol_afghan_tt: "§YАфганские моджахеды§!\n\nОфицер дивизии: §YКомандир афганского отряда§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_arab: "Арабский отряд Абу аль-Валида"
 CHE_vol_arab_desc: "Арабский отряд Абу аль-Валида — саудовца, пришедшего в Чечню через Афганистан, Боснию и Таджикистан, — был второй по значению группой иностранных моджахедов после бригады Хаттаба. Абу аль-Валид держался в тени, почти не давал интервью и не пускал к себе телекамеры, зато его люди отвечали за минную войну, засады на дорогах и охрану «арабских» денег, шедших на войну. Отряд формировался из уроженцев Саудовской Аравии, Йемена и Марокко, часть бойцов приходила из лагерей в Афганистане и Пакистане. После гибели Хаттаба в 2002 году именно Абу аль-Валид возглавил всех иностранных моджахедов в Чечне. Российские источники не раз объявляли его убитым, но он появлялся снова, пока в апреле 2004 года не погиб в Ца-Ведено.\n\nОфицер дивизии: §YАбу аль-Валид аль-Гамиди§!."
 CHE_vol_arab_tt: "§YАрабский отряд Абу аль-Валида§!\n\nОфицер дивизии: §YАбу аль-Валид аль-Гамиди§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_azerb: "Азербайджанские добровольцы"
 CHE_vol_azerb_desc: "Азербайджанские добровольцы приходили в Чечню двумя путями: через Дагестан по горным тропам и через Грузию, где границы в 1990-е фактически не существовало. Мотивация была разной — от исламской солидарности до кавказской солидарности и личных связей: многие азербайджанцы воевали в Карабахе и Абхазии и воспринимали Чечню как ещё один фронт большой кавказской войны. По данным российской стороны, речь шла примерно о ста пятидесяти гражданах Азербайджана, переброшенных через границу мелкими группами. Они действовали в составе чеченских отрядов, чаще всего в южных районах и в Аргунском ущелье, и почти не упоминаются как отдельная часть: у группы не было ни своего штаба, ни известного командира.\n\nОфицер дивизии: §YКомандир азербайджанского отряда§!."
 CHE_vol_azerb_tt: "§YАзербайджанские добровольцы§!\n\nОфицер дивизии: §YКомандир азербайджанского отряда§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_baltic: "Прибалтийские добровольцы"
 CHE_vol_baltic_desc: "Прибалтийские добровольцы — самая малочисленная и самая экзотическая группа иностранцев в Чечне. По оценкам российских военных, через войну прошло около восьмидесяти наёмников из Литвы, Латвии и Эстонии, и большинство из них были снайперами: в Литве и Латвии в 1990-е существовали стрелковые клубы и частные военные школы, где готовили метких стрелков. Часть прибалтов была ветеранами локальных конфликтов и наёмничества на Балканах. Больших отрядов они не образовывали, работали малыми группами и нанимались к конкретным командирам, чаще всего к Хаттабу и в отряды пригородов Грозного. Известных имён и фотографий по этой группе практически нет — именно поэтому в игре это отряд без именного офицера.\n\nОфицер дивизии: §YСтарший прибалтийской группы§!."
 CHE_vol_baltic_tt: "§YПрибалтийские добровольцы§!\n\nОфицер дивизии: §YСтарший прибалтийской группы§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_cat: "Иностранные добровольцы"
 CHE_vol_cat_desc: "Вкладка «Иностранные добровольцы» — это история о том, как локальная кавказская война превратилась в точку притяжения для людей со всего мира, и о том, как Грозный пытался этой силой управлять.\n\nЧечня 1990-х была бедной республикой без армии и без промышленности. Собственного военного производства не существовало: винтовки и автоматы приходили со старых советских складов, техника — из арсеналов, купленных у российских офицеров, деньги — от нефти, похищений и исламских фондов. В этих условиях каждый иностранец был на вес золота не потому, что умел воевать, а потому что приносил с собой то, чего у Чечни не было: опыт, связи, деньги, инструкторов и политическую поддержку.\n\nВкладка открывается фокусом «Призыв о помощи»: руководство Ичкерии решается обратиться к внешнему миру, и обращение находит отклик в самых разных кругах — от арабских благотворительных фондов до украинских националистов и балтийских стрелковых клубов.\n\nКаждое решение во вкладке — это отдельная история. Арабские и афганские моджахеды, прошедшие Афганистан, Боснию и Таджикистан, приносят минно-подрывное дело и дисциплину. Турки, азербайджанцы, ингуши и грузины — родственные кавказские сети, через которые идут люди и оружие. Прибалты — снайперскую школу. Дагестанские джамааты — пехоту, которая в августе 1999 года войдёт в Дагестан. Украинцы — единственную силу, способную стать регулярным соединением.\n\nМеханика вкладки проста: решение стоит политической власти, приводит в Чечню дивизию с историческим командиром и полным снаряжением и усиливает модификатор «Иностранные добровольцы». Каждое новое решение делает следующее дороже по цене: приток людей растёт, организация и планирование улучшаются, но за каждого добровольца приходится платить политической властью, а поток со временем иссякает.\n\nВкладка не даёт мгновенной победы. Она даёт то, чего у Чечни не было в 1996 году, — глубину: людей, оружие и время."
 CHE_vol_georgia: "Грузинские добровольцы"
 CHE_vol_georgia_desc: "Грузинские добровольцы появились в Чечне благодаря опыту Абхазии и Цхинвала, но с обратным знаком: воевав против Сухума и Южной Осетии, многие грузины видели в Чечне естественного союзника против России. Через Тбилиси и приграничные районы в 1990-е шли не только люди, но и оружие, документы и деньги. По разным данным, речь шла о нескольких десятках бойцов, часть которых действовала в Грозном в составе отрядов Дудаева и Масхадова. После 1999 года связи шли через Панкисское ущелье, где жили чеченцы-кистинцы, и через Азербайджан. Собственного штаба и признанного командира у грузинской группы не было, поэтому в игре она существует как отряд без именного офицера.\n\nОфицер дивизии: §YКомандир грузинского отряда§!."
 CHE_vol_georgia_tt: "§YГрузинские добровольцы§!\n\nОфицер дивизии: §YКомандир грузинского отряда§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_hattab: "Исламская международная миротворческая бригада"
 CHE_vol_hattab_desc: "Исламская международная миротворческая бригада выросла из отряда иорданца Хаттаба, который появился в Чечне в 1995 году и быстро превратился в самую боеспособную часть сопротивления. Ядро бригады составляли арабы, прошедшие Афганистан, Боснию и Таджикистан, а вокруг них строились учебные лагеря в Сержень-Юрте, где готовили диверсантов, снайперов и минёров. Бригада действовала как самостоятельная сила: она не подчинялась напрямую ни президенту Ичкерии, ни полевым командирам и финансировалась из-за границы через исламские фонды. Для Грозного она была одновременно ценным союзником и политической проблемой: чужие деньги и чужие командиры давали поводы говорить о потере контроля над войной. В 1998 году бригада насчитывала от четырёхсот до полутора тысяч штыков, а её бойцы стали ударной силой вторжения в Дагестан летом 1999 года.\n\nОфицер дивизии: §YХаттаб (Самер Салех ас-Сувейлем)§!."
 CHE_vol_hattab_tt: "§YИсламская международная миротворческая бригада§!\n\nОфицер дивизии: §YХаттаб (Самер Салех ас-Сувейлем)§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_ingush: "Ингушские добровольцы"
 CHE_vol_ingush_desc: "Ингушские добровольцы — самая близкая к Чечне группа, связанная с ней родством, языком и общей историей депортации 1944 года. Ингушетия и Чечня в 1990-е формально разделились, но границы между сёлами фактически не существовало, и люди уходили воевать целыми фамилиями. Ингушские отряды действовали в западных районах Чечни — у Ассиновской, Серноводска, Троицкого и в Пригородном районе, где спор о земле был особенно острым. По оценкам, речь шла о сотнях людей, но отдельной ингушской части с собственным штабом не существовало: отряды вливались в чеченские подразделения и действовали вместе с ними. Поэтому и в игре это союзная, но не самостоятельная сила. Отдельная сложность — политика: ингушские лидеры в 1990-е старались не ссориться с Москвой, и потому ингушские добровольцы уходили в Чечню как частные лица, без приказов и без официальных бумаг, что облегчает Грозному вербовку, но затрудняет учёт людей.\n\nОфицер дивизии: §YКомандир ингушского отряда§!."
 CHE_vol_ingush_tt: "§YИнгушские добровольцы§!\n\nОфицер дивизии: §YКомандир ингушского отряда§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_instr: "Иностранные инструкторы лагерей"
 CHE_vol_instr_desc: "Отряд инструкторов — не строевая часть, а кадровый аппарат учебных лагерей Хаттаба: люди, которые учили остальных. Лагеря под Сержень-Юртом, в Веденском и Шатойском районах официально назывались учебным центром «Кавказ» и за несколько лет дали тысячи выпускников: подрывников, снайперов, пулемётчиков, связистов. Инструкторами были не только арабы: в лагерях преподавали турки, иорданцы, пакистанцы, ветераны Афганистана и Боснии, а также чеченцы, прошедшие те же курсы годом раньше. Программа была жёсткой и практичной: минно-подрывное дело, тактика малых групп, засады, работа с картой и рацией, стрельба, физическая подготовка и религиозное наставление. Именно инструкторы делали из добровольцев солдат — и именно поэтому их лагеря считались приоритетной целью федеральных войск.\n\nОфицер дивизии: §YСтарший инструктор лагерей§!."
 CHE_vol_instr_tt: "§YИностранные инструкторы лагерей§!\n\nОфицер дивизии: §YСтарший инструктор лагерей§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_jamaat: "Джамааты Дагестана"
 CHE_vol_jamaat_desc: "Джамааты Дагестана — сеть ваххабитских общин и военных лагерей, выросшая в конце 1990-х на границе Чечни и Дагестана. Наиболее известными центрами были кадарская зона, Карамахи и Чабанмахи, а также учебный центр «Кавказ» под Сержень-Юртом. Движение возглавлял Багаутдин Кебедов, а вместе с ним — его братья и полевые командиры из числа дагестанцев, учившихся в лагерях Хаттаба. Джамааты дали ту самую пехоту, которая в августе 1999 года вошла в Ботлихский и Новолакский районы: около двух тысяч бойцов, частью дагестанцы, частью иностранцы и чеченцы. Для Грозного это была ставка на экспорт войны и на создание исламского государства от Каспия до Кавказского хребта, а для Москвы — повод для второй чеченской кампании.\n\nОфицер дивизии: §YБагаутдин Кебедов§!."
 CHE_vol_jamaat_tt: "§YДжамааты Дагестана§!\n\nОфицер дивизии: §YБагаутдин Кебедов§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
