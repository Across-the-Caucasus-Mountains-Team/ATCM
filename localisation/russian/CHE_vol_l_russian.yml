 CHE_vol_palest: "Сирийско-палестинские группы"
 CHE_vol_palest_desc: "Сирийско-палестинские группы в Чечне принято считать частью «арабского интернационала» Хаттаба, но в источниках они упоминаются и отдельно: палестинцы и сирийцы, прошедшие лагеря в Ливане, Сирии и долине Бекаа, прибывали через Турцию и Грузию и распределялись по учебным центрам. Их навыки ценились в минно-подрывной войне и в городских боях: опыт Бейрута был ближе к Грозному, чем опыт Афганистана. Часть этих людей занималась не столько боевой работой, сколько инструкторской и организационной: связями, деньгами, документами, переправкой новых добровольцев. Как и у большинства иностранных групп, у них не было ни единого командира, ни собственного штаба — только общая сеть, которая держалась на личных знакомствах.\n\nОфицер дивизии: §YКомандир сирийско-палестинской группы§!."
 CHE_vol_palest_tt: "§YСирийско-палестинские группы§!\n\nОфицер дивизии: §YКомандир сирийско-палестинской группы§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_turk: "Турецкие добровольцы"
 CHE_vol_turk_desc: "Турецкие добровольцы появились в Чечне ещё в первую войну и упоминаются в разведсводках как одна из заметных групп иностранцев — до двух сотен человек по оценкам военной разведки. Часть из них была ветеранами турецких националистических организаций, часть — турками-месхетинцами и выходцами с Кавказа, для которых Чечня была продолжением борьбы за Кавказ. Турки воевали небольшими группами, чаще всего при Хаттабе, и выполняли те же задачи, что и остальные иностранные моджахеды: засады, минирование, инструкторская работа в лагерях. Отдельного признанного командира у них в источниках нет: отряд собирался и распадался, а люди переходили из подразделения в подразделение. Именно поэтому в игре это сборная группа без единого имени.\n\nОфицер дивизии: §YЭмир турецкого отряда§!."
 CHE_vol_turk_tt: "§YТурецкие добровольцы§!\n\nОфицер дивизии: §YЭмир турецкого отряда§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_ukraine_extended: "Попросить расширенную помощь у Украины"
 CHE_vol_ukraine_extended_desc: "Расширенная помощь Украины — это переход от символической солидарности к настоящей ставке. После «Призыва о помощи» в Киеве начинается торг: Служба безопасности, министерство обороны и националистические организации взвешивают риски, и исход зависит от того, кто в Киеве сильнее. В историческом режиме Украина не согласится никогда: официальный Киев в 1990-е балансировал между Москвой и Западом и не хотел признавать себя стороной войны. Вне исторического режима согласие даётся всегда: считается, что украинские националисты получили в свои руки достаточный вес, чтобы протолкнуть решение. Согласие открывает отдельную вкладку, где собирается корпус УНСО из трёх бригад: пехотной, артиллерийской и бронетанковой. Каждая бригада проходит свой путь — от винтовок до танков, и каждая делает участие Украины всё более явным.\n\nУкраина соглашается с вероятностью §Y50 %%§!: в историческом режиме она не согласится никогда, вне исторического режима — согласится всегда. Согласие открывает вкладку «Расширение корпуса УНСО»."
 CHE_vol_ukraine_extended_refused_tt: "§RУкраина отказала§!\nВ историческом режиме расширенная помощь невозможна — решение больше не появится."
 CHE_vol_ukraine_extended_tt: "§YУкраина согласилась§!\nОткрыта вкладка §Y«Расширение корпуса УНСО»§!: пехота, артиллерия и танки.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_unso: "Отряд «Викинг» УНА-УНСО"
 CHE_vol_unso_art: "Артиллерийская бригада УНСО"
 CHE_vol_unso_art_desc: "Артиллерийская бригада УНСО отражает мечту любой добровольческой армии: не бегать под огнём, а отвечать. Планировалось, что чеченская артиллерия, слабая и разрозненная в первую войну, получит от украинской диаспоры и с чёрного рынка орудия и миномёты, а УНА-УНСО даст прислугу, обученную в советских частях и училищах. Вместе с двумя артиллерийскими батареями бригада несёт пехотное охранение и сапёрную роту — без них батарея в горах живёт до первого авианалёта. Практика была жёстче: орудия заканчивались быстрее, чем снаряды, а расчёты — быстрее, чем орудия. И всё же артиллерия — то немногое, что позволяло обороняющемуся Грозному отвечать на массированные обстрелы, и то, что превращало отряд в соединение.\n\nОфицер дивизии: §YКомандир артиллерийской бригады УНСО§!."
 CHE_vol_unso_art_tt: "§YАртиллерийская бригада УНСО§!\n\nОфицер дивизии: §YКомандир артиллерийской бригады УНСО§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_unso_desc: "Отряд «Викинг» УНА-УНСО — самая известная украинская часть первой чеченской войны. Он появился в Грозном в декабре 1994 года: несколько десятков украинских националистов, которых вёл Александр Музычко по прозвищу «Сашко Билый», а идейно вдохновлял Дмитрий Корчинский. За всю войну через отряд прошло, по разным оценкам, от семидесяти до трёхсот человек. Бойцы действовали в составе чеченских подразделений, занимались диверсиями, снайперским огнём и охраной высокопоставленных лиц, включая Джохара Дудаева. Для Киева и для Москвы отряд был прежде всего политической демонстрацией, а уже потом военной единицей: украинские националисты показывали, что война на Кавказе — их война тоже. После 1996 года часть бойцов вернулась домой, но связи с чеченским подпольем сохранялись.\n\nОфицер дивизии: §YАлександр Музычко («Сашко Билый»)§!."
 CHE_vol_unso_inf: "Пехотная бригада УНСО"
 CHE_vol_unso_inf_desc: "Пехотная бригада корпуса УНСО — это уже не отряд «Викинг», а полноценное соединение из четырёх батальонов, миномётной батареи и снайперской группы: попытка превратить добровольческое движение УНА-УНСО в регулярную армию, пусть и на чужой земле. Украинские националисты не были бедны идеями, но были бедны производством, поэтому пехота — самая реалистичная часть плана: винтовки, миномёты, снайперские пары и опыт уличных боёв в Грозном, полученный в 1994–1996 годах. Тыловое обеспечение бригады — отдельная проблема: оружие идёт со складов, купленных у украинских офицеров, деньги — из сборов диаспоры. Но именно пехота удерживает город и заполняет окопы, и потому она открыта первой. Командиры бригады — люди, прошедшие Грозный 1995 года, где уличный бой учил быстрее любого училища, и это единственный вид опыта, который нельзя купить за деньги диаспоры.\n\nОфицер дивизии: §YКомандир пехотной бригады УНСО§!."
 CHE_vol_unso_inf_tt: "§YПехотная бригада УНСО§!\n\nОфицер дивизии: §YКомандир пехотной бригады УНСО§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_unso_tank: "Бронетанковый корпус УНСО"
 CHE_vol_unso_tank_desc: "Бронетанковый корпус УНСО — самая фантастическая часть украинского плана и вместе с тем самая опасная для противника. Два танковых взвода, три роты на БТР, снайперы и конная разведка — это не набор на бумаге, а попытка собрать мобильный резерв, который мог бы контратаковать на дорогах и в предгорьях, где бронетехника ещё может двигаться. В 1994–1995 годах именно танки и БТР в уличных боях были главным аргументом обеих сторон. В реальности техника приходит из арсеналов, купленных у украинской армии, из трофеев и из ремонта на месте: каждый танк здесь — событие, каждая потеря — политический скандал в Киеве и в Москве. Тем не менее корпус — вершина того, что УНА-УНСО могла бы развернуть в Чечне.\n\nОфицер дивизии: §YКомандир бронетанкового корпуса УНСО§!."
 CHE_vol_unso_tank_tt: "§YБронетанковый корпус УНСО§!\n\nОфицер дивизии: §YКомандир бронетанкового корпуса УНСО§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_unso_tt: "§YОтряд «Викинг» УНА-УНСО§!\n\nОфицер дивизии: §YАлександр Музычко («Сашко Билый»)§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_vol_white_stockings: "Белые колготки"
 CHE_vol_white_stockings_desc: "«Белые колготки» — легенда первой чеченской войны: женщины-снайперы из Литвы и Латвии, воевавшие на стороне Ичкерии. В слухах и в прессе они выглядели почти мифом — красивые женщины с винтовками, от которых гибли офицеры на блокпостах. Реальность была скромнее: несколько десятков прибалтийских женщин, частью профессиональных спортсменок-стрелков, частью наёмниц, которые работали в составе чеченских отрядов, вели «снайперский террор» на дорогах и уходили в горы вместе с отрядами. Их главным оружием была СВД, а главной тактикой — работа по офицерам и связистам на блокпостах и перекрёстках. Имён в источниках почти не осталось, зато остался образ, который оказался сильнее любых документов. Это единственная часть во вкладке, для которой снайперская винтовка — не поддержка, а основное оружие.\n\nОфицер дивизии: §YСкирманта Скайстилковна§!."
 CHE_vol_white_stockings_tt: "§YБелые колготки§!\n\nОфицер дивизии: §YСкирманта Скайстилковна§!.\n\n§YМодификатор «Иностранные добровольцы» будет изменён§!"
 CHE_white_stockings_idea: "Белые колготки"
 CHE_white_stockings_idea_desc: "Литовские женщины-снайперы, воюющие на стороне Чечни. Держится год, пока о них говорят и пока им платят."
