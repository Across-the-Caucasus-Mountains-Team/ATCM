 RAS_presidency_of_eltsin: "Президентство Ельцина"
 RAS_presidency_of_eltsin_desc: "Ельцин был избран президентом России. Он реформатор, который хочет построить новую Россию, но он также жёсткий человек, который хочет подавить сепаратистов и восстановить порядок в стране. Балансировка этих двух целей будет сложной, но необходимой для будущего России."
 RAS_emergency_powers: "Чрезвычайные полномочия"
 RAS_emergency_powers_desc: "Чрезвычайные полномочия необходимы для восстановления порядка в стране. Мы должны подавить сепаратистов и восстановить стабильность в России. Это будет нелегко, но необходимо для будущего нашей великой нации."
 RAS_updated_federal_treaty: "Обновлённый Федеративный договор"
 RAS_updated_federal_treaty_desc: "Обновлённый Федеративный договор направлен на решение проблем различных республик и предоставление им большей автономии при сохранении целостности Российской Федерации. Это тонкий баланс, который необходимо соблюсти для обеспечения стабильности страны."
 RAS_the_seventh_congress_of_deputies: "Седьмой съезд народных депутатов"
 RAS_the_seventh_congress_of_deputies_desc: "Седьмой съезд народных депутатов — это важный момент в истории Российской Федерации. Это возможность для различных республик собраться вместе и обсудить свои проблемы в рамках федерального правительства."
 RAS_leave_gaidar: "Уйти от Гайдара"
 RAS_leave_gaidar_desc: "Гайдар был спорной фигурой в российской политике, и его уход из правительства станет важным моментом в истории Российской Федерации. Это возможность для новых лиц и идей появиться и для страны двигаться вперёд."
 RAS_gaydaras_resignation: "Отставка Гайдара"
 RAS_gaydaras_resignation_desc: "Отставка Гайдара — это важный момент в истории Российской Федерации. Отставка Гайдара также позволит более сбалансированно подходить к управлению, с акцентом как на экономические реформы, так и на стабильность. Возможно, вместо шоковой терапии мы сможем иметь более постепенный подход к экономическим реформам, который учитывает потребности народа и экономики."
 RAS_the_eighth_congress_of_deputies: "Восьмой съезд народных депутатов"
 RAS_black_october: "Чёрный Октябрь"
 RAS_black_october_desc: "Правительство распущено, парламент в хаосе. Военные на улицах, и люди напуганы. Это критический момент в истории Российской Федерации, который определит будущее страны."
