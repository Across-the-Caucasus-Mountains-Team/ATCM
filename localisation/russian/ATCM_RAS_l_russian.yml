 russia.20.t: "Российский ультиматум"
 russia.20.d: "Российская Федерация выдвинула ультиматум: сдаться федеральной власти, разоружить все незаконные вооружённые формирования и распустить правительственные структуры Чеченской Республики Ичкерия. Принятие таких условий означало бы конец независимости, за которую наш народ боролся с 1991 года. Президент Джохар Дудаев отвергает ультиматум. По Грозному и республике раздаются призывы к мобилизации. Буря приближается."
 russia.20.a: "Пусть идут к чёрту!"
 russia.21.t: "Чечня отвергает ультиматум"
 russia.21.d: "Несмотря на дипломатические усилия и официальные предупреждения, власти Чеченской Республики Ичкерия во главе с Джохаром Дудаевым отклонили российский ультиматум. Требование о добровольной реинтеграции в конституционную систему, разоружении незаконных вооружённых формирований и восстановлении федеральной власти было проигнорировано. В ответ федеральное руководство теперь рассматривает военное решение для восстановления порядка и защиты гражданского населения."
 russia.21.a: "Война неизбежна"
 russia.22.t: "Голос против войны"
 russia.22.d: "В крупнейших городах России вспыхнули массовые антивоенные митинги, направленные против продолжающейся военной кампании в Чечне. Тысячи людей вышли на улицы Москвы, Санкт-Петербурга, Нижнего Новгорода и других городов, требуя немедленного прекращения огня и начала мирных переговоров. Среди протестующих — оппозиционные политики, правозащитники, деятели культуры и обычные граждане, возмущённые масштабами разрушений и числом жертв среди мирного населения. Несмотря на попытки правительства ограничить демонстрации и арестовать наиболее заметных организаторов, протестное движение набирает силу, создавая серьёзный вызов внутренней политике Кремля."
 russia.22.a: "Подавить протесты"
 russia.25.t: "Война затянулась"
 russia.25.d: "Ожидалось, что военная операция в Чечне будет быстрой и решительной, но сопротивление оказалось гораздо более ожесточенным. Чеченские вооруженные формирования продолжают удерживать ключевые населенные пункты, ведут партизанскую войну в горах и отказываются от любых переговоров, предполагающих сдачу позиций. Российские войска несут тяжелые потери, общественное мнение в стране становится все более негативным, а международное сообщество выражает обеспокоенность эскалацией конфликта. Кремлю необходимо выбрать стратегию: ужесточить военные меры или искать компромисс.\""
 russia.25.b: "Нужно что-то делать!"
 russia.27.t: "Россия перед выборами"
 russia.27.d: "После нескольких лет экономических потрясений и войн Россия подошла к 1996 году истощённой и расколотой. Народ устал от хаоса реформ, от задержек зарплат и от безысходности. Президент Борис Ельцин, утративший популярность, сталкивается с мощным вызовом со стороны коммунистов, мечтающих вернуть «порядок и стабильность» советских времён. Тем временем олигархи, западные советники и генералы внимательно следят за развитием событий, ведь исход выборов решит, каким путём пойдёт Россия — реформ или реванша."
 russia.27.a: "Понятно"
 russia.28.t: "Убийство Дмитрия Холодова"
 russia.28.d: "Сегодня страну потрясла трагическая новость. Известный журналист \"Московского комсомольца\" Дмитрий Холодов, занимавшийся расследованием коррупции в армии и хищений во время чеченской кампании, погиб в своём офисе после того, как вскрыл чемодан, принесённый ему «от надёжного источника». Взрыв разорвал кабинет, а следы преступления тут же были тщательно замяты. Общественность требует расследования, но военные структуры спешат откреститься от любых обвинений. В кулуарах шепчутся, что Холодов был слишком близок к разглашению опасных фактов о торговле оружием и незаконных схемах снабжения. Эта смерть стала символом того, насколько опасно стало искать правду в новой России."
 russia.28.a: "Нужно расследовать"
 russia.29.t: "Десант ВДВ в Грозном"
 russia.29.d: "В ходе решающей фазы операции в Чечне российские ВДВ провели дерзкий десант в аэропорту Грозного. Целью было захватить стратегический объект и обеспечить плацдарм для дальнейшего наступления на столицу республики. Несмотря на ожесточённое сопротивление чеченских боевиков, десантники успешно закрепились в аэропорту, что стало важным тактическим успехом. Однако бои продолжаются, и судьба операции зависит от способности российских войск удержать захваченные позиции и продвинуться дальше вглубь республики."
 russia.29.a: "Работайте братья!"

 russia.40.t: "Аэропорт Грозного удержан!"
 russia.40.d: "Российским войскам удалось удержать аэропорт Грозного, несмотря на неоднократные попытки чеченских формирований восстановить над ним контроль.\n\nУспешное удержание аэропорта открывает перед российским командованием новые возможности. Взлётно-посадочная полоса может быть использована для переброски дополнительных войск. Однако для организации масштабных воздушных перевозок необходимо обеспечить безопасность аэродрома.\n\nГенеральный штаб уже подготовил план по дальнейшему развитию операции. План предусматривает вторую масштабную волну лёгкого десанта непосредственно в аэропорт Грозного с целью обеспечения надёжной защиты взлётно-посадочной полосы. Также предполагается проведение отдельной операции по захвату военного аэродрома Ханкала, что позволит расширить российское присутствие к востоку от города и создать дополнительное направление наступления."
 russia.40.a: "Развить успех любой ценой!"

 RAS_hold_airport: "Удержать аэропорт Грозного"
 RAS_hold_airport_desc: "Для переброски дополнительных сил Нашим подразделениям необходимо удерживать аэропорт Грозного. Потеря аэродрома и уничтожение нашего десанта станет фактическим провалом нашего блицкрига, направленного на быстрое окружение и захват Грозного силами ВДВ."

 RAS_send_airport_reinforcements: "Перебросить подкрепления в аэропорт Грозного"
 RAS_send_airport_reinforcements_desc: "Нашим войскам удалось захватить плацдарм на территории аэропорта Грозного. Несмотря на продолжающиеся бои, мы получили возможность использовать вертолёты для переброски дополнительных подразделений и снабжения..\n\nОднако положение остаётся крайне опасным.В нынешних условиях посадка тяжёлых военно-транспортных самолётов сопряжена с чрезмерным риском. Для организации полномасштабного воздушного моста нам необходимо полностью обеспечить надёжную защиту взлётно-посадочной полосы."

 RAS_send_VDV_to_Samashki: "Операция по захвату Ханкалы"
 RAS_send_VDV_to_Samashki_desc: "Командование предлагает провести воздушно-десантную операцию по захвату военного аэродрома Ханкала, расположенного к востоку от Грозного. \n\nУспешная высадка десанта в аэропорту Грозного и на аэродроме Ханкала позволит нанести комбинированный удар по чеченской столице в результате Грозный окажется в полуокружении, а Защитники города окажутся дезорганизованы, поскольку им придётся одновременно противостоять двум группировкам российских войск.\n\nПосле захвата аэродрома и обеспечения безопасной посадки самолётов мы сможем перебросить в Ханкалу дополнительные силы необходимые для начала полномасштабному штурму Грозного с двух сторон."

