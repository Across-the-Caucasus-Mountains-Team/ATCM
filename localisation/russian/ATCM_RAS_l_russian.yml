 RAS_expand_factories_in_krasondar: "Расширить заводы в Краснодаре"
 RAS_the_war_dragged_on_desc: "Военная операция в Чечне должна была стать быстрой и решительной, однако сопротивление оказалось гораздо сильнее ожидаемого. Чеченские вооружённые формирования удерживают ключевые населённые пункты, ведут партизанскую войну в горах и отказываются от переговоров, предполагающих сдачу позиций. Российские войска несут тяжёлые потери."
 RAS_take_tough_measures_desc: "§RПринять жёсткие меры§!"
 RAS_take_Grozny_desc: "Взять Грозный под контроль наших войск."
 set_var_to_100_tt: "§YУстановить значение показателя на 50.§!"
 RAS_seventieth_years_of_the_union_desc: "Поддержка извне может сыграть решающую роль в будущем страны. Настало время реализовать «69 лет Союза»."
 RAS_continue_perestroika_desc: "Борьба за поддержку населения не менее важна, чем борьба за территорию. Следует заняться вопросом «Продолжить перестройку»."
 RAS_Economic_Question_desc: "Без надёжной хозяйственной основы невозможно обеспечить стабильное будущее. Начнём работу по направлению «Экономический вопрос»."
 RAS_Fund_Daghestani_Farmers_desc: "Перед нами стоит непростая задача. Реализация направления «Финансировать дагестанских фермеров» определит дальнейшие возможности страны."
 RAS_Industralize_Krasnodar_desc: "Положение России требует взвешенных решений. Настало время заняться вопросом «Индустриализация Краснодарского края»."
 RAS_Problems_in_the_west_desc: "Международная обстановка требует осторожного подхода. Инициатива «Проблемы на западе» должна укрепить наши позиции на дипломатической арене."
 RAS_Slavic_Unrest_desc: "Положение России требует взвешенных решений. Настало время заняться вопросом «Славянские волнения»."
 RAS_Rise_of_rukh_in_ukraine_desc: "Перед нами стоит непростая задача. Реализация направления «Рост Руха на Украине» определит дальнейшие возможности страны."
 RAS_Clashes_in_baltics_desc: "Положение России требует взвешенных решений. Настало время заняться вопросом «Столкновения в Прибалтике»."
 RAS_Recognize_Baltic_independence_desc: "Перед нами стоит непростая задача. Реализация направления «Признать независимость Прибалтики» определит дальнейшие возможности страны."
 RAS_Retreat_from_baltics_desc: "От исхода боевых действий зависит слишком многое. Необходимо реализовать «Военный отход из Прибалтики» и подготовиться к дальнейшему развитию кампании."
 RAS_problems_in_the_south_desc: "Положение России требует взвешенных решений. Настало время заняться вопросом «Проблемы на юге»."
 RAS_Karabakh_issue_desc: "События развиваются стремительно, и бездействовать больше нельзя. Решение «Эскалация в Арцахе» станет новым этапом нашего пути."
 RAS_Protest_in_Chechnya_desc: "Политическая стабильность не возникнет сама собой. Решение «Протесты в Чечне» станет важным шагом в борьбе за будущее государства."
 RAS_Clashes_in_south_ossetia_desc: "Перед нами стоит непростая задача. Реализация направления «Столкновения в Южной Осетии» определит дальнейшие возможности страны."
 RAS_Secret_aid_to_ossetians_desc: "Отношения с другими государствами нельзя оставлять без внимания. Направление «Секретная помощь осетинам» станет частью нашей внешней политики."
 RAS_Rise_of_RTFR_in_Georgia_desc: "Положение России требует взвешенных решений. Настало время заняться вопросом «Рост РТ-ФГ в Грузии»."
