 RAS_gkchp:0 "ГКЧП"
 RAS_gkchp_desc:0 "ГКЧП — это группа радикалов, которые хотят востановить СССР и свергнуть Ельцина. Они поддерживаются военными и КГБ, но не пользуются большой популярностью среди народа."
 RAS_hold_a_referendum:0 "Провести референдум"
 RAS_hold_a_referendum_desc:0 "Мы должны провести референдум для определения будущего Совестского Союза. Если люди проголосуют за восстановление СССР, мы его восстановим. Если они проголосуют за независимость, мы уважим их решение."
 RAS_be_against_gkchp:0 "Подавить ГКЧП"
 RAS_be_against_gkchp_desc:0 "Мы должны твёрдо выступить против ГКЧП и их попыток подорвать правительство. Коммунизм мёртв, и мы не должны позволить им вернуть его. Это не 1917 год, это 1991 год."
 RAS_support_gkchp:0 "Поддержать ГКЧП"
 RAS_support_gkchp_desc:0 "Мы должны поддержать ГКЧП и их попытки по восстановлению СССР. Люди устали от хаоса и нестабильности постсоветской эпохи, и они хотят вернуться к стабильности Советского Союза. Мы должны дать им то, чего они хотят."
 RAS_defeat_of_gkchp:0 "Поражение ГКЧП"
 RAS_defeat_of_gkchp_desc:0 "ГКЧП был разгромлен, и народ высказался. Они отвергли идею восстановления СССР и выбрали демократический путь. Мы должны уважать их решение и работать над строительством нового будущего для России."
 RAS_suppress_the_rallies:0 "Подавить протесты"
 RAS_suppress_the_rallies_desc:0 "Мы должны подавить митинги и протесты, которые проходят в поддержку ГКЧП. Мы не можем позволить им подорвать правительство и создать хаос на улицах. Мы должны восстановить порядок и стабильность в нашей великой стране, иначе мы погрузимся в анархию."
