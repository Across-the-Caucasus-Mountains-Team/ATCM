 russia.20.t:0 "Российский ультиматум"
 russia.20.d:0 "Российская Федерация выдвинула ультиматум: сдаться федеральной власти, разоружить все незаконные вооружённые формирования и распустить правительственные структуры Чеченской Республики Ичкерия. Принятие таких условий означало бы конец независимости, за которую наш народ боролся с 1991 года. Президент Джохар Дудаев отвергает ультиматум. По Грозному и республике раздаются призывы к мобилизации. Буря приближается."
 russia.20.a:0 "Пусть идут к чёрту!"
 russia.21.t:0 "Чечня отвергает ультиматум"
 russia.21.d:0 "Несмотря на дипломатические усилия и официальные предупреждения, власти Чеченской Республики Ичкерия во главе с Джохаром Дудаевым отклонили российский ультиматум. Требование о добровольной реинтеграции в конституционную систему, разоружении незаконных вооружённых формирований и восстановлении федеральной власти было проигнорировано. В ответ федеральное руководство теперь рассматривает военное решение для восстановления порядка и защиты гражданского населения."
 russia.21.a:0 "Война неизбежна"
 russia.22.t:0 "Голос против войны"
 russia.22.d:0 "В крупнейших городах России вспыхнули массовые антивоенные митинги, направленные против продолжающейся военной кампании в Чечне. Тысячи людей вышли на улицы Москвы, Санкт-Петербурга, Нижнего Новгорода и других городов, требуя немедленного прекращения огня и начала мирных переговоров. Среди протестующих — оппозиционные политики, правозащитники, деятели культуры и обычные граждане, возмущённые масштабами разрушений и числом жертв среди мирного населения. Несмотря на попытки правительства ограничить демонстрации и арестовать наиболее заметных организаторов, протестное движение набирает силу, создавая серьёзный вызов внутренней политике Кремля."
 russia.22.a:0 "Подавить протесты"
 russia.25.t:0 "Война затянулась"
 russia.25.d:0 "Ожидалось, что военная операция в Чечне будет быстрой и решительной, но сопротивление оказалось гораздо более ожесточенным. Чеченские вооруженные формирования продолжают удерживать ключевые населенные пункты, ведут партизанскую войну в горах и отказываются от любых переговоров, предполагающих сдачу позиций. Российские войска несут тяжелые потери, общественное мнение в стране становится все более негативным, а международное сообщество выражает обеспокоенность эскалацией конфликта. Кремлю необходимо выбрать стратегию: ужесточить военные меры или искать компромисс.""
 russia.25.b:0 "Нужно что-то делать!"
 russia.27.t:0 "Россия перед выборами"
 russia.27.d:0 "После нескольких лет экономических потрясений и войн Россия подошла к 1996 году истощённой и расколотой. Народ устал от хаоса реформ, от задержек зарплат и от безысходности. Президент Борис Ельцин, утративший популярность, сталкивается с мощным вызовом со стороны коммунистов, мечтающих вернуть «порядок и стабильность» советских времён. Тем временем олигархи, западные советники и генералы внимательно следят за развитием событий, ведь исход выборов решит, каким путём пойдёт Россия — реформ или реванша."
 russia.27.a:0 "Понятно"
 russia.28.t:0 "Убийство Дмитрия Холодова"
 russia.28.d:0 "Сегодня страну потрясла трагическая новость. Известный журналист "Московского комсомольца" Дмитрий Холодов, занимавшийся расследованием коррупции в армии и хищений во время чеченской кампании, погиб в своём офисе после того, как вскрыл чемодан, принесённый ему «от надёжного источника». Взрыв разорвал кабинет, а следы преступления тут же были тщательно замяты. Общественность требует расследования, но военные структуры спешат откреститься от любых обвинений. В кулуарах шепчутся, что Холодов был слишком близок к разглашению опасных фактов о торговле оружием и незаконных схемах снабжения. Эта смерть стала символом того, насколько опасно стало искать правду в новой России."
 russia.28.a:0 "Нужно расследовать"
 
