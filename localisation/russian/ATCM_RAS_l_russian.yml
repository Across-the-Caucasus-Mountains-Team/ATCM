 RAS_peace_negotiations_first_chechen_war_decision_desc: "Кровопролитие в Чечне затягивается. Несмотря на ожесточённые бои, растущие потери среди солдат и мирного населения вызывают недовольство в российском обществе. В правительстве и вооружённых силах усиливаются призывы к политическому решению. \n\nПрогресс переговоров: §G[?RAS_negotiation_process_fcw_value|%%]§!"
