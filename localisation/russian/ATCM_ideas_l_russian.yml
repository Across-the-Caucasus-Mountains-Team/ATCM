 RAS_resources_beyond_caucasus_desc: "Большая часть сырьевой базы России находится за пределами карты. Нефтяные месторождения Западной Сибири и Поволжья, металлургические центры Урала и другие промышленные регионы обеспечивают страну стратегически важными ресурсами."

 
 AZR_Black_January_idea: "Чёрный январь"
 AZR_Black_January_idea_desc: "\n\n\n\n£GFX_idea_Black_January_desc_photo\n\n\n\n\n\n\n 19 января Советские войска вошли в Баку и начали разгон протестов. Первый погибший появился за пределами города, а затем танки и солдаты убили ещё больше протестующих в самом Баку — погибло от 135 до 170 человек. После этого началась 40-дневная общенациональная забастовка, в ходе которой азербайджанцы вышли на улицы в память о жертвах Чёрного января."
 
