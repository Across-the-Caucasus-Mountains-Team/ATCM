 SAK_State_of_emergency: "Чрезвычайное положение"
 SAK_State_of_emergency_desc: "\n\n\n\n£GFX_idea_State_of_Emergency_desc_photo\n\n\n\n\n\n\n 23 сентября повстанческие фракции Национальной гвардии под руководством Тенгиза Китовани вошли в Тбилиси, поддержали оппозицию и захватили телевышку. 24 сентября Звиад Гамсахурдия объявил чрезвычайное положение. Первые вооружённые столкновения с жертвами произошли 25 сентября, когда повстанцы попытались захватить электростанцию, но были отброшены полицией. В результате столкновения погибли 4 человека."
 SAK_Clashes_in_south_ossetia: "Столкновения в Южной Осетии"
 SAK_Clashes_in_south_ossetia_desc: "\n\n\n\n£GFX_idea_Clashes_in_ossetia_desc_photo\n\n\n\n\n\n\n  5 января 1991 года осетинское ополчение открыло огонь по военнослужащим Национальной гвардии в Цхинвали, что привело к боевым действиям. Осетины построили баррикады, а Национальная гвардия испытывает трудности с подавлением сопротивления."
 SAK_Blitz_in_Abkhazia: "Блиц в Абхазии"
 SAK_Blitz_in_Abkhazia_desc: "\n\n\n\n£GFX_idea_Blitz_Abkhazia_desc_photo\n\n\n\n\n\n\n Танки вперёд BRRRRRRRRRRRR"
 SAK_Ruins_of_central_tbilisi: "Разрушенный Тбилиси"
 SAK_Ruins_of_central_tbilisi_desc: "\n\n\n\n£GFX_idea_Ruins_of_Tbilisi_desc_photo\n\n\n\n\n\n\n  После переворота Тбилиси остался в руинах и с повреждёнными зданиями."
 SAK_Overcrowded_Hospitals: "Переполненные больницы"
 SAK_Overcrowded_Hospitals_desc: "\n\n\n\n£GFX_idea_Overcrowded_Tbilisi_desc_photo\n\n\n\n\n\n\n После переворота в Тбилиси больницы оказались переполнены. Помимо большого количества пациентов, в больницах не хватает оборудования, что осложняет лечение."
 SAK_Zviadists_in_the_west: "Сопротивление Звиадистов"
 SAK_Zviadists_in_the_west_desc: "\n\n\n\n£GFX_idea_Zviadists_desc_photo\n\n\n\n\n\n\n После свержения Гамсахурдии звиадисты (его сторонники) начали беспорядки в Самегрело — его родном регионе. Это вызвало перебои с поставками, а Зугдиди фактически стал оплотом сопротивления, в который наши войска не могут войти без опасности."
 SAK_Zviadists_in_the_west_two: "Сопротивление Звиадистов"
 SAK_Zviadists_in_the_west_two_desc: "\n\n\n\n£GFX_idea_Zviadists_desc_photo\n\n\n\n\n\n\n После свержения Гамсахурдии звиадисты (его сторонники) начали беспорядки в Самегрело — его родном регионе. Это вызвало перебои с поставками, а Зугдиди фактически стал оплотом сопротивления, в который наши войска не могут войти без опасности."
 SAK_military_propaganda: "Военная пропаганда"
 SAK_military_propaganda_desc: "\n\n\n\n£GFX_idea_Military_propaganda_desc_photo\n\n\n\n\n\n\n Присоединяйтесь к вооруженным силам своей славной страны прямо сейчас!"
 SAK_Weak_Georgian_Armed_forces: "Слабые вооружённые силы Грузии"
 SAK_Weak_Georgian_Armed_forces_desc: "\n\n\n\n£GFX_idea_Weak_Armed_Forces_desc_photo\n\n\n\n\n\n\n Наше вооружение и доктрины устарели, большая часть армии контролируется СССР, а солдаты — необученные и деморализованные."
 SAK_Anarchy_in_Georgia: "Анархия в Грузии"
 SAK_Anarchy_in_Georgia_desc: "\n\n\n\n£GFX_idea_Anarchism_in_georgia_desc_photo\n\n\n\n\n\n\n Переворот привёл к анархии. Всплеск преступности, коррупция в полиции, экономический крах — всё это усугубляет ситуацию в стране."
