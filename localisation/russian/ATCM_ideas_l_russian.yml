 SAK_Tbilisi_syndrome: "Трагедия 9 апреля"
 SAK_Tbilisi_syndrome_desc: "\n\n\n\n£GFX_idea_April_Tragedy_desc_photo\n\n\n\n\n\n\n Тбилисская трагедия, также известная как трагедия 9 апреля, произошла 9 апреля 1989 года, когда советские войска открыли огонь по мирной студенческой демонстрации, убив 21 человека (19 женщин и 2 мужчин) и ранив множество других."
 SAK_Tbilisi_syndrome_2: "Трагедия 9 апреля"
 SAK_Tbilisi_syndrome_2_desc: "\n\n\n\n£GFX_idea_April_Tragedy_desc_photo\n\n\n\n\n\n\n Тбилисская трагедия, также известная как трагедия 9 апреля, произошла 9 апреля 1989 года, когда советские войска открыли огонь по мирной студенческой демонстрации, убив 21 человека (19 женщин и 2 мужчин) и ранив множество других."
 SAK_Gamsakhurdias_Speechs: "§YНационально-освободительное движение§"
 SAK_Gamsakhurdias_Speechs_desc: "\n\n\n\n£GFX_idea_Gamsakhurdia_Speech_desc_photo\n\n\n\n\n\n\n После выступлений Гамсахурдии республика становится всё более дестабилизированной, а национализм набирает популярность среди населения. Убийство Гамсахурдии может привести к кровопролитию... Чего мы не хотим. Мы уже убили множество капиталистов, и это заставило многих грузин выступить против нас."
 SAK_Mkhedrioni: "Мхедриони"
 SAK_Mkhedrioni_desc: "\n\n\n\n£GFX_idea_Mkhedrioni_desc_photo\n\n\n\n\n\n\n Военизированная группировка с радикальными взглядами."
 SAK_decommunization_idea: "Декоммунизация"
 SAK_decommunization_idea_desc: "\n\n\n\n£GFX_idea_Decommunization_desc_photo\n\n\n\n\n\n\n  Нет коммунизму!"
 SAK_Poor_Agricultural_economy: "Слабая аграрная экономика"
 SAK_Poor_Agricultural_economy_desc: "\n\n\n\n£GFX_idea_Poor_agricultural_economy_desc_photo\n\n\n\n\n\n\n В последние годы экономика лишь ухудшалась. Несмотря на строительство заводов в Грузии, мы всё ещё зависим от сельского хозяйства, а его состояние оставляет желать лучшего: устаревшая техника, низкое качество, плохие условия и т.д."
 SAK_National_Gurad_Split_in_two: "Разделённая национальной гвардии"
 SAK_National_Gurad_Split_in_two_desc: "\n\n\n\n£GFX_idea_Divided_NG_desc_photo\n\n\n\n\n\n\n После начала борьбы за власть Национальная гвардия Грузии разделилась на два лагеря: сторонников Звиада и противников Звиада. Первых поддерживает Звиад Гамсахурдия, вторых — Тенгиз Китовани."
 SAK_Reinforce_Militia_idea: "Укрепить ополчение"
 SAK_Reinforce_Militia_idea_desc: "\n\n\n\n£GFX_idea_Reinforce_militia_desc_photo\n\n\n\n\n\n\n После переворота и начала войны нам необходимо усилить наши ополчение, чтобы повысить их боеспособность.."
