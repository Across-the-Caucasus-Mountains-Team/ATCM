l_english:
  sp_event_SOV_August_Coup_title: "August Coup"
  sp_event_SOV_August_Coup_quote: "“The USSR, as a state, as a single entity, as a geopolitical entity, will cease to exist”. \n- §YGennady Yanaev§!"
  sp_event_SOV_August_Coup_remark: "The end of the USSR is near..."

  sp_event_SOV_End_Of_The_Ussr_title: "End of the USSR"
  sp_event_SOV_End_Of_The_Ussr_quote: "“We did not build what the people needed. It is time to build another state, free and democratic”. \n- §YBoris Yeltsin§!"
  sp_event_SOV_End_Of_The_Ussr_remark: "End of an era"

  sp_event_RAS_Black_October_title: "Black October"
  sp_event_RAS_Black_October_quote: "“It was a coup. Yeltsin dissolved parliament, and it was a coup.”. \n- §YSupporters of Parliament§!"
  sp_event_RAS_Black_October_remark: "The beginning of the death of democracy in Russia"

  sp_event_RAS_First_Chechen_War_title: "First Chechen War"
  sp_event_RAS_First_Chechen_War_quote: "“I don’t have any malice towards Russia, I just have a feeling of disgust, like towards dead cattle”. \n- §YDzhokhar Dudayev§!"
  sp_event_RAS_First_Chechen_War_remark: "The beginning of the bloodbath"