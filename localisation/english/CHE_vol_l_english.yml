 CHE_vol_palest: "Syrian-Palestinian groups"
 CHE_vol_palest_desc: "The Syrian-Palestinian groups in Chechnya are usually counted as part of Khattab's «Arab international», yet the sources also mention them separately: Palestinians and Syrians who had passed through the camps of Lebanon, Syria and the Bekaa valley arrived via Turkey and Georgia and were distributed among the training centres. Their skills were valued in mine warfare and urban combat: the experience of Beirut was closer to Grozny than the experience of Afghanistan. Some of these men did less fighting than instructing and organising: contacts, money, documents, the transfer of new volunteers. As with most foreign groups, they had neither a single commander nor a staff of their own, only a common network held together by personal acquaintance.\n\nDivisional officer: §YCommander of the Syrian-Palestinian group§!."
 CHE_vol_palest_tt: "§YSyrian-Palestinian groups§!\n\nDivisional officer: §YCommander of the Syrian-Palestinian group§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_turk: "Turkish volunteers"
 CHE_vol_turk_desc: "Turkish volunteers appeared in Chechnya during the first war and are mentioned in intelligence summaries as one of the noticeable groups of foreigners: up to two hundred men according to military intelligence. Some were veterans of Turkish nationalist organisations, others were Meskhetian Turks and people from the Caucasus for whom Chechnya was a continuation of the struggle for the region. The Turks fought in small groups, most often alongside Khattab, and performed the same tasks as other foreign mujahideen: ambushes, mine warfare and instructor work in the camps. Sources give no single recognised commander: the detachment assembled and fell apart, and men moved from unit to unit. That is why in the game it appears as a composite group without a single name.\n\nDivisional officer: §YEmir of the Turkish detachment§!."
 CHE_vol_turk_tt: "§YTurkish volunteers§!\n\nDivisional officer: §YEmir of the Turkish detachment§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_ukraine_extended: "Ask Ukraine for extended help"
 CHE_vol_ukraine_extended_desc: "Extended help from Ukraine is the step from symbolic solidarity to a real stake. After the «Call for help» the bargaining begins in Kyiv: the security service, the ministry of defence and nationalist organisations weigh the risks, and the outcome depends on who is stronger in the capital. In historical mode Ukraine never agrees: the official Kyiv of the 1990s balanced between Moscow and the West and did not want to admit to being a party to the war. Outside historical mode agreement is always given: the Ukrainian nationalists are assumed to have gained enough weight to push the decision through. Agreement opens a separate tab where the UNA-UNSO corps is assembled from three brigades: infantry, artillery and armour. Each brigade follows its own path, from rifles to tanks, and each makes Ukraine's involvement more obvious.\n\nUkraine agrees with a §Y50 %%§! chance: in historical mode it never agrees, outside of historical mode it always agrees. Agreement unlocks the «UNA-UNSO corps expansion» tab."
 CHE_vol_ukraine_extended_refused_tt: "§RUkraine refuses§!\nIn historical mode extended help is impossible - the decision will not reappear."
 CHE_vol_ukraine_extended_tt: "§YUkraine agrees§!\nThe §Y«UNA-UNSO corps expansion»§! tab is unlocked: infantry, artillery and tanks.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_unso: "UNA-UNSO Viking detachment"
 CHE_vol_unso_art: "UNA-UNSO artillery brigade"
 CHE_vol_unso_art_desc: "The UNA-UNSO artillery brigade reflects the dream of any volunteer army: not to run under fire but to answer it. The plan was for Chechen artillery, weak and fragmented in the first war, to receive guns and mortars from the Ukrainian diaspora and the black market, while UNA-UNSO would supply crews trained in Soviet units and schools. Along with two artillery batteries the brigade carries an infantry screen and a sapper company, without which a battery in the mountains survives only until the first air raid. Practice was harsher: guns ran out faster than shells and crews faster than guns. Even so, artillery is one of the few things that let a besieged Grozny answer massed bombardment, and one of the things that turns a detachment into a formation.\n\nDivisional officer: §YUNA-UNSO artillery commander§!."
 CHE_vol_unso_art_tt: "§YUNA-UNSO artillery brigade§!\n\nDivisional officer: §YUNA-UNSO artillery commander§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_unso_desc: "The UNA-UNSO «Viking» detachment is the best known Ukrainian unit of the First Chechen War. It appeared in Grozny in December 1994: a few dozen Ukrainian nationalists led by Oleksandr Muzychko, known as «Sashko Bily», and inspired by Dmytro Korchynsky. Over the whole war, according to various estimates, between seventy and three hundred men passed through the detachment. Its fighters operated within Chechen units, carried out sabotage, sniper work and the protection of senior figures, including Dzhokhar Dudayev. For Kyiv and for Moscow the detachment was first of all a political statement and only then a military unit: Ukrainian nationalists were showing that the war in the Caucasus was their war too. After 1996 part of the fighters went home, but contacts with the Chechen underground remained.\n\nDivisional officer: §YOleksandr Muzychko§!."
 CHE_vol_unso_inf: "UNA-UNSO infantry brigade"
 CHE_vol_unso_inf_desc: "The infantry brigade of the UNA-UNSO corps is no longer the «Viking» detachment but a full formation of four battalions, a mortar battery and a sniper group: an attempt to turn the UNA-UNSO volunteer movement into a regular army, even if on foreign soil. Ukrainian nationalists were not poor in ideas but were poor in production, which makes infantry the most realistic part of the plan: rifles, mortars, sniper pairs and the experience of street fighting in Grozny gained in 1994-1996. Logistics are a separate problem: weapons come from depots bought off Ukrainian officers, money from diaspora collection. But it is the infantry that holds the city and fills the trenches, which is why it opens first.\n\nDivisional officer: §YUNA-UNSO infantry brigade commander§!."
 CHE_vol_unso_inf_tt: "§YUNA-UNSO infantry brigade§!\n\nDivisional officer: §YUNA-UNSO infantry brigade commander§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_unso_tank: "UNA-UNSO armoured corps"
 CHE_vol_unso_tank_desc: "The UNA-UNSO armoured corps is the most fantastic part of the Ukrainian plan and at the same time the most dangerous for the enemy. Two tank platoons, three APC companies, snipers and horse scouts are not a paper set but an attempt to assemble a mobile reserve able to counter-attack on the roads and in the foothills, where armour can still move. In 1994-1995 tanks and APCs in street fighting were the main argument of both sides. In reality the vehicles come from arsenals bought off the Ukrainian army, from trophies and from repairs on the spot: every tank here is an event and every loss a political scandal in Kyiv and in Moscow. Even so, the corps is the summit of what UNA-UNSO could have deployed in Chechnya.\n\nDivisional officer: §YUNA-UNSO armoured corps commander§!."
 CHE_vol_unso_tank_tt: "§YUNA-UNSO armoured corps§!\n\nDivisional officer: §YUNA-UNSO armoured corps commander§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_unso_tt: "§YUNA-UNSO Viking detachment§!\n\nDivisional officer: §YOleksandr Muzychko§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_white_stockings: "White Stockings"
 CHE_vol_white_stockings_desc: "The «White Stockings» are a legend of the First Chechen War: women snipers from Lithuania and Latvia who fought on the side of Ichkeria. In rumour and in the press they looked almost like a myth: beautiful women with rifles, at whose hands officers died at checkpoints. The reality was more modest: several dozen Baltic women, some professional sports shooters, some mercenaries, who worked inside Chechen units, waged «sniper terror» on the roads and went into the mountains with the detachments. Their main weapon was the SVD and their main tactic was work against officers and radio operators at checkpoints and crossroads. Almost no names survive in the sources, but the image survived and proved stronger than any document. This is the only unit in the tab for which a sniper rifle is not a support weapon but the main arm.\n\nDivisional officer: §YSkirmanta Skaistilkovna§!."
 CHE_vol_white_stockings_tt: "§YWhite Stockings§!\n\nDivisional officer: §YSkirmanta Skaistilkovna§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_white_stockings_idea: "White Stockings"
 CHE_white_stockings_idea_desc: "Lithuanian female snipers fighting for Chechnya. Lasts a year, as long as they are talked about and paid."
