 CHE_foreign_volunteers_dm: "Foreign volunteers"
 CHE_foreign_volunteers_dm_desc: "Active from the first day of the game, including the 1996 scenario: Chechnya gets organisation +2 %, weekly manpower +5, political power gain -2 % and max planning +5 %. Every volunteer decision strengthens the modifier and adds the same values again."
 CHE_unso_corps_cat: "UNA-UNSO corps expansion"
 CHE_unso_corps_cat_desc: "«UNA-UNSO corps expansion» is the second, unofficial part of the Ukrainian story in Chechnya. The «Viking» detachment was a symbol: a few dozen Ukrainian nationalists in Grozny, shown on television and debated in the Duma. The UNA-UNSO corps is no longer a symbol; it is an attempt to build a real army on foreign soil.\n\nThe tab opens only after Kyiv agrees to extended help. That agreement does not come by itself: in historical mode the official Ukraine of the 1990s balances between Moscow and the West and never admits to being a party to the war, so the expansion stays locked. Outside historical mode the Ukrainian nationalists are assumed to have gained enough weight to push the decision through, and agreement is always given.\n\nInside the tab there are three decisions and three brigades: infantry, artillery and armour. Infantry comes first: rifles, mortars, sniper pairs and the experience of street fighting. Artillery already demands real logistics: guns, shells, crews, sappers and an infantry screen. The armoured corps is the summit of the plan: tanks and APCs bought from the Ukrainian army, trophies and repairs on the spot.\n\nEvery decision costs political power, brings one brigade with full equipment and increases the total number of men Ukraine is willing to release. That total is capped: the corps exists only while Kyiv pretends that nothing is happening, and every new battalion brings closer the moment when pretending becomes impossible.\n\nThe UNA-UNSO corps does not replace the Chechen army and does not decide the war. It provides what the volunteers from Grozny never had: a staff, a rear area and a second line of defence."
 CHE_vol_afghan: "Afghan mujahideen"
 CHE_vol_afghan_desc: "The Afghan mujahideen are the most ambiguous group of foreigners in Chechnya. In the sources of 1999-2000 Afghans are mentioned constantly: veterans of the war against the Soviet troops, Taliban, fighters from Kabul and Kandahar who arrived through Pakistan and Iran. Some researchers believe there were dozens of them, others that there were hundreds, but the presence of Afghans with Khattab and in the Dagestani jamaats is not disputed. They brought the experience of guerrilla warfare, demolition and mountain combat, along with an Afghan discipline that sat badly with the free ways of the Chechen detachments. No single recognised Afghan commander can be named in Chechnya, so in the game the unit appears as a composite group.\n\nDivisional officer: §YCommander of the Afghan detachment§!."
 CHE_vol_afghan_tt: "§YAfghan mujahideen§!\n\nDivisional officer: §YCommander of the Afghan detachment§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_arab: "Abu al-Walid's Arab detachment"
 CHE_vol_arab_desc: "The Arab detachment of Abu al-Walid, a Saudi who came to Chechnya through Afghanistan, Bosnia and Tajikistan, was the second most important group of foreign mujahideen after Khattab's brigade. Abu al-Walid kept in the shadows, gave almost no interviews and kept television cameras away, but his men were responsible for the mine war, for ambushes on the roads and for guarding the «Arab» money that paid for the war. The detachment was formed from natives of Saudi Arabia, Yemen and Morocco, and some fighters came from the camps in Afghanistan and Pakistan. After Khattab's death in 2002 it was Abu al-Walid who took command of all foreign mujahideen in Chechnya. Russian sources announced his death several times, yet he kept reappearing until he was killed at Tsa-Vedeno in April 2004.\n\nDivisional officer: §YAbu al-Walid al-Ghamidi§!."
 CHE_vol_arab_tt: "§YAbu al-Walid's Arab detachment§!\n\nDivisional officer: §YAbu al-Walid al-Ghamidi§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_azerb: "Azerbaijani volunteers"
 CHE_vol_azerb_desc: "Azerbaijani volunteers reached Chechnya by two routes: through Dagestan along mountain paths and through Georgia, where the border effectively did not exist in the 1990s. Their motives ranged from Islamic solidarity to Caucasian solidarity and personal ties: many Azerbaijanis had fought in Karabakh and Abkhazia and saw Chechnya as another front of a larger Caucasian war. According to the Russian side, about one hundred and fifty Azerbaijani citizens were smuggled across the border in small groups. They fought inside Chechen units, mostly in the southern districts and in the Argun gorge, and are hardly ever mentioned as a separate formation: the group had neither a staff nor a known commander.\n\nDivisional officer: §YCommander of the Azerbaijani detachment§!."
 CHE_vol_azerb_tt: "§YAzerbaijani volunteers§!\n\nDivisional officer: §YCommander of the Azerbaijani detachment§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_baltic: "Baltic volunteers"
 CHE_vol_baltic_desc: "Baltic volunteers are the smallest and most exotic group of foreigners in Chechnya. According to Russian military estimates, about eighty mercenaries from Lithuania, Latvia and Estonia passed through the war, and most of them were snipers: in the 1990s Lithuania and Latvia had shooting clubs and private military schools that trained marksmen. Some of the Balts were veterans of local conflicts and of mercenary work in the Balkans. They did not form large units, worked in small groups and hired themselves out to particular commanders, most often to Khattab and to the detachments of the Grozny suburbs. There are almost no known names or photographs for this group, which is why in the game it is a unit without a named officer.\n\nDivisional officer: §YSenior officer of the Baltic group§!."
 CHE_vol_baltic_tt: "§YBaltic volunteers§!\n\nDivisional officer: §YSenior officer of the Baltic group§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_cat: "Foreign volunteers"
 CHE_vol_cat_desc: "The «Foreign volunteers» tab is the story of how a local Caucasian war became a magnet for people from all over the world, and of how Grozny tried to keep that force under control.\n\nChechnya in the 1990s was a poor republic without an army and without industry. There was no domestic arms production: rifles and machine guns came from old Soviet depots, vehicles from arsenals bought off Russian officers, money from oil, kidnappings and Islamic foundations. In those conditions every foreigner was worth his weight in gold, not because he could fight, but because he brought what Chechnya did not have: combat experience, contacts, money, instructors and political cover.\n\nThe tab opens with the «Call for help» focus: the Ichkerian leadership decides to appeal to the outside world, and the appeal is answered in the most varied circles, from Arab charities to Ukrainian nationalists and Baltic shooting clubs.\n\nEvery decision in the tab is a separate story. Arab and Afghan mujahideen who passed through Afghanistan, Bosnia and Tajikistan bring demolition skills and discipline. Turks, Azerbaijanis, Ingush and Georgians bring kinship networks through which men and weapons travel. Balts bring the sniper school. The Dagestani jamaats bring the infantry that will march into Dagestan in August 1999. Ukrainians bring the only force capable of becoming a regular formation.\n\nThe mechanics are simple: a decision costs political power, brings a division with its historical commander and full equipment into Chechnya and strengthens the «Foreign volunteers» modifier. Each new decision makes the next one costlier: the flow of men grows, organisation and planning improve, but every volunteer is paid for in political power and the stream eventually runs dry.\n\nThe tab does not grant an instant victory. It grants what Chechnya did not have in 1996: depth of men, weapons and time."
 CHE_vol_georgia: "Georgian volunteers"
 CHE_vol_georgia_desc: "Georgian volunteers appeared in Chechnya thanks to the experience of Abkhazia and Tskhinvali, but with the opposite sign: having fought against Sukhumi and South Ossetia, many Georgians saw Chechnya as a natural ally against Russia. In the 1990s not only men but weapons, documents and money travelled through Tbilisi and the border districts. According to various accounts there were several dozen fighters, some of whom served in Grozny within Dudayev's and Maskhadov's units. After 1999 the routes ran through the Pankisi gorge, where Kist Chechens lived, and through Azerbaijan. The Georgian group had neither a staff nor a recognised commander, so in the game it exists as a unit without a named officer.\n\nDivisional officer: §YCommander of the Georgian detachment§!."
 CHE_vol_georgia_tt: "§YGeorgian volunteers§!\n\nDivisional officer: §YCommander of the Georgian detachment§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_hattab: "Islamic International Peacekeeping Brigade"
 CHE_vol_hattab_desc: "The Islamic International Peacekeeping Brigade grew out of the detachment of the Jordanian Khattab, who appeared in Chechnya in 1995 and quickly became the most combat-ready part of the resistance. Its core were Arabs who had been through Afghanistan, Bosnia and Tajikistan, and around them training camps were built at Serzhen-Yurt, where saboteurs, snipers and demolition men were trained. The brigade acted as an independent force: it answered neither to the president of Ichkeria nor to the field commanders, and it was financed from abroad through Islamic foundations. For Grozny it was both a valuable ally and a political problem: foreign money and foreign commanders gave grounds to speak of losing control over the war. In 1998 the brigade numbered between four hundred and fifteen hundred bayonets, and its men became the strike force of the invasion of Dagestan in the summer of 1999.\n\nDivisional officer: §YKhattab (Samir Saleh al-Suwailem)§!."
 CHE_vol_hattab_tt: "§YIslamic International Peacekeeping Brigade§!\n\nDivisional officer: §YKhattab (Samir Saleh al-Suwailem)§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_ingush: "Ingush volunteers"
 CHE_vol_ingush_desc: "Ingush volunteers are the group closest to Chechnya, tied to it by kinship, language and the shared history of the 1944 deportation. Ingushetia and Chechnya formally separated in the 1990s, but the border between villages effectively did not exist and whole families went off to fight. Ingush units operated in the western districts of Chechnya, around Assinovskaya, Sernovodsk, Troitskoye and in the Prigorodny district, where the dispute over land was sharpest. By various estimates there were hundreds of such men, but no separate Ingush formation with its own staff existed: the detachments merged into Chechen units and fought alongside them. That is why in the game this is an allied but not an independent force.\n\nDivisional officer: §YCommander of the Ingush detachment§!."
 CHE_vol_ingush_tt: "§YIngush volunteers§!\n\nDivisional officer: §YCommander of the Ingush detachment§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_instr: "Foreign camp instructors"
 CHE_vol_instr_desc: "The instructors' detachment is not a line unit but the cadre of Khattab's training camps: the men who taught the others. The camps near Serzhen-Yurt and in the Vedeno and Shatoy districts were formally known as the «Kavkaz» training centre and over several years produced thousands of graduates: demolition men, snipers, machine gunners and radio operators. The instructors were not only Arabs: Turks, Jordanians and Pakistanis taught there, along with veterans of Afghanistan and Bosnia and Chechens who had passed the same courses a year earlier. The programme was harsh and practical: demolition, small-unit tactics, ambushes, map and radio work, marksmanship, physical training and religious instruction. It was the instructors who turned volunteers into soldiers, which is why their camps were a priority target for the federal forces.\n\nDivisional officer: §YSenior camp instructor§!."
 CHE_vol_instr_tt: "§YForeign camp instructors§!\n\nDivisional officer: §YSenior camp instructor§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
 CHE_vol_jamaat: "Dagestani jamaats"
 CHE_vol_jamaat_desc: "The Dagestani jamaats are a network of Wahhabi communities and military camps that grew in the late 1990s on the border between Chechnya and Dagestan. The best known centres were the Kadar zone, Karamakhi and Chabanmakhi, and the «Kavkaz» training centre near Serzhen-Yurt. The movement was led by Bagautdin Kebedov, together with his brothers and Dagestani field commanders who had trained in Khattab's camps. The jamaats provided the infantry that marched into the Botlikh and Novolak districts in August 1999: some two thousand fighters, part Dagestani, part foreign and Chechen. For Grozny it was a bet on exporting the war and on creating an Islamic state from the Caspian to the Caucasus ridge; for Moscow it was the pretext for the second Chechen campaign.\n\nDivisional officer: §YBagautdin Kebedov§!."
 CHE_vol_jamaat_tt: "§YDagestani jamaats§!\n\nDivisional officer: §YBagautdin Kebedov§!.\n\n§YThe «Foreign volunteers» modifier will be changed§!"
