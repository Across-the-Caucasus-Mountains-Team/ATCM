 manpads_equipment: "MANPADS"
 manpads_equipment_desc: "Man-portable air-defense systems are used by ground troops to engage low-flying aircraft, helicopters, and other aerial targets."
 manpads_equipment_0: "Strela-2 MANPADS"
 manpads_equipment_0_desc: "A first-generation Soviet man-portable air-defense system with an infrared homing missile, intended to engage low-flying aircraft."
 manpads_equipment_1: "Strela-3 MANPADS"
 manpads_equipment_1_desc: "An improved Strela-2 system with a more advanced infrared seeker, higher sensitivity, and better effectiveness against low-flying aircraft and helicopters."
 manpads_equipment_2: "Igla MANPADS"
 manpads_equipment_2_desc: "A new-generation Soviet MANPADS featuring improved guidance and greater resistance to infrared decoys, allowing it to better engage maneuvering aircraft."
 manpads_equipment_3: "Verba MANPADS"
 manpads_equipment_3_desc: "A modern Russian MANPADS with a multispectral seeker, improved resistance to countermeasures, and high effectiveness against aircraft, helicopters, and UAVs."
