 LOADING_TIP_28: "«Better to be a mad brave man than a calculating coward..»\n- Dzhokhar Dudayev"
 LOADING_TIP_29: "«If you do not have the strength to win, then at least have the strength not to submit..»\n- Dzhokhar Dudayev"

