 AZR_Black_January_idea: "Black January"
 AZR_Black_January_idea_desc: "\n\n\n\n£GFX_idea_Black_January_desc_photo\n\n\n\n\n\n\nOn 19 January Soviet Forces entered in Baku and started to dispare the Protest, first death happened outside of Baku and then Soviet Soldiers and Tanks killed more protesters in Baku resulting to death of 135-170 Peoples. after this 40 Days National Strike started across Azerbaijan as Azerbaijani citizens marched in country for victims of Black January."
