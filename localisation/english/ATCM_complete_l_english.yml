 SAK_Tbilisi_syndrome: "9 April Tragedy"
 SAK_Tbilisi_syndrome_desc: "\n\n\n\n£GFX_idea_April_Tragedy_desc_photo\n\n\n\n\n\n\n Tbilisi Tragedy also known as 9 April tragedy happened on the 9th of April 1989 when Soviet troops opned fire at the peaceful student protest, killing 21 students (19 women and 2 men) and injuring many others."
 SAK_Tbilisi_syndrome_2: "9 April Tragedy"
 SAK_Tbilisi_syndrome_2_desc: "\n\n\n\n£GFX_idea_April_Tragedy_desc_photo\n\n\n\n\n\n\n Tbilisi Tragedy also known as 9 April tragedy happened on the 9th of April 1989 when Soviet troops opned fire on a peaceful student protest, killing 21 students (19 women and 2 men) and injuring many others."
 SAK_Gamsakhurdias_Speechs: "National-Liberation Movement"
 SAK_Gamsakhurdias_Speechs_desc: "\n\n\n\n£GFX_idea_Gamsakhurdia_Speech_desc_photo\n\n\n\n\n\n\n With Gamsakhurdias speech, the Republic is getting more destabilized and Nationalism is becoming more popular amongst the people, killing him might cause more bloodshed... which we don't want to happen, we've already killed many capitalists which has caused many Georgians to stand against us."
 SAK_Mkhedrioni: "Mkhedrioni"
 SAK_Mkhedrioni_desc: "\n\n\n\n£GFX_idea_Mkhedrioni_desc_photo\n\n\n\n\n\n\n Paramilitary Group with radical ideas."
 SAK_decommunization_idea: "Decommunization"
 SAK_decommunization_idea_desc: "\n\n\n\n£GFX_idea_Decommunization_desc_photo\n\n\n\n\n\n\n  No to Communism!"
 SAK_Poor_Agricultural_economy: "Poor Agricultural Economy"
 SAK_Poor_Agricultural_economy_desc: "\n\n\n\n£GFX_idea_Poor_agricultural_economy_desc_photo\n\n\n\n\n\n\n In last years our economy only got worse even tho Soviet Union build factories in Georgia, we still relly on Agriculture and our Agriculture Sectors are bad, outdated equipment, poor quality, bad conditions and etc."
 SAK_National_Gurad_Split_in_two: "The National Guard is divided"
 SAK_National_Gurad_Split_in_two_desc: "\n\n\n\n£GFX_idea_Divided_NG_desc_photo\n\n\n\n\n\n\n After Power struggle begin, The Georgian National Guard split in 2 Factions, Pro-Zviad and Anti-Zviad, Pro-Zviad is backed by Zviad Gamsakhurdia while Anti-Zviad is backed by Tengiz Kitovani."
 SAK_Reinforce_Militia_idea: "Reinforce The Militia"
 SAK_Reinforce_Militia_idea_desc: "\n\n\n\n£GFX_idea_Reinforce_militia_desc_photo\n\n\n\n\n\n\n After the Coup and Wars we need to reinforce our Militia to make it stronger."
 SAK_lack_of_fuel_and_ammo: "Lack of Fuel and Ammo"
 SAK_lack_of_fuel_and_ammo_desc: "\n\n\n\n£GFX_idea_Lack_of_fuel_and_ammo_desc_photo\n\n\n\n\n\n\n A large part of our Army lacks Fuel and Ammo..."
