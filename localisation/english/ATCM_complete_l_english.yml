 CHE_georgia_activate_cells: "Activate Chechen Underground Cells"
 CHE_georgia_activate_cells_desc: "Trigger a crisis in Pankisi Gorge. Georgia will lose core status in Tusheti and Pankisi, and resistance will begin in both regions."
 CHE_panci_crisis_decision: "Pankisi Crisis"
 CHE_panci_crisis_decision_desc: "Over 600,000 Muslims live in Georgia, and we must protect them from Georgian nationalists. Most live in concentrated communities in Pankisi Gorge and Adjara. We can support Abkhazia and South Ossetia in their wars against Tbilisi.\n\nResistance in Tusheti: §Y[?34.resistance|0]%§!; compliance: §Y[?34.compliance|0]%§!.\nResistance in Pankisi: §Y[?120.resistance|0]%§!; compliance: §Y[?120.compliance|0]%§!."
 CHE_georgia_expand_underground: "Expand the Underground in the Pankisi Gorge"
 CHE_georgia_expand_underground_desc: "Supply the underground with 50 infantry weapons and 50 uniform sets."
 CHE_georgia_launch_operation: "Launch an Operation in Georgia"
 CHE_georgia_launch_operation_desc: "Begin a war against Georgia."
 CHE_georgia_offer_peace: "Offer Peace in Exchange for the Pankisi Gorge"
 CHE_georgia_offer_peace_desc: "Offer Georgia a ceasefire in exchange for ceding Pankisi Gorge to Chechnya. Both regions must be fully controlled. Georgia may refuse; a new offer can be made after 60 days."
 CHE_georgia_political_pressure: "Support Opponents of Tbilisi"
 CHE_georgia_political_pressure_desc: "Disrupt the political activity of the Georgian government."
