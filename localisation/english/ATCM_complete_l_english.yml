 FE_DIFFICULTY_HARD_TOOLTIP: "§L\"Thirty years from now, when you're sitting by your fireside with your grandson on your knee, and he asks, 'What did you do in the Second World War?', you won't have to say, 'Well, I shoveled shit in Louisiana.'\"§!"
 FE_DIFFICULTY_VERY_HARD: "Demob"
 FE_DIFFICULTY_VERY_HARD_TOOLTIP: "§L\"I have nothing to offer but blood, toil, tears and sweat.\"§!"

