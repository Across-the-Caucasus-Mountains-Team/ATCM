 # ATCM_nuclear_l_russian.yml
 ATCM_world_sanctions: "International Sanctions"
 ATCM_world_sanctions_desc: "Most countries have imposed severe sanctions on Russia: bank accounts have been frozen, markets closed, and trade has nearly ceased."
 ATCM_high_alert: "High Alert"
 ATCM_high_alert_desc: "The armed forces have been placed on high alert. Reservists have been called up, and border units are at full readiness."
 ATCM_NATO_faction: "NATO"
 ATCM_nuke_chechnya_tt: "Nuclear strikes will hit every province controlled by Chechnya. International repercussions will begin in a few days."
 atcmnuke.1.t: "The World Responds to the Strike"
 atcmnuke.1.d: "The use of tactical nuclear weapons on the territory of the Chechen Republic has shaken the planet and unleashed a wave of international anger and condemnation unprecedented in modern history. Something that had seemed an unthinkable taboo since August 1945 has happened in the midst of the already unstable 1990s. The international community responded immediately and uncompromisingly: at an emergency session of the United Nations, despite the Russian delegation’s veto in the Security Council, the General Assembly adopted an overwhelming resolution condemning Moscow’s actions as a senseless war crime and the mass destruction of civilians.\n\nCrushing economic measures followed the political declarations. The United States, the European Union, Japan, and dozens of other nations announced a total economic blockade and the complete isolation of the Russian Federation. Russia’s foreign gold and currency reserves were immediately frozen in bank accounts in London, New York, and Frankfurt. International financial transactions involving Russian banks were blocked, and contracts for imports and exports of raw materials, oil, and gas were unilaterally terminated. Even humanitarian supplies of urgently needed medicines, food, and technological equipment were cut off.\n\nThe Russian economy, already in a deep systemic crisis following the dissolution of the USSR, suffered an enormous shock. The national currency collapsed within hours; panic swept the stock markets; and cash machines and currency exchanges closed across the country as supplies of cash ran out. The population was gripped by fears of hunger and utter uncertainty. Russia had become completely isolated, a pariah state."
 atcmnuke.1.a: "Sanctions Have Been Imposed"
 atcmnuke.2.t: "NATO Reconnaissance Flights"
 atcmnuke.2.d: "The skies above Russia’s southern borders are no longer safe. Immediately after the blinding flashes over the Caucasus, the activity of North Atlantic Alliance aircraft near Russian borders increased exponentially. Heavy RC-135 strategic reconnaissance aircraft, high-altitude U-2 spy planes, and E-3 Sentry AWACS radar aircraft now conduct daily, round-the-clock patrols over international waters in the Black Sea and the airspace of neighboring countries.\n\nMilitary experts and Main Intelligence Directorate analysts note in classified reports to the General Staff that NATO is no longer simply conducting visual or electronic surveillance of the disaster zone. It is systematically and methodically probing the entire air- and missile-defense network in southern Russia. Enemy aircraft provoke Russian radars into switching on so that their coordinates and operating frequencies can be recorded, along with the locations of underground command posts, S-300 surface-to-air missile batteries, and silo launchers of the Strategic Nuclear Forces.\n\nEvery such flight brings the two sides dangerously close to confrontation and forces Russian air-defense units to operate under enormous stress. Surface-to-air missile battalions have been put on permanent combat alert, while Su-27 and MiG-31 interceptor pilots wait in their cockpits on airfield taxiways. The air seems to smell of gunpowder: military headquarters understand that the enemy may be conducting detailed reconnaissance ahead of a first, disarming strike."
 atcmnuke.2.a: "Noted"
 atcmnuke.3.t: "NATO Exercises in the Black Sea"
 atcmnuke.3.d: "Under the official pretext of \"ensuring freedom of navigation, monitoring environmental conditions, and stabilizing the regional situation,\" a major NATO naval strike group has conspicuously entered the Black Sea through the Bosporus and Dardanelles. Dozens of modern missile destroyers, cruisers, and frigates flying American, British, French, and Turkish flags have begun large-scale naval exercises close to Russian territorial waters.\n\nThe Black Sea Fleet command in Sevastopol reports a series of unprecedented, brazen provocations. NATO warships approach the Russian coast and naval bases to within visual range, ignoring warnings transmitted over international communication channels. Several dangerously close encounters between combat vessels have been recorded, while enemy carrier aircraft have simulated attack runs against Russian coastal batteries and ships on duty.\n\nTension at Black Sea Fleet headquarters is extreme. Aging Soviet vessels, battered by years of post-Soviet underfunding, face severe shortages of fuel and spare parts, while a technologically superior adversary openly displays its strength, demonstrating that the Black Sea is no longer Russia’s secure backyard. This is a direct psychological attack and a test of the country’s leadership."
 atcmnuke.3.a: "Increase Surveillance"
 atcmnuke.4.t: "Troops on the Turkish Border"
 atcmnuke.4.d: "The country’s southern borders have fallen still in fearful anticipation of an approaching catastrophe. With the support of its NATO allies and taking advantage of Moscow’s complete diplomatic isolation, Ankara has begun transferring large regular army formations toward the borders of Transcaucasia. Military intelligence reports uninterrupted columns of armored vehicles, deliveries of thousands of tons of ammunition, and the establishment of field hospitals, supply depots, and forward command posts.\n\nThe Turkish Army, one of the largest and best-equipped ground forces in the region, has been placed on the highest level of alert. Residents on both sides of the frontier are hastily abandoning their homes and possessions and fleeing inland, fearing that the regional crisis is about to erupt into widespread bloodshed. Fortifications are being constructed at an accelerated pace along the entire border, with concealed positions for heavy artillery and multiple rocket launchers.\n\nVirtually all diplomatic channels to Ankara have been severed. Turkish leaders completely ignore inquiries from Russia’s Foreign Ministry, issuing harsh declarations about the \"need to protect the brotherly peoples of Transcaucasia from Moscow’s insane nuclear threat.\" The ring is tightening, and the country’s southern flank faces a direct military threat."
 atcmnuke.4.a: "Noted"
 atcmnuke.5.t: "Airspace Violations"
 atcmnuke.5.d: "The situation along the southern strategic front is rapidly descending into uncontrollable chaos. During the past twenty-four hours, US and NATO fighter-bombers have repeatedly and boldly violated the state border of the Russian Federation. Exploiting the Caucasus Mountains and flying at extremely low altitude, the enemy aircraft evade aging radar systems and stage provocative flights directly over Russian military installations, garrisons, and communication hubs.\n\nPairs of Russian Air Force interceptors on alert have been scrambled repeatedly. Their pilots report visual contact with NATO aircraft behaving aggressively and locking Russian fighters with their fire-control radars. Moscow, however, has still not issued an unequivocal order to open fire and destroy the intruders, as the country’s leaders fear provoking the direct outbreak of a global war.\n\nMurmurs of anger and despair are growing among the military ranks in the field. The enemy sees the paralysis of political will in the capital and openly mocks the country’s sovereignty, treating its defended airspace like a private training ground. Each flight pushes the nerves of air-defense officers at their command posts to the breaking point. Only minutes may remain before a fatal mistake unleashes the guns."
 atcmnuke.5.a: "Lodge a Protest"
 atcmnuke.6.t: "Incident on the Georgian Border"
 atcmnuke.6.d: "The fragile, uneasy peace in the Caucasus has finally collapsed into direct military confrontation. A fierce and bloody border incident broke out on the frontier with Georgia and, within hours, developed into a full-scale local engagement involving heavy weapons. Russian border posts and adjacent Georgian positions were subjected to concentrated mortar and artillery fire, after which armored vehicles and infantry units joined the battle.\n\nMoscow and Tbilisi immediately exchanged furious accusations. Georgia claims that Russian troops carried out a treacherous incursion, while the Russian Defense Ministry reports a planned provocation by Georgian security forces supported by foreign instructors. Numerous dead and wounded are reported on both sides; several armored vehicles have been knocked out, and border infrastructure has been destroyed.\n\nUnder normal conditions in the 1990s, such an incident might have been settled through negotiations. But with the Caucasus poisoned by radiation after the nuclear strike, the conflict has become an immediate trigger for further escalation. Western media seize upon the news, magnifying it into a story of \"new aggression from the Kremlin.\" The border battle offers the ideal legal and propaganda pretext for open military intervention by outside powers."
 atcmnuke.6.a: "Noted"
 atcmnuke.7.t: "Announcement of a \"Humanitarian Mission\""
 atcmnuke.7.d: "Western capitals have abandoned all diplomatic courtesies and moved to a direct political and military ultimatum. At an emergency NATO summit in Brussels, an official declaration was adopted calling for the immediate start of a large-scale \"humanitarian and peacekeeping operation\" in the Caucasian conflict zone. Behind the grand slogans of \"protecting civilians from ecological disaster and radioactive danger\" lie preparations for direct intervention.\n\nThe North Atlantic Alliance demands the immediate, unrestricted entry of foreign troops, inspectors, and military equipment into the Caucasus, as well as the establishment of a \"no-fly zone\" over all of southern Russia. In practice, this demands that Moscow voluntarily relinquish sovereignty over its own territory and surrender complete control of the region to Western coalition forces.\n\nMoscow regards these statements as nothing less than a blatant ultimatum and a direct prelude to invasion. At the highest levels of government, it has become clear that the West no longer considers Russia a power capable of defending itself. The military districts of the south are being placed on a wartime footing. Diplomacy is powerless; the only remaining question is when the first columns of NATO armor will cross the state border."
 atcmnuke.7.a: "Noted"
 atcmnuke.8.t: "Order to Raise Readiness"
 atcmnuke.8.d: "The General Staff of the Russian Armed Forces has submitted an uncompromising and deeply pessimistic intelligence assessment to the country’s leadership: NATO’s ground and air forces have completed their concentration on the southern flank and are fully prepared to launch a major offensive. To surrender the initiative to the enemy now would be suicidal.\n\nThe president has signed an emergency decree placing all armed forces, including the Strategic Nuclear Forces, on \"Full Combat Alert.\" Reservists are being mobilized nationwide; thousands of armored vehicles and artillery systems are being brought out of storage; and Topol strategic missile launchers are leaving their garages to disperse into remote forests for combat patrols. Nuclear-powered ballistic-missile submarines are urgently departing bases in Murmansk and Kamchatka and disappearing beneath the Arctic ice.\n\nAn anxious, stunned silence hangs over Russia’s cities. Reinforced police and Interior Troops patrol the streets, while civil-defense systems and bomb shelters undergo inspections. The country has moved entirely onto a wartime footing. Military officers wait motionless at their control stations for the final order. The Rubicon has been crossed: there is nowhere left to retreat. Russia is preparing to face the strongest military alliance on Earth."
 atcmnuke.8.a: "Confirm the Order"
 atcmnuke.9.t: "Georgia Joins NATO"
 atcmnuke.9.d: "Amid rapidly mounting military chaos and the total collapse of the regional security system, the leadership in Tbilisi has made a fateful, uncompromising decision. At an emergency meeting of the North Atlantic Council, the accelerated admission of the Republic of Georgia to NATO was officially announced.\n\nTurkey, the alliance’s main military power in the Black Sea and Caucasus regions, has undertaken direct responsibility for Georgia’s security and the integration of its armed forces into NATO’s unified command. Transport aircraft carrying advance units of the US Marine Corps, special operations forces, and modern air-defense systems are already landing at Georgian airfields. The naval base at Poti is passing under alliance control.\n\nFor Moscow, this step signifies the final collapse of the centuries-old balance of power in the Caucasus. A hostile military bloc has established itself directly on the Russian Federation’s southern frontier, creating a well-prepared bridgehead for an offensive deep into Russian territory. NATO military infrastructure now stands at the very foot of the Caucasus Mountains, leaving virtually no room for diplomatic maneuver."
 atcmnuke.9.a: "Unacceptable"
 atcmnuke.10.t: "Armenia Joins NATO"
 atcmnuke.10.d: "The geopolitical domino collapse in the Caucasus has reached its conclusion. Following Tbilisi, Yerevan has announced its own emergency decision to join the North Atlantic Alliance. Faced with complete isolation, regional instability, and an immense nuclear disaster just across its borders, Armenia’s leaders have chosen to sever their traditional alliance with Moscow and accept Western protection.\n\nAll the necessary accession protocols have been signed in Yerevan. With this step, NATO has finally closed the ring of encirclement to the south. A regional bloc consisting of Turkey, Georgia, and Armenia has formed a united military bridgehead controlling all of Transcaucasia and blocking Russia’s access to its southern borders.\n\nAmerican and French aircraft are deploying to Armenian airfields, while Turkish and European ground troops occupy commanding heights and critical road junctions. Russian military bases in the region are blockaded and effectively held hostage. Russia’s entire southern strategic flank has passed under enemy control. War is no longer merely inevitable: the countdown has begun."
 atcmnuke.10.a: "Unacceptable"
 atcmnuke.11.t: "War with NATO"
 atcmnuke.11.d: "The point of no return has been passed, and humanity’s worst nightmare has become reality. A united military-political bloc of Turkey, Georgia, and Armenia, with full and direct support from NATO expeditionary forces and aircraft, has formally declared war on the Russian Federation. Diplomatic relations have been severed, and the guns are speaking at the front.\n\nEnemy mechanized formations numbering in the tens of thousands, supported by vast forces of tanks, artillery, and attack aircraft, have crossed Russia’s borders and launched a major offensive in the Caucasus. Enemy aircraft are conducting massive precision missile and bombing strikes against Russian airfields, communication centers, ammunition depots, and command posts from Rostov to Vladikavkaz.\n\nA full-scale, bloody conventional war has begun between a major power and the world’s strongest coalition. Despite shortages of supplies and the enemy’s numerical superiority, Russian soldiers and officers are mounting desperate, courageous resistance along every defensive line. Yet the front is steadily collapsing under the relentless hammer of NATO’s war machine. Faced with the prospect of inevitable military defeat, Russian commanders have only one final and terrible argument left: the use of the entire strategic nuclear arsenal."
 atcmnuke.11.a: "To Arms!"
 atcmnuke.12.t: "Nuclear Strike on Moscow"
 atcmnuke.12.d: "Judgment Day has arrived. An enemy thermonuclear warhead penetrated the capital’s weakened and overstretched missile defenses and detonated directly above central Moscow. A blinding flash like a thousand suns consumed the ancient city in a fraction of a second, reducing it to dust, radioactive ash, and molten concrete.\n\nA shock wave of unimaginable power and a raging firestorm swept away the Kremlin, government buildings, command bunkers, residential neighborhoods, and millions of human lives in moments. Nothing living remained within tens of kilometers. All contact with the country’s political and military leadership was severed; centralized government ceased to exist in an instant, and the nation plunged into darkness and chaos.\n\nBut the enemy made a fatal miscalculation. Hardened command posts and automated Perimeter systems buried deep beneath the Ural Mountains detected the destruction of the capital, the loss of communication signals, and the spike in radiation. The Doomsday system’s algorithms finally transferred the authority to launch a retaliatory strike to surviving officers of the strategic missile forces. The final chapter of human history is beginning."
 atcmnuke.12.a: "Catastrophe"
 atcmnuke.13.t: "Retaliatory Fire"
 atcmnuke.13.d: "The automated Perimeter nuclear retaliation system and surviving crews aboard strategic missile submarines deep in the world’s oceans have performed their last and terrible duty. Hundreds of intercontinental ballistic missiles rose with a roar from underground silos in Siberia, hidden woodland launch sites, and the depths of the sea into the burning sky.\n\nTheir targets were Washington, London, Paris, Ankara, Brussels, and hundreds of other cities, military bases, and industrial centers across the enemy’s Northern Hemisphere. A horrifying scene unfolded above the Earth: thousands of nuclear warheads traced fiery arcs through the stratosphere, crossing paths in a deadly dance with enemy missiles. Ground-based air and missile defenses were helpless before this apocalyptic avalanche.\n\nThe entire planet was becoming one vast burning hell. Oceans boiled from underwater explosions, cities burned in fire tornadoes, and the atmosphere filled with billions of tons of soot and radioactive ash. The last officers in command bunkers watched their monitors go dark, knowing that within minutes no one would remain to give an order or hear a reply."
 atcmnuke.13.a: "Fire"
 atcmnuke.14.t: "Silence"
 atcmnuke.14.d: "When the insane firestorm finally subsided and the thick curtain of radioactive ash and soot slowly settled over the Earth’s scorched and ravaged surface, the remnants of life encountered an entirely new, dead world. Great civilizations that had flourished for millennia, enormous cities, culture, science, and government: all had been reduced within hours to poisoned ruins and mountains of charred debris.\n\nAn era of endless, merciless nuclear winter had begun. Sunlight could no longer penetrate the impenetrable dome of soot in the atmosphere. Global temperatures were plunging, killing the remaining animals and plants. Across the former Caucasus, Russia, Europe, and America, there were no longer any states, borders, armies, or governments. Only scattered groups of irradiated survivors, living out their final days, hid in ruined subway systems and deep cellars.\n\nAn absolute, sepulchral silence descended. On this poisoned planet there were no victors or vanquished, no righteous or guilty. Geopolitical ambitions, territorial wars, and nuclear doctrines had lost all meaning. Humanity had committed its final suicide, leaving behind only cold radioactive ruins and silence."
 atcmnuke.14.a: "It Is All Over"
 RAS_nuclear_strike_on_chechnya: "§RNuclear strike§!"
 RAS_nuclear_strike_on_chechnya_desc: "A bloody deadlock, catastrophic losses in the mountain gorges, and the threat of the total collapse of the Caucasian front are driving a desperate military command toward an extreme, unthinkable measure. The use of tactical nuclear weapons would instantly incinerate Chechen positions, destroy the militant leadership, and break all resistance in the Caucasus.\n\nBut the price of such a \"victory\" would be catastrophic. This step would destroy the old world order forever, turn Russia into a pariah, and set off an irreversible chain reaction of escalation with NATO that would inevitably bring the world to the brink of World War III. Are we prepared to open the gates of hell to settle a local conflict?"

