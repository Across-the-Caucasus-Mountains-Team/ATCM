 FE_DIFFICULTY_VERY_EASY: "Raw Recruit"
 FE_DIFFICULTY_VERY_EASY_TOOLTIP: "§L\"We can do it!\"§!"
 FE_DIFFICULTY_EASY: "Rookie"
 FE_DIFFICULTY_EASY_TOOLTIP: "§L\"I have no doubt about your courage, devotion to duty, and fighting ability. We will accept nothing less than absolute victory. Good luck!\"§!"
 FE_DIFFICULTY_NORMAL: "Veteran"
 FE_DIFFICULTY_NORMAL_TOOLTIP: "§L\"For our enemy is strong. He may throw back our forces. Success may not come to us at once, but we shall return again and again.\"§!"
