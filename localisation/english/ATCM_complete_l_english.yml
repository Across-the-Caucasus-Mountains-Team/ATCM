 infantry_equipment: "Infantry Weapons"
 infantry_equipment_desc: "Infantry Weapons"
 infantry_equipment_0: "AKM"
 infantry_equipment_0_desc: "A modernized Kalashnikov assault rifle chambered for an intermediate cartridge. Simple, reliable, and well suited to mass production."
 infantry_equipment_1: "AKMS"
 infantry_equipment_1_desc: "An AKM variant with a folding stock, intended for airborne troops, armored vehicle crews, and units that need a more compact weapon."
 infantry_equipment_2: "AKS-74U"
 infantry_equipment_2_desc: "A compact assault rifle with a shortened barrel and folding stock, designed for vehicle crews, special units, and close-quarters combat."
 infantry_equipment_3: "AK-74M"
 infantry_equipment_3_desc: "A modernized version of the AK-74, with a folding polymer stock, increased durability, and the ability to mount modern sights and accessories."
 infantry_equipment_4: "AK-12"
 infantry_equipment_4_desc: "A modern Kalashnikov assault rifle chambered in 5.45×39 mm, featuring an adjustable folding stock, accessory rails, improved ergonomics, and greater versatility."
