 # ATCM_base_raids_l_russian.yml
 CHE_hold_raids_on_soviet_millitary_bases_desc: "Stocks of former Soviet Army equipment remain at military bases, motor pools, and airfields. Organized raids will help arm our forces before the troop withdrawal."
 CHE_base_raids: "Soviet Military Bases"
 CHE_base_raids_desc: "Four finite stockpiles. Only one raid may be conducted at a time. Already seized: military bases — [?CHE_base_taken_military|%0], motor pools — [?CHE_base_taken_vehicles|%0], airfields — [?CHE_base_taken_airfields|%0], heavy equipment — [?CHE_base_taken_heavy|%0]."
 CHE_base_raid_start_tt: "§G90%§! chance of success: the first successful raid takes §G40%§! of the original stockpile, each subsequent one §G20%§!, and grants §G+2§! Army Experience. §R10%§! chance of failure: soldiers will die and no equipment or experience will be gained. On failure the target stockpile is unchanged. Another raid may be launched §Y30 days§! after completion. At least §Y25§! reserve personnel are required. Canceling the operation refunds §Y25§! Political Power."
 CHE_base_handover_tt: "The remaining stockpiles are divided equally."
 CHE_base_handover_che_desc: "The Russian units are completing their withdrawal. The remaining military equipment was divided equally between the parties. Below is our share received during the handover:\n\n§YMilitary Bases§!\nAKM — §Y[?base_raid_handover^0|0]§!, AKMS — §Y[?base_raid_handover^1|0]§!, Support Equipment — §Y[?base_raid_handover^2|0]§!, Uniforms — §Y[?base_raid_handover^3|0]§!, Mortars — §Y[?base_raid_handover^4|0]§!, RPG-7 — §Y[?base_raid_handover^5|0]§!, RPG-18 — §Y[?base_raid_handover^6|0]§!, Bulletproof Vests — §Y[?base_raid_handover^7|0]§!\n\n§YMotor Pools§!\nSupport Equipment — §Y[?base_raid_handover^8|0]§!, GAZ-69 — §Y[?base_raid_handover^9|0]§!, UAZ-469 — §Y[?base_raid_handover^10|0]§!, Trucks — §Y[?base_raid_handover^11|0]§!, Trains — §Y[?base_raid_handover^12|0]§!\n\n§YAirfields§!\nBMD-1 — §Y[?base_raid_handover^13|0]§!, BMD-2 — §Y[?base_raid_handover^14|0]§!, Support Equipment — §Y[?base_raid_handover^15|0]§!, Strela-2 MANPADS — §Y[?base_raid_handover^16|0]§!, AKMS — §Y[?base_raid_handover^17|0]§!, Uniforms — §Y[?base_raid_handover^18|0]§!, Bulletproof Vests — §Y[?base_raid_handover^19|0]§!\n\n§YHeavy Equipment Park§!\nT-55 — §Y[?base_raid_handover^20|0]§!, T-72 — §Y[?base_raid_handover^21|0]§!, BMP-1 — §Y[?base_raid_handover^22|0]§!, BMP-2 — §Y[?base_raid_handover^23|0]§!, BTR-70 — §Y[?base_raid_handover^24|0]§!, BTR-80 — §Y[?base_raid_handover^25|0]§!, BM-21 Grad — §Y[?base_raid_handover^26|0]§!, D-20 — §Y[?base_raid_handover^27|0]§!"
 atcm_base_raids.1.t: "Handover of Military Equipment"
 atcm_base_raids.1.d: "The withdrawal of Russian troops from Chechnya has been accompanied by a division of military equipment. Our stockpiles received:\n\n§YMilitary Bases§!\nAKM — §Y[?base_raid_handover^0|0]§!, AKMS — §Y[?base_raid_handover^1|0]§!, Support Equipment — §Y[?base_raid_handover^2|0]§!, Uniforms — §Y[?base_raid_handover^3|0]§!, Mortars — §Y[?base_raid_handover^4|0]§!, RPG-7 — §Y[?base_raid_handover^5|0]§!, RPG-18 — §Y[?base_raid_handover^6|0]§!, Bulletproof Vests — §Y[?base_raid_handover^7|0]§!\n\n§YMotor Pools§!\nSupport Equipment — §Y[?base_raid_handover^8|0]§!, GAZ-69 — §Y[?base_raid_handover^9|0]§!, UAZ-469 — §Y[?base_raid_handover^10|0]§!, Trucks — §Y[?base_raid_handover^11|0]§!, Trains — §Y[?base_raid_handover^12|0]§!\n\n§YAirfields§!\nBMD-1 — §Y[?base_raid_handover^13|0]§!, BMD-2 — §Y[?base_raid_handover^14|0]§!, Support Equipment — §Y[?base_raid_handover^15|0]§!, Strela-2 MANPADS — §Y[?base_raid_handover^16|0]§!, AKMS — §Y[?base_raid_handover^17|0]§!, Uniforms — §Y[?base_raid_handover^18|0]§!, Bulletproof Vests — §Y[?base_raid_handover^19|0]§!\n\n§YHeavy Equipment Park§!\nT-55 — §Y[?base_raid_handover^20|0]§!, T-72 — §Y[?base_raid_handover^21|0]§!, BMP-1 — §Y[?base_raid_handover^22|0]§!, BMP-2 — §Y[?base_raid_handover^23|0]§!, BTR-70 — §Y[?base_raid_handover^24|0]§!, BTR-80 — §Y[?base_raid_handover^25|0]§!, BM-21 Grad — §Y[?base_raid_handover^26|0]§!, D-20 — §Y[?base_raid_handover^27|0]§!"
 atcm_base_raids.1.a: "Was there not more than that?"
 atcm_base_raids.2.t: "Raid Foiled"
 atcm_base_raids.2.d: "The operation failed. We lost 25 soldiers. The weapons and equipment remained at the base."
 atcm_base_raids.2.a: "Oh."
 CHE_raid_base_military: "Raid: Military Bases"
 CHE_raid_base_military_desc: "Original stockpile: 3,200 AKMs, 2,400 AKMSs, 240 support equipment sets, 10,000 uniforms, 40 mortars, 100 RPG-7s, 40 RPG-18s, and 7,000 bulletproof vests.\n\nAlready taken: [?CHE_base_taken_military|%0].\n\nThe first success grants 40%, and each later success grants 20% of the original stockpile. Success chance: 90%; failure chance: 10%. Captured equipment goes straight into our stockpile."
 CHE_raid_base_vehicles: "Raid: Motor Pools"
 CHE_raid_base_vehicles_desc: "Original stockpile: 400 support equipment sets, 100 GAZ-69s, 50 UAZ-469s, 100 trucks, and 5 trains.\n\nAlready taken: [?CHE_base_taken_vehicles|%0].\n\nThe first success grants 40%, and each later success grants 20% of the original stockpile. Success chance: 90%; failure chance: 10%. Captured equipment goes straight into our stockpile."
 CHE_raid_base_airfields: "Raid: Airfields"
 CHE_raid_base_airfields_desc: "Original stockpile: 20 BMD-1s, 10 BMD-2s, 200 support equipment sets, 30 Strela-2 MANPADS, 500 AKMSs, 1,000 uniforms, and 500 bulletproof vests.\n\nAlready taken: [?CHE_base_taken_airfields|%0].\n\nThe first success grants 40%, and each later success grants 20% of the original stockpile. Success chance: 90%; failure chance: 10%. Captured equipment goes straight into our stockpile."
 CHE_raid_base_heavy: "Raid: Heavy Equipment Park"
 CHE_raid_base_heavy_desc: "Original stockpile: 20 T-55s, 10 T-72s, 20 BMP-1s, 10 BMP-2s, 30 BTR-70s, 10 BTR-80s, 10 BM-21 Grad systems, and 50 D-20 guns.\n\nAlready taken: [?CHE_base_taken_heavy|%0].\n\nThe first success grants 40%, and each later success grants 20% of the original stockpile. Success chance: 90%; failure chance: 10%. Captured equipment goes straight into our stockpile."

