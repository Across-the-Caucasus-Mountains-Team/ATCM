 motorized_rocket_equipment: "Multiple Rocket Launchers"
 motorized_rocket_equipment_1: "BM-21 Grad MLRS"
 motorized_rocket_equipment_1_short: "Motorized Rocket Equipment 1 Short"
 motorized_rocket_equipment_1_desc: "The BM-21 Grad is a Soviet 122 mm multiple rocket launcher intended to strike massed infantry, artillery positions, and unarmored vehicles. Its 40 launch tubes can blanket a large area in moments. The system is easy to operate, highly mobile, and mass-produced."
 motorized_rocket_equipment_2: "BM-27 Uragan MLRS"
 motorized_rocket_equipment_2_short: "Motorized Rocket Equipment 2 Short"
 motorized_rocket_equipment_2_desc: "The BM-27 Uragan is a Soviet 220 mm multiple rocket launcher intended to strike large concentrations of troops, artillery, armored vehicles, and fortified positions. Its 16 launch tubes offer much greater firepower and range than the Grad."
 motorized_rocket_equipment_3: "BM-30 Smerch MLRS"
 motorized_rocket_equipment_3_short: "Motorized Rocket Equipment 3 Short"
 motorized_rocket_equipment_3_desc: "The BM-30 Smerch is a Soviet 300 mm heavy multiple rocket launcher designed to destroy important targets and large enemy formations at long range. Equipped with 12 launch tubes and powerful rockets with different warheads, it has tremendous destructive power and area coverage."
 motorized_rocket_equipment_4: "TOS-1A Solntsepyok MLRS"
 motorized_rocket_equipment_4_short: "Motorized Rocket Equipment 4 Short"
 motorized_rocket_equipment_4_desc: "The TOS-1A Solntsepyok is a Russian heavy flamethrower system on a T-72 tank chassis, designed to strike troops in shelters, buildings, and fortified positions. Its 24 tubes fire primarily 220 mm thermobaric rockets; the system is immensely destructive but relatively short-ranged."
 motorized_rocket_equipment_5: "Tornado MLRS"
 motorized_rocket_equipment_5_short: "Motorized Rocket Equipment 5 Short"
 motorized_rocket_equipment_5_desc: "Tornado is a family of modern Russian multiple rocket launchers designed to replace the aging Grad and Smerch systems. It includes the 122 mm Tornado-G and 300 mm Tornado-S, featuring automated fire control, better accuracy, quicker preparation, and guided rocket options."
