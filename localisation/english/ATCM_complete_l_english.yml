 modern_tank_equipment: "Main Battle Tanks"
 modern_tank_equipment_short: "OBT"
 modern_tank_equipment_desc: "The main battle tank combines firepower, armor protection, and high mobility, forming the backbone of modern armored forces."
 modern_tank_equipment_1: "T-54"
 modern_tank_equipment_1_short: "T-54"
 modern_tank_equipment_1_desc: "The T-54 is a postwar Soviet medium tank with a 100 mm D-10T gun, low silhouette, and strong armor for its time. Its design became the foundation for subsequent Soviet main battle tanks."
 modern_tank_equipment_2: "T-55"
 modern_tank_equipment_2_short: "T-55"
 modern_tank_equipment_2_desc: "The T-55 is a major modernization of the T-54 with increased reliability, protection against weapons of mass destruction, and an improved powerplant. Its simplicity and upgrade potential ensured an exceptionally long service life."
 modern_tank_equipment_3: "T-72"
 modern_tank_equipment_3_short: "T-72"
 modern_tank_equipment_3_desc: "The T-72 is a mass-produced main battle tank with a 125 mm smoothbore gun, autoloader, and composite armor. Its compact layout combines powerful armament, good mobility, and a relatively low cost."
 modern_tank_equipment_4: "T-80"
 modern_tank_equipment_4_short: "T-80"
 modern_tank_equipment_4_desc: "The T-80 is a main battle tank with a gas-turbine engine, high mobility, and a 125 mm autoloaded gun. Improved fire control and armor protection made it one of the most advanced Soviet vehicles of its generation."
 modern_tank_equipment_5: "T-90"
 modern_tank_equipment_5_short: "T-90"
 modern_tank_equipment_5_desc: "The T-90 is a further development of the T-72 family, combining improved composite and reactive armor, a modernized 125 mm gun, and contemporary fire-control systems to increase survivability and combat effectiveness."
