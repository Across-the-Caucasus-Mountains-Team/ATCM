 bbm_chassis: "Armored Cars"
 bbm_chassis_desc: "Light wheeled military vehicles designed for reconnaissance, patrols, personnel transport, and support duties. They provide excellent mobility and off-road capability."
 bbm_chassis_0: "GAZ-69"
 bbm_chassis_0_desc: "A Soviet four-wheel-drive military utility vehicle for transporting personnel, reconnaissance, and troop support. Its simple construction makes it easy to repair and capable off-road."
 bbm_chassis_1: "UAZ-469"
 bbm_chassis_1_desc: "A Soviet military off-road vehicle designed to replace the GAZ-69. It features better off-road performance, increased ground clearance, and a strong ladder frame, and is used for reconnaissance, patrols, troop transport, and towing light weapons."
 bbm_chassis_2: "UAZ-3151"
 bbm_chassis_2_desc: "A modernized UAZ-469 with upgraded components. It retains exceptional off-road mobility and ease of maintenance under difficult road and climatic conditions, serving as a command, reconnaissance, and transport vehicle."
 bbm_chassis_3: "GAZ-2330 Tigr"
 bbm_chassis_3_desc: "A Russian multipurpose off-road vehicle for troop transport, reconnaissance, and patrols. A powerful diesel engine, independent suspension, and all-wheel drive improve mobility, while armored variants protect against small-arms fire and fragments."
 bbm_chassis_4: "Armored Car V"
 bbm_chassis_4_desc: "Armored Car V"
 bbm_chassis_5: "Armored Car VI"
 bbm_chassis_5_desc: "Armored Car VI"
 support_equipment_short: "Support Equipment Short"
 support_equipment: "Support Equipment"
 support_equipment_desc: "Radios, vehicles, pontoon bridges, and other auxiliary military equipment."
 tech_support: "Support Equipment"
