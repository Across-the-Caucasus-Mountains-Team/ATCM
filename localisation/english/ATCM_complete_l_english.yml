 grenade_launcher_equipment: "Anti-Tank Rocket Launchers"
 grenade_launcher_equipment_desc: "Anti-tank grenade launchers are designed to engage armored vehicles, fortifications, and other protected targets using shaped-charge and multi-purpose ammunition."
 grenade_launcher_equipment_0: "RPG-7"
 grenade_launcher_equipment_0_desc: "A Soviet reusable shoulder-fired anti-tank rocket launcher, widely used for its simplicity, reliability, and broad range of ammunition. Designed to engage armor, fortifications, and personnel."
 grenade_launcher_equipment_1: "RPG-18"
 grenade_launcher_equipment_1_desc: "A disposable Soviet rocket-propelled anti-tank grenade launcher developed as a lightweight individual weapon against armored vehicles at short ranges."
 grenade_launcher_equipment_2: "RPG-26"
 grenade_launcher_equipment_2_desc: "A Soviet disposable anti-tank grenade launcher developed as an improvement over the RPG-18. It features a more powerful projectile, better penetration, and ease of use."
 grenade_launcher_equipment_3: "RPG-29"
 grenade_launcher_equipment_3_desc: "A powerful reusable Soviet anti-tank rocket launcher. Equipped with tandem shaped-charge ammunition, it can engage modern armored vehicles, including those with explosive reactive armor."
 grenade_launcher_equipment_4: "RPG-30"
 grenade_launcher_equipment_4_desc: "A Russian disposable anti-tank rocket launcher employing a tandem launch concept: a preliminary rocket triggers the target’s active protection system before the main warhead strikes the armor."
