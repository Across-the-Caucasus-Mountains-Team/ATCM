 chechnya.70.t: "The Fate of the Communists"
 chechnya.70.d: "Our government must decide how to treat officials and specialists associated with the former Soviet system. Many remain essential to administration, industry, education and healthcare. Radicals demand their removal, while others warn that dismissing experienced personnel will weaken the state."
 chechnya.70.a: "Leave them alone."
 chechnya.70.b: "They must convert to Islam."
 chechnya.70.c: "Remove them from office."
 chechnya.71.t: "An Agreement with Dudayev"
 chechnya.71.d: "Dzhokhar Dudayev remains a prominent opponent of the Islamic government. His nationalist movement shares our desire for independence but has a different vision of the state. Advisers propose arresting him, making use of his military experience in the air force, or forming a coalition."
 chechnya.71.a: "Arrest Dudayev."
 chechnya.71.b: "Let him lead our air force."
 chechnya.71.c: "We can form a coalition with him."
 chechnya.72.t: "The Future of the Oil Industry"
 chechnya.72.d: "Oil extraction and refining remain central to the republic's economy. Much of the industry is still managed by directors appointed under Soviet rule. Keeping them may preserve production and expertise, while supporters of nationalisation demand direct state control over these resources."
 chechnya.72.a: "Let them continue extracting oil."
 chechnya.72.b: "Nationalise the oil industry."
 chechnya.73.t: "Negotiations with the Elders"
 chechnya.73.d: "Community elders continue to exercise considerable authority in rural areas. They offer cooperation in return for recognition of local customs and autonomy. An agreement could strengthen the government, but advocates of centralisation reject limits on the state's religious and legal authority."
 chechnya.73.a: "Establish a council of elders."
 chechnya.73.b: "Sharia must take precedence over adat."
 chechnya.74.t: "The Question of Secular Muslims"
 chechnya.74.d: "Many residents regard Islam as a matter of personal faith and tradition rather than a programme for political transformation. They oppose compulsory religious restrictions despite supporting independence. The government must choose whether to impose uniform religious rules or allow different practices."
 chechnya.74.a: "Enforce our religious rules."
 chechnya.74.b: "Let them practise their faith as they see fit."
 chechnya.75.t: "The Sufi Clergy"
 chechnya.75.d: "Sufi brotherhoods and their religious leaders retain deep roots in local communities. Relations with the government's radical wing are becoming strained. We can recognise their influence and seek cooperation, or attempt to subordinate religious institutions to the state."
 chechnya.75.a: "Reach an agreement with the Sufi sheikhs."
 chechnya.75.b: "Place the clergy under state control."
 chechnya.76.t: "Smena rukovodstva"
 chechnya.76.d: "Enough time has passed since the death of Dzhokhar Dudayev. The interim leadership can no longer postpone the question of stable government. Amid ongoing chaos and fighting, commanders and political factions have gathered to choose the future leader of the Chechen Republic of Ichkeria."
 chechnya.76.a: "Aslakh Maskhadov"
 chechnya.76.b: "Shamil Basaev"
 chechnya.77.t: "Vosstanie v Groznom"
 chechnya.77.d: "Intelligence reports intense underground activity in Grozny. Tensions that have been building for years have erupted into a popular uprising, coinciding with Operation Jihad."
 chechnya.77.a: "Progonim russkikh sviney!"
 chechnya.78.t: "Pribytie Aslana Maskhadova"
 chechnya.78.d: "With tensions on the Chechen-Ingush border reaching a critical point and Russian forces advancing, Colonel Aslan Maskhadov of the Russian Armed Forces resigned his commission and arrived in Grozny. Drawing on extensive experience commanding artillery regiments in the Baltic states, Maskhadov immediately offered his services to Dzhokhar Dudayev’s government.\n\nDudayev greatly appreciated this career officer’s loyalty and professionalism, appointing him Head of Civil Defense of Chechnya and First Deputy Chief of the General Staff. Maskhadov now faces the extremely difficult task of reorganizing Ichkeria’s scattered militia detachments into a regular, combat-capable army in the shortest possible time."
 chechnya.78.a: "Nadeemsya na nego!"
 chechnya.89.a: "Nachat podgotovku."
 chechnya.90.t: "Basaev gotovit azerbaydzhanskiy otryad"
 chechnya.90.d: "Shamil Basayev has taken charge of preparing a separate detachment for operations in Azerbaijan. When our offensive begins, his fighters will advance alongside the army and local supporters."
 chechnya.90.a: "On znaet svoyo delo."
 chechnya.91.t: "Vtorzhenie v Azerbaydzhan"
 chechnya.91.d: "A military operation against Azerbaijan has begun. Prepared underground cells have joined our side, and some local military units have also come under our command."
 chechnya.91.a: "Vperyod."
 chechnya.92.t: "Mirnoe predlozhenie Baku"
 chechnya.92.d: "Azerbaijani troops have restored control over all of their prewar regions. Baku offers to end hostilities without territorial changes."
 chechnya.92.a: "Zakonchit etu kampaniyu."
 chechnya.92.b: "Prodolzhit voynu."
 chechnya.92.c: "Obstanovka uzhe izmenilas."
 chechnya.93.t: "Gibel Shamilya Basaeva"
 chechnya.93.d: "Shamil Basayev was killed during the retreat from Azerbaijan. His death has dealt a severe blow to supporters of the Islamic government and the army leadership. Zelimkhan Yandarbiyev has assumed leadership of the republic, and mourning has been declared in Chechnya."
 chechnya.93.a: "Tyazhyolyy den dlya respubliki."
 chechnya.94.t: "Azerbaydzhan pod nashim kontrolem"
 chechnya.94.d: "The Azerbaijan campaign ended with the establishment of our rule. Now we must consolidate control over the territories we have gained."
 chechnya.94.a: "Zakrepit dostignutoe."
 chechnya.95.t: "Azerbaydzhanskaya operatsiya zavershena"
 chechnya.95.d: "The attempt to subjugate Azerbaijan has failed. Military commanders are ending the operation, and public disappointment has weakened support for the government."
 chechnya.95.a: "Nuzhno vosstanovit doverie."
 CHE_Deport_Russians_desc: "The position of Russian residents has divided the government. Dudayev can reject deportation or authorise a limited campaign. A separate event will determine the policy."
 CHE_deports_of_russians_desc: "The radical government intends to expel Russian residents on a larger scale. The displacement will be concentrated in Grozny and northern Chechnya, worsen relations with Russia and prompt a response from Moscow."
