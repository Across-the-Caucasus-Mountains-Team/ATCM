 CHE_islamic_republic_stability_decision: "Islamic Republic Stability"
 CHE_islamic_republic_stability_decision_desc: "After Islamist forces won the presidential elections, the new Islamic Republic of Ichkeria embarked on a fragile path toward full independence. Yet the country faces enormous challenges: the collapse of Soviet institutions, economic instability, and a powerful domestic opposition.\n\nIslamist Radicalization: §Y[?CHE_the_radicalism_of_islamists_value|%%]§!\n\nOpposition Strength: §Y[?CHE_moderate_opposition_value|%%]§!"
