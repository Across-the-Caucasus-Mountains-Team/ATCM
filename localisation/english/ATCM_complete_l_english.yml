 SAK_Drafting_New_constitution: "Drafting the New Constitution"
 SAK_Drafting_New_constitution_desc: "\n\n\n\n£GFX_idea_New_constituion_desc_photo\n\n\n\n\n\n\n Time to Change our Constitution for Our Country and Our People."
 SAK_New_Currency: "Draft the New Currency"
 SAK_New_Currency_desc: "\n\n\n\n£GFX_idea_Currency_desc_Photo\n\n\n\n\n\n\n No to Ruble! Yes to Lari!"
 SAK_State_of_emergency: "State of Emergency"
 SAK_State_of_emergency_desc: "\n\n\n\n£GFX_idea_State_of_Emergency_desc_photo\n\n\n\n\n\n\n On September 23rd, the rebel factions of the Georgian National Guard led by Tengiz Kitovani entered Tbilisi to support the opposition in the clashes and seized the television station. On 24 September, Zviad Gamsakhurdia proclaimed a state of emergency. One of the first armed clashes which resulted in casualties occurred on 25 September, when the rebel units of the National Guard attempted to take over a power station in Tbilisi but were driven back by police. Four died as a result of clash."
 SAK_Clashes_in_south_ossetia: "Clashes in South Osseita"
 SAK_Clashes_in_south_ossetia_desc: "\n\n\n\n£GFX_idea_Clashes_in_ossetia_desc_photo\n\n\n\n\n\n\n  in 5th January of 1991, Ossetian Militia opened fire to National Guard Personnals in Tskhinvali which resulted battle, Ossetians build barricades while National Guard struggles to crush the resistance."
 SAK_Blitz_in_Abkhazia: "Blitz Abkhazia"
 SAK_Blitz_in_Abkhazia_desc: "\n\n\n\n£GFX_idea_Blitz_Abkhazia_desc_photo\n\n\n\n\n\n\n Tank go BRRRRRRRRRRRR"
 SAK_Ruins_of_central_tbilisi: "Ruins of Tbilisi"
 SAK_Ruins_of_central_tbilisi_desc: "\n\n\n\n£GFX_idea_Ruins_of_Tbilisi_desc_photo\n\n\n\n\n\n\n  After Coup in Tbilisi, Tbilisi left with Ruins and damaged buildings."
 SAK_Overcrowded_Hospitals: "Overcrowded Hospitals"
 SAK_Overcrowded_Hospitals_desc: "\n\n\n\n£GFX_idea_Overcrowded_Tbilisi_desc_photo\n\n\n\n\n\n\n After coup in Tbilisi, Tbilisi is left with Overcrowded Hospitals, Hospitals not only recived many patients but also has poor Equipment which makes proccess harder."
 SAK_Zviadists_in_the_west: "Zviadists resistance"
 SAK_Zviadists_in_the_west_desc: "\n\n\n\n£GFX_idea_Zviadists_desc_photo\n\n\n\n\n\n\n After overtrhow of Gamsakhurdia, Zviadists (Pro-Gamsakhurdians) Started Unrest in Samegrelo (Gamsakhurdia's Home region) this created massive supply issues and Zugdidi basiclly become stronghold of Zviadists as their huge resistance makes our Troops impossible to enter in city without danger."
 SAK_Zviadists_in_the_west_two: "Zviadists resistance"
 SAK_Zviadists_in_the_west_two_desc: "\n\n\n\n£GFX_idea_Zviadists_desc_photo\n\n\n\n\n\n\n After overtrhow of Gamsakhurdia, Zviadists (Pro-Gamsakhurdians) Started Unrest in Samegrelo (Gamsakhurdia's Home region) this created massive supply issues and Zugdidi basiclly become stronghold of Zviadists as their huge resistance makes our Troops impossible to enter in city without danger."
 SAK_military_propaganda: "Military Propaganda"
 SAK_military_propaganda_desc: "\n\n\n\n£GFX_idea_Military_propaganda_desc_photo\n\n\n\n\n\n\n Join your glorious country's Armed forces now!"
 SAK_Weak_Georgian_Armed_forces: "Weak Georgian Armed Forces"
 SAK_Weak_Georgian_Armed_forces_desc: "\n\n\n\n£GFX_idea_Weak_Armed_Forces_desc_photo\n\n\n\n\n\n\n Our Equipment and doctrine is outdated, a big part of our army is controlled by the USSR, our Soldiers are untrained and demoralized."
 SAK_Anarchy_in_Georgia: "Anarchy in Georgia"
 SAK_Anarchy_in_Georgia_desc: "\n\n\n\n£GFX_idea_Anarchism_in_georgia_desc_photo\n\n\n\n\n\n\n The Coup resulted in anarchy in Georgia. Thievery and homocide started skyrocketing while corrupted police are too slow to react, which is giving criminals good space for crimes. The coup also resulted in an economic collapse which further darkens our current situation."
 SAK_Battle_of_Tskhinvali: "Battle of Tskhinvali"
 SAK_Funding_Pro_Government_Media: "Funding Pro-Government media"
 SAK_Propaganda_Campaign: "Propaganda Campaign"
 Nagarno_karabakh_conflict: "Nagarno-Karabakh conflict"
 Nagarno_karabakh_conflict_desc: "\n\n\n\n£GFX_idea_Nagarno_karabakh_war_desc_picture\n\n\n\n\n\n\nEven though both Armenia and Azerbaijan are Republics of the Soviet union their disagreements have still led to armed conflict, this will further destabilise the Soviets grip on the Caucusus."
 RAS_Boris_Yeltsin_idea: "Boris yeltsin calls"
 RAS_Boris_Yeltsin_idea_desc: "\n\n\n\n£GFX_idea_Yeltsin_calls_desc_photo\n\n\n\n\n\n\n Once a loyal Communist, Boris Yeltsin has transformed into the loudest voice for radical reform and decentralization. His populist rhetoric, calls for Russian sovereignty, and direct appeals to the people undermine both the Party and the Union. As his popularity grows, so too does the power of nationalist and separatist forces fueling fears in Moscow of total collapse."
 RAS_Memories_of_afhganistan_war: "Memories of Afghanistan war"
 RAS_Memories_of_afhganistan_war_desc: "\n\n\n\n£GFX_idea_Afghanistan_memories_desc_photo\n\n\n\n\n\n\n The Soviet intervention in Afghanistan, once framed as a strategic operation to support a fraternal socialist regime, ended in humiliation, trauma, and political disillusionment. Veterans return broken, the military’s prestige lies in tatters, and public trust in leadership is eroding. The war's ghosts still haunt the Union, feeding anti-government sentiment, desertion, and a growing sense that Moscow has lost its way."
 RAS_hardliners_protest: "Hardliners Protest"
 RAS_hardliners_protest_desc: "\n\n\n\n£GFX_idea_Hardliners_protest_desc_photo\n\n\n\n\n\n\n Alarmed by the unraveling of central authority, economic chaos, and nationalist agitation, Communist hardliners are mobilizing. They call for a return to order, Soviet unity, and firm leadership. Their networks within the military, KGB, and bureaucracy pose a serious threat to reform hinting at coup plots and the reimposition of emergency rule. The tension between progress and preservation is reaching its breaking point."
 RAS_hardliners_protest_2: "Hardliners Protest"
 RAS_hardliners_protest_2_desc: "\n\n\n\n£GFX_idea_Hardliners_protest_desc_photo\n\n\n\n\n\n\n Alarmed by the unraveling of central authority, economic chaos, and nationalist agitation, Communist hardliners are mobilizing. They call for a return to order, Soviet unity, and firm leadership. Their networks within the military, KGB, and bureaucracy pose a serious threat to reform hinting at coup plots and the reimposition of emergency rule. The tension between progress and preservation is reaching its breaking point."
 RAS_Failed_perestroika: "Failed Perestroika"
 RAS_Failed_perestroika_desc: "\n\n\n\n£GFX_idea_Perestroika_desc_photo\n\n\n\n\n\n\n The ambitious reforms of Perestroika were meant to revitalize the economy, democratize governance, and renew faith in the Union. Instead, they accelerated decay. Political liberalization outpaced economic restructuring, exposing the state's weaknesses and emboldening separatist movements. Corruption deepened, supply chains collapsed, and public trust in the system eroded beyond repair. What was envisioned as a renaissance has become a slow-motion disintegration one that we must now manage, or be consumed by."
 RAS_reformists_protest: "Reformists Protest"
 RAS_reformists_protest_desc: "\n\n\n\n£GFX_idea_Reformists_protest_desc_photo\n\n\n\n\n\n\n To many within the Party's left wing, Gorbachev's reforms were not bold, they were cowardly. They demanded a radical restructuring of the economy, an end to central stagnation, and immediate democratization of the state apparatus. Instead, they were met with half measures, cautious committees, and indecisive leadership. Disillusioned yet still loyal to the ideals of socialism, these reformists have taken to the streets and party halls alike, calling for a true revolution from within. Their agitation threatens to fracture the already-crumbling unity of the state."
 RAS_Separatism: "Separatists"
 RAS_Separatism_desc: "\n\n\n\n£GFX_idea_Separatism_desc_photo\n\n\n\n\n\n\n As the central government's grip weakens, long-suppressed national identities are rising with uncompromising clarity. From the Baltic shores to the Caucasus mountains, ethnic groups and regional elites are demanding autonomy or outright independence. No longer content with symbolic concessions, they see Moscow as an occupying force, not a unifying center. Some organize protests, others, militias. What the Party calls treason, they call liberation. If left unchecked, this wave of separatism could tear the Union apart, republic by republic."
