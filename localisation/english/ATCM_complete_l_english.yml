 CHE_memories_of_deportations: "Memories of 1944"
 CHE_memories_of_deportations_desc: "\n\n\n\n£GFX_idea_memories_of_deportation_desc_photo\n\n\n\n\n\n\n The trauma of 1944 still lingers in the hearts of our people. That year, entire Chechen and Ingush communities were uprooted by Soviet decree, accused en masse of treason and collaboration without trial, without evidence. Deported in cattle cars to the harsh steppes of Central Asia, nearly half did not survive the journey or the bitter years that followed. "
