 support_equipment_1_desc: "Radios, vehicles, pontoon bridges, and other auxiliary military equipment."
 ifv_equipment: "Infantry Fighting Vehicles"
 ifv_equipment_short: "BMP"
 ifv_equipment_desc: "Infantry Fighting Vehicles"
 ifv_0_equipment: "BMP-1"
 ifv_0_equipment_short: "BMP-1"
 ifv_0_equipment_desc: "The BMP-1 is a Soviet tracked infantry fighting vehicle armed with a 73 mm 2A28 Grom gun and an anti-tank missile system. It transports infantry, provides fire support, and can swim across water obstacles."
 ifv_1_equipment: "BMP-2"
 ifv_1_equipment_short: "BMP-2"
 ifv_1_equipment_desc: "The BMP-2 is a development of the BMP-1 armed with a 30 mm 2A42 automatic cannon and anti-tank missiles. It has better capabilities against infantry and aerial targets while retaining high mobility and amphibious capability."
 ifv_2_equipment: "BMP-3"
 ifv_2_equipment_short: "BMP-3"
 ifv_2_equipment_desc: "The BMP-3 is an infantry fighting vehicle with a powerful armament suite, including a 100 mm 2A70 gun and a 30 mm 2A72 automatic cannon. It combines strong firepower, good mobility, and amphibious capability."
 ifv_3_equipment: "Infantry Fighting Vehicle IV"
 ifv_3_equipment_short: "Ifv 3 Equipment Short"
 ifv_3_equipment_desc: "Infantry Fighting Vehicle IV"
 apc_equipment: "Armored Personnel Carriers"
 apc_equipment_short: "BTR"
 apc_equipment_desc: "Armored Personnel Carriers"
 apc_0_equipment: "BTR-152"
 apc_0_equipment_short: "BTR-152"
 apc_0_equipment_desc: "BTR-152"
 apc_1_equipment: "BTR-60PB"
 apc_1_equipment_short: "BTR-60PB"
 apc_1_equipment_desc: "The BTR-60PB is a Soviet 8×8 wheeled armored personnel carrier intended to transport motor rifle troops. It is armed with a heavy KPVT machine gun and is amphibious."
 apc_2_equipment: "BTR-70"
 apc_2_equipment_short: "BTR-70"
 apc_2_equipment_desc: "The BTR-70 is a Soviet 8×8 wheeled armored personnel carrier designed to protect infantry in transit and provide fire support. It carries a 14.5 mm KPVT machine gun and is highly mobile across rough ground."
 apc_3_equipment: "BTR-80"
 apc_3_equipment_short: "BTR-80"
 apc_3_equipment_desc: "The BTR-80 is an 8×8 wheeled APC with a diesel engine, improved mobility, and easier troop dismounting. It is armed with a 14.5 mm KPVT machine gun and retains amphibious capability."
 apc_4_equipment: "BTR-90"
 apc_4_equipment_short: "BTR-90"
 apc_4_equipment_desc: "BTR-90"
 airborne_combat_vehicle: "Airborne Combat Vehicles"
 airborne_combat_vehicle_short: "BMD"
 airborne_combat_vehicle_desc: "Airborne Combat Vehicles"
 airborne_combat_vehicle_0: "BMD-1"
 airborne_combat_vehicle_0_short: "BMD-1"
 airborne_combat_vehicle_0_desc: "The BMD-1 is a Soviet airborne combat vehicle designed for parachute deployment. It carries a 73 mm 2A28 Grom gun and gives airborne troops mobility and fire support."
 airborne_combat_vehicle_1: "BMD-2"
 airborne_combat_vehicle_1_short: "BMD-2"
 airborne_combat_vehicle_1_desc: "The BMD-2 is a modernized airborne combat vehicle with a 30 mm 2A42 automatic cannon and anti-tank missile armament, retaining low weight, high mobility, and airdrop capability."
 airborne_combat_vehicle_2: "BMD-3"
 airborne_combat_vehicle_2_short: "BMD-3"
 airborne_combat_vehicle_2_desc: "The BMD-3 is a Russian tracked airborne combat vehicle with a 100 mm 2A70 gun, a 30 mm 2A72 automatic cannon, and an anti-tank missile system. It transports paratroopers, supports them with fire, and engages enemy armor."
 airborne_combat_vehicle_3: "BMD-4"
 airborne_combat_vehicle_3_short: "BMD-4"
 airborne_combat_vehicle_3_desc: "The BMD-4 is a Russian tracked airborne combat vehicle equipped with the Bakhcha-U turret, combining a 100 mm 2A70 gun, a 30 mm 2A72 automatic cannon, and anti-tank missiles. It transports airborne troops and engages infantry, armor, and fortifications."
 towed_artillery_equipment: "Towed Artillery"
 towed_artillery_equipment_desc: "Towed guns and howitzers used to provide fire support to ground forces."
 towed_artillery_equipment_1: "152 mm D-20 Gun-Howitzer"
 towed_artillery_equipment_1_desc: "The D-20 is a 152 mm gun-howitzer firing powerful shells for sustained fire support. It requires a towing vehicle and a large gun crew."
 towed_artillery_equipment_2: "122 mm D-30 Howitzer"
 towed_artillery_equipment_2_desc: "The D-30 is a lighter, more mobile 122 mm howitzer that is cheaper to produce. Its lighter shell is compensated for by quick deployment and reliability."
 towed_artillery_equipment_3: "152 mm 2A36 Giatsint-B Gun"
 towed_artillery_equipment_3_desc: "The 2A36 Giatsint-B is a long-range heavy 152 mm gun designed for counter-battery fire. Its range requires a more complex and expensive carriage."
 towed_artillery_equipment_4: "152 mm 2A65 Msta-B Howitzer"
 towed_artillery_equipment_4_desc: "The 2A65 Msta-B is a 152 mm towed howitzer with improved fire-data handling and a broad range of firing angles."
 towed_artillery_equipment_1_short: "D-20"
 towed_artillery_equipment_2_short: "D-30"
 towed_artillery_equipment_3_short: "2A36"
 towed_artillery_equipment_4_short: "2A65"
 towed_artillery_1: "D-20 — 152 mm Gun-Howitzer"
 towed_artillery_1_desc: "Master production of the 152 mm D-20 gun-howitzer for powerful fire support. Unlocks D-20 production."
 towed_artillery_2: "D-30 — 122 mm Howitzer"
 towed_artillery_2_desc: "Master production of the light and reliable 122 mm D-30 howitzer for mobile artillery. Unlocks D-30 production."
 towed_artillery_3: "D-30 — Improved Fire Control"
 towed_artillery_3_desc: "Improved sights and crew training increase the accuracy and coordination of artillery fire."
 towed_artillery_4: "D-30 — Improved Fire Support"
 towed_artillery_4_desc: "Better artillery reconnaissance and fire-control methods make batteries more effective."
 towed_artillery_5: "2A36 Giatsint-B — 152 mm Gun"
 towed_artillery_5_desc: "The long-range 152 mm towed 2A36 Giatsint-B gun is particularly useful for counter-battery missions. Unlocks 2A36 production."
 towed_artillery_6: "2A36 — Firepower Improvements"
 towed_artillery_6_desc: "Improved observation, fire correction, and command procedures increase the effectiveness of 2A36 gun batteries."
 towed_artillery_7: "2A65 Msta-B — 152 mm Howitzer"
 towed_artillery_7_desc: "Adopting the 152 mm towed 2A65 Msta-B howitzer provides more effective fire support. Unlocks 2A65 production."
