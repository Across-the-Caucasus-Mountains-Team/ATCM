 CHE_peace_negotiations_first_chechen_war_decision: "Peace Negotiations"
 CHE_peace_negotiations_first_chechen_war_decision_desc: "The war has dragged on. Despite the bravery of our fighters and popular support, we cannot ignore the devastation, hunger, and exhaustion it brings. Some commanders and political figures have begun to consider dialogue with Moscow. \n\nProgress of negotiations: §G[?RAS_negotiation_process_fcw_value|%%]§!"
 CHE_stability_of_republic_decision: "Stability of the Republic"
 CHE_stability_of_republic_decision_desc: "Following Dzhokhar Dudayev's victory in the presidential elections, the newly proclaimed Republic of Ichkeria is on a fragile path toward full independence. However, the country faces immense challenges, the collapse of Soviet institutions, economic uncertainty, and the existence of powerful internal opposition forces.\n\nLegitimacy of Dudayev: §Y[?CHE_legitimacy_of_dudayev_value|%%]§! \n\nPower of opposition: §Y[?CHE_power_of_opposition_value|%%]§!"
 CHE_hold_Grozny: "Hold Grozny"
 CHE_hold_Grozny_desc: "The capital of the Chechen Republic, Grozny, is under constant threat from Russian forces. The city is a symbol of our struggle and must be defended at all costs."
 CHE_hold_Shali: "Hold Shali"
 CHE_hold_Shali_desc: "The town of Shali is a key strategic point in the Chechen Republic. Its defense is crucial for maintaining control over the region and ensuring the safety of our people."
 CHE_hold_Gudermes: "Hold Gudermes"
 CHE_hold_Gudermes_desc: "Gudermes is a vital transportation hub and a center of resistance against Russian forces. Its defense is essential for maintaining our supply lines and communication."
 CHE_hold_Argun: "Hold Argun"
 CHE_hold_Argun_desc: "The town of Argun is a key point in the defense of the Chechen Republic. Its capture by Russian forces would threaten our control over the region and disrupt our supply lines."
 CHE_hold_UrusMartan: "Hold Urus-Martan"
 CHE_hold_UrusMartan_desc: "Urus-Martan is a strategic location in the Chechen Republic. Its defense is crucial for maintaining our control over the region and ensuring the safety of our people."
 CHE_mobilize_additional_forces_in_Grozny: "Mobilize additional forces"
 CHE_mobilize_additional_forces_in_Grozny_desc: "The defense of Grozny is critical for the survival of the Chechen Republic. Mobilizing additional forces will strengthen our position and deter Russian attacks."
 chechnya.68.t: "The Legacy of Soviet Aviation"
 chechnya.68d: "The withdrawal of Russian troops has left a large collection of former Soviet training aircraft at Khankala and Kalinovskaya. The inventory includes L-29 and L-39 trainers, older MiG fighters, transport aircraft and helicopters. Their condition varies considerably, and only serviceable machines can form the basis of our air force."
 chechnya.68.a: "Start with the aircraft that can still fly."
 CHE_weapon_depreservation: "Weapon Depreservation"
 CHE_weapon_depreservation_desc: "The Chechen Republic is in dire need of weapons and ammunition. Depreservation of stored weapons will provide our fighters with the necessary equipment to continue the struggle against Russian forces."
 CHE_first_chechen_war_decision: "First Chechen War"
 CHE_first_chechen_war_decision_desc: "The First Chechen War has begun. The Chechen Republic is facing a brutal invasion by Russian forces, determined to crush our struggle for independence. The war will test the resilience and determination of our people."
