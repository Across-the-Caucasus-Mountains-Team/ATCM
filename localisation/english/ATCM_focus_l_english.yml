 AZR_Soviet_State: "Soviet Republic"
 AZR_Soviet_State_desc: "Azerbaijani SSR like other Soviet republics is on the brink of big changes. Growing discontent and weakening central authority in Moscow foretell a coming storm."
 AZR_Sovereignty_Question: "Sovereignty Question"
 AZR_Sovereignty_Question_desc: "In Azerbaijan, like in other Soviet republics, discontent with Moscow's policies is growing. The Popular Front and other national movements are demanding greater autonomy and independence from the central government."
 AZR_Preservation_of_USSR: "Preserve the USSR?"
 AZR_Preservation_of_USSR_desc: "Pro-Soviet elites in Azerbaijan are wondering whether to leave the USSR. They fear that this will lead to chaos and instability in the republic."
 AZR_Soviet_Loyalty: "Loyalty to the USSR"
 AZR_Soviet_Loyalty_desc: "Azerbaijan should remain loyal to the Soviet Union. We must support unity and stability in the republic, despite growing discontent and demands for independence."
 AZR_Support_Coup: "Support the Coup"
 AZR_Support_Coup_desc: "With the help of Moscow, pro-Soviet elites in Azerbaijan decided to stage a coup to prevent the Popular Front and other national movements from coming to power."
 AZR_Communist_Preservation: "Preservation of Communism"
 AZR_Communist_Preservation_desc: "Azerbaijan will remain part of the USSR. This will be the beginning of a new era for our republic, where we will fight"

 AZR_Pursuit_of_Independence: "Pursuit of Independence"
 AZR_Pursuit_of_Independence_desc: "Azerbaijan's Popular Front and other national movements see no other solution than complete separation from the USSR. To achieve a bright future, we must become a sovereign state."
 AZR_Anti_Communist_Protests: "Anti-Communist Protests"
 AZR_Anti_Communist_Protests_desc: "The people began taking to the streets demanding the overthrow of the communist regime. Protests are becoming increasingly massive and aggressive, and the Kremlin begins to realize that the situation is getting out of control."
 AZR_Musavat_Revival: "Revival of Musavat"
 AZR_Musavat_Revival_desc: "\"Musavat\", the Azerbaijani democratic party banned in 1920, is being revived. It advocates for Azerbaijan's independence and opposes the communist regime. The party is beginning to gain popularity among the population."
 AZR_New_Parties_Creation: "Creation of New Parties"
 AZR_New_Parties_Creation_desc: "Amid growing dissatisfaction and political instability in Azerbaijan, new political parties emerge advocating independence and democratic reforms. These parties are starting to gain popularity among the population."
 AZR_Pro_Democratic_Speeches: "Pro-Democratic Speeches"
 AZR_Pro_Democratic_Speeches_desc: "Leaders of various opposition parties give speeches calling for democratic reforms and independence from the Soviet Union. These speeches are becoming increasingly popular among the population."
 AZR_Founding_Democratic_Institutions: "Founding Democratic Institutions"
 AZR_Founding_Democratic_Institutions_desc: "New political parties begin establishing their own institutions, such as press offices, youth organizations, etc. This allows them to strengthen their positions and expand their influence on society."
 AZR_Declare_Independence: "Declaration of Independence"
 AZR_Declare_Independence_desc: "After many years of struggle for independence, Azerbaijan finally declares its independence from the Soviet Union. This event becomes a landmark for the entire country and opens a new era in its history."
