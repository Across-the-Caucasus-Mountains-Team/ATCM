 Georgia_focus: "Soviet Georgia Focus Tree"
 SAK_gamsakhurdia_speech: "Gamsakhurdia's Speech"
 SAK_gamsakhurdia_speech_desc: "For a long time, Gamsakhurdia has been aiming for the Georgian freedom, and in each and every speech, he envisions Georgia as a powerful and religious nation. But we see the cracks in the Soviet Union that we can use to slip away from Moscow, but for that, we need support of the people. \nNow, Gamsakhurdia gives speeches across the entire Georgian SSR, propagating freedom of his homeland to the citizens."
 SAK_the_last_steps_toward_independence: "The Last Steps Towards Independence"
 SAK_the_last_steps_toward_independence_desc: "We have been working for a long time to regain our independence. Now, as the Soviet Union is slowly collapsing, we may start our last preparations for the referendum of the Georgian freedom."
 SAK_consolidate_the_nationalist_government: "Consolidate the Nationalist Government"
 SAK_consolidate_the_nationalist_government_desc: "Ever since the Soviet collapse started, the nationalist movement has been growing stronger across the entire Georgian SSR. If we want to ensure our independence, we must show them our support."
 SAK_shida_konplikti: "Shida Konplikti"
 SAK_shida_konplikti_desc: "Since 1989, Georgia has been at the brink of collapse and at the risk of the intervention from the Russian SFSR. The more we want our independence, the worse our conflict with Abkhazians, South Ossetians and Russians becomes. \nAnd now, we need to make sure our military can fight back against our enemies, both internal and external."
 SAK_tensions_in_south_ossetia: "Tensions in South Ossetia"
 SAK_tensions_in_south_ossetia_desc: "The conflict with South Ossetia grows worse, and it will lead us to our downfall if we do not do anything about it. We must deal with our eternal enemy once and for all."
 SAK_reinforce_the_national_guard: "Reinforce the National Guard"
 SAK_reinforce_the_national_guard_tt: "Cash Balance: §R-15 M§!."
 SAK_reinforce_the_national_guard_desc: "National Guard, as of now, is the backbone of our military: it is the only structure that can fight against our enemies effectively. And if we want our National Guard to protect Georgia from foes, we have to reorganize it and resupply it with better weapons."
 SAK_mobilize_the_economy: "Mobilize Economy"
 SAK_mobilize_the_economy_tt: "Cash Balance: §G+5 M§!."
 SAK_mobilize_the_economy_desc: "Georgia is a state that aims for its freedom, and there have been no moments when the nation got independence for free. If we want to make sure we can defend ourselves and mobilize more soldiers into our small army, we need to mobilize our economy and produce more guns and ammunitions for this."
 SAK_diplomatia: "Diplomatia"
 SAK_diplomatia_desc: "If we want to become a new free nation, we must ensure our recognition of the outside world. With that in mind, Gamsakhurdia starts his journey across the world in an attempt to get the needed support for Georgia to exist as a Republic and not as a part of the USSR."
 SAK_pro_western_diplomacy: "Pro-Western Diplomacy"
 SAK_pro_western_diplomacy_desc: "If we want to be free from the Soviet Union, we have to build our own foreign politics. The main enemy of our enemy is the West - more specifically, the USA and NATO. \nIf they support us in our cause, we may aim for Georgia being in NATO and even in the European Union."
 SAK_ask_for_international_recognition: "Ask for Recognition"
 SAK_ask_for_international_recognition_desc: "Georgia should be the same nation as any other in the world, including the ones that already proclaimed independence from Kremlin. We will contact the United Nations to request its recognition and support of our independence. All we can do from then is only hope that they will help us out."
 SAK_ask_for_international_recognition_tt: "Cash Balance: §R-100 K§!."
 SAK_foreign_policy_independence: "Foreign Policy Independence"
 SAK_foreign_policy_independence_desc: "Georgian SSR is an autonomous republic that must have its own foreign politics, especially when we aim for our own freedom. Therefore, we will break away from the Moscow's control it has over our diplomacy and start working with other countries for our better future."
 SAK_independence_referendum: "Independence Referendum"
 SAK_independence_referendum_desc: "When we are finally sure that we have enough support from other nations and we have enough weapons to defend our small land, we can now start an official referendum for the Georgian independence. \nThe future will be decided now..."

 Independent_Georgia_focus: "Independent Georgia Focus Tree"
 SAK_rise_from_the_dead: "Rise from the Dead"
 SAK_rise_from_the_dead_desc: "Today we have risen up against our oppressor, the Soviet Union. After almost a century of Soviet occupation, we rose up and once again became independent. Glory to Independent Sakartvelo!"
 SAK_decommunization: "Decommunization"
 SAK_decommunization_desc: "Dismantling Soviet political structures will help consolidate independence. New institutions must replace the party apparatus and define their relationship with the Soviet legacy."
 SAK_begin_our_work: "Begin Our Work"
 SAK_begin_our_work_desc: "Declaring independence is only the beginning. We must make state institutions function and begin addressing the problems that have accumulated."
 SAK_mtavroba: "Mtavroba"
 SAK_mtavroba_desc: "The new state needs a functioning government. Clear responsibilities and powers will allow us to move from political declarations to the daily work of governing."
 SAK_draft_a_new_constitution: "Draft a New constitution"
 SAK_draft_a_new_constitution_desc: "We, the citizens of Georgia, whose firm will is to establish a democratic social order, economic freedom, a rule-of-law and a social state, to secure universally recognized human rights and freedoms, to enhance state independence and peaceful relations with other peoples, drawing inspiration from centuries-old traditions of statehood of the Georgian nation and the historical-legal legacy of the Constitution of Georgia of 1921, proclaim the present Constitution before God and the nation."
 SAK_establish_national_sovereignty: "Establish National Sovereignty"
 SAK_establish_national_sovereignty_desc: "Sovereignty must exist in practice as well as on paper. We must establish the authority of Georgian institutions and ensure that their decisions are enforced."
 SAK_a_political_revolution: "A Political Revolution"
 SAK_privatization: "Privatization"
 SAK_privatization_desc: "The transition from a planned economy requires a decision on state enterprises. Privatization will create room for private initiative, while demanding oversight of how ownership is distributed."
 SAK_nationalize_resources: "Nationalize Resources"
 SAK_nationalize_resources_desc: "The country’s resources must support its recovery. Retaining state control will allow their revenues to be directed toward the republic’s most pressing needs."
 SAK_abkhazians: "Abkhazians..."
 SAK_abkhazians_desc: "Relations with Abkhazia are becoming a central test for independent Georgia. The government must respond to demands for autonomy and prevent the conflict from deepening."
 SAK_khalkhi: "Khalkhi"
 SAK_khalkhi_desc: "Independence will remain fragile without public support. The state must address social needs and build trust between citizens and the new institutions."
 SAK_reform_schools: "Reform Schools"
 SAK_reform_schools_desc: "Schools must adapt to the new state. Updating curricula and supporting teachers will help preserve access to education through the transition."
 SAK_georgianization_policies: "Georgianization Policies"
 SAK_rebuild_the_faith: "Rebuild the Faith"
 SAK_rebuild_the_faith_desc: "After decades of state atheism, religious life is returning to the public sphere. Cooperation with the church will form part of the restoration of cultural and spiritual traditions."
 SAK_create_a_new_currency: "Create a New Currency"
 SAK_create_a_new_currency_desc: "Financial independence requires preparation for a national monetary system. We must organize the issue of currency and build confidence in the new means of payment."
 SAK_the_9th_april_tragedy: "The 9th April Tragedy"
 SAK_the_9th_april_tragedy_desc: "The events of 9 April 1989 marked a turning point in the struggle for independence. The memory of those who died must receive a lasting place in the republic’s public life."
 SAK_ossetians: "Ossetians..."
 SAK_ossetians_desc: "The dispute over South Ossetia’s status threatens the stability of the state. We must define our policy toward the region and find a way out of the growing confrontation."
 SAK_the_power_struggle: "§RThe Power Struggle§!"
 SAK_the_power_struggle_desc: "Disputes between political leaders and armed formations are becoming an open struggle for power. Its outcome will determine the future of the government and the republic."
