 Georgia_focus:0 "Soviet Georgia Focus Tree"
 SAK_gamsakhurdia_speech:0 "Gamsakhurdia's Speech"
 SAK_gamsakhurdia_speech_desc:0 ""
 SAK_the_last_steps_toward_independence:0 "The Last Steps Towards Independence"
 SAK_the_last_steps_toward_independence_desc:0 "We have been working for a long time to regain our independence. Now, as the Soviet Union is slowly collapsing, we may start our last preparations for the referendum of the Georgian freedom."
 SAK_consolidate_the_nationalist_government:0 "Consolidate the Nationalist Government"
 SAK_consolidate_the_nationalist_government_desc:0 "Ever since the Soviet collapse started, the nationalist movement has been growing stronger across the entire Georgian SSR. If we want to ensure our independence, we must show them our support."
 SAK_shida_konplikti:0 "Shida Konplikti"
 SAK_shida_konplikti_desc:0 "Since 1989, Georgia has been at the brink of collapse and at the risk of the intervention from the Russian SFSR. The more we want our independence, the worse our conflict with Abkhazians, South Ossetians and Russians becomes. \nAnd now, we need to make sure our military can fight back against our enemies, both internal and external."
 SAK_tensions_in_south_ossetia:0 "Tensions in South Ossetia"
 SAK_tensions_in_south_ossetia_desc:0 "The conflict with South Ossetia grows worse, and it will lead us to our downfall if we do not do anything about it. We must deal with our eternal enemy once and for all."
 SAK_reinforce_the_national_guard:0 "Reinforce the National Guard"
 SAK_reinforce_the_national_guard_tt:0 "Cash Balance: §R-15 M§!."
 SAK_reinforce_the_national_guard_desc:0 "National Guard, as of now, is the backbone of our military: it is the only structure that can fight against our enemies effectively. And if we want our National Guard to protect Georgia from foes, we have to reorganize it and resupply it with better weapons."
 SAK_mobilize_the_economy:0 "Mobilize Economy"
 SAK_mobilize_the_economy_tt:0 "Cash Balance: §G+5 M§!."
 SAK_mobilize_the_economy_desc:0 "Georgia is a state that aims for its freedom, and there have been no moments when the nation got independence for free. If we want to make sure we can defend ourselves and mobilize more soldiers into our small army, we need to mobilize our economy and produce more guns and ammunitions for this."
 SAK_diplomatia:0 "Diplomatia"
 SAK_diplomatia_desc:0 "If we want to become a new free nation, we must ensure our recognition of the outside world. With that in mind, Gamsakhurdia starts his journey across the world in an attempt to get the needed support for Georgia to exist as a Republic and not as a part of the USSR."
 SAK_pro_western_diplomacy:0 "Pro-Western Diplomacy"
 SAK_pro_western_diplomacy_desc:0 "If we want to be free from the Soviet Union, we have to build our own foreign politics. The main enemy of our enemy is the West - more specifically, the USA and NATO. \nIf they support us in our cause, we may aim for Georgia being in NATO and even in the European Union."
 SAK_ask_for_international_recognition:0 "Ask for Recognition"
 SAK_ask_for_international_recognition_desc:0 "Georgia should be the same nation as any other in the world, including the ones that already proclaimed independence from Kremlin. We will contact the United Nations to request its recognition and support of our independence. All we can do from then is only hope that they will help us out."
 SAK_ask_for_international_recognition_tt:0 "Cash Balance: §R-100 K§!."
 SAK_foreign_policy_independence:0 "Foreign Policy Independence"
 SAK_foreign_policy_independence_desc:0 "Georgian SSR is an autonomous republic that must have its own foreign politics, especially when we aim for our own freedom. Therefore, we will break away from the Moscow's control it has over our diplomacy and start working with other countries for our better future."
 SAK_independence_referendum:0 "Independence Referendum"
 SAK_independence_referendum_desc:0 "When we are finally sure that we have enough support from other nations and we have enough weapons to defend our small land, we can now start an official referendum for the Georgian independence. \nThe future will be decided now..."

 Independent_Georgia_focus:0 "Independent Georgia Focus Tree"
 SAK_rise_from_the_dead:0 "Rise from the Dead"
 SAK_rise_from_the_dead_desc:0 "Today we have risen up against our oppressor, the Soviet Union. After almost a century of Soviet occupation, we rose up and once again became independent. Glory to Independent Sakartvelo!"
