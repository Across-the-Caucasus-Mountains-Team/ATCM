 SAK_draft_a_new_constitution:0 "Draft a New constitution"
 SAK_draft_a_new_constitution_desc:0 "We, the citizens of Georgia, whose firm will is to establish a democratic social order, economic freedom, a rule-of-law and a social state, to secure universally recognized human rights and freedoms, to enhance state independence and peaceful relations with other peoples, drawing inspiration from centuries-old traditions of statehood of the Georgian nation and the historical-legal legacy of the Constitution of Georgia of 1921, proclaim the present Constitution before God and the nation."
