 generic_focus: "National Focus"
 RAS_gkchp: "GKCHP"
 RAS_gkchp_desc: "The GKCHP is a group of hardliners who want to restore the USSR and overthrow Yeltsin. They are supported by the military and KGB, but they are not very popular among the people."
 RAS_hold_a_referendum: "Hold a Referendum"
 RAS_hold_a_referendum_desc: "We must hold a referendum to determine the future of the Soviet Union. If the people vote for the restoration of the USSR, we will restore it. If they vote for independence, we will respect their decision."
 RAS_be_against_gkchp: "Suppress GKCHP"
 RAS_be_against_gkchp_desc: "We must take a firm stance against the GKCHP and their attempts to undermine the government. Communism is dead, and we must not allow them to bring it back. This is not 1917, this is 1991."
 RAS_support_gkchp: "Support GKCHP"
 RAS_support_gkchp_desc: "We must support the GKCHP and their attempts to restore the USSR. The people are tired of the chaos and instability of the post-Soviet era, and they want a return to the stability of the Soviet Union. We must give them what they want."
 RAS_defeat_of_gkchp: "Defeat of GKCHP"
 RAS_defeat_of_gkchp_desc: "The GKCHP has been defeated, and the people have spoken. They have rejected the idea of restoring the USSR and have chosen to move forward with Democracy. We must respect their decision and work towards building a new future for Russia."
 RAS_suppress_the_rallies: "Suppress the rallies"
 RAS_suppress_the_rallies_desc: "We must suppress the rallies and protests that are taking place in support of the GKCHP. We cannot allow them to undermine the government and create chaos in the streets. We must restore order and stability to our great nation lest we fall into anarchy."
