 RAS_presidency_of_eltsin: "Presidency of Yeltsin"
 RAS_presidency_of_eltsin_desc: "Yeltsin has been elected president of Russia. He is a reformer who wants to build a new Russia, but he is also a hardliner who wants to suppress the separatists and restore order in the country. Balancing these two goals will be difficult, but it is necessary for the future of Russia."
 RAS_emergency_powers: "Emergency powers"
 RAS_emergency_powers_desc: "Emergency powers are necessary to restore order in the country. We must suppress the separatists and restore stability to Russia. This will not be easy, but it is necessary for the future of our great nation."
 RAS_updated_federal_treaty: "Updated Federal Treaty"
 RAS_updated_federal_treaty_desc: "The updated federal treaty aims to address the concerns of the various republics and provide them with greater autonomy while maintaining the integrity of the Russian Federation. It is a delicate balance that must be struck to ensure the stability of the country."
 RAS_the_seventh_congress_of_deputies: "The 7th Congress of deputies"
 RAS_the_seventh_congress_of_deputies_desc: "The 7th Congress of deputies is a crucial moment in the history of the Russian Federation. It is an opportunity for the various republics to come together and address their concerns within the framework of the federal government."
 RAS_leave_gaidar: "Leave Gaidar"
 RAS_leave_gaidar_desc: "Gaidar has been a controversial figure in Russian politics, and his arrival into the government will be a significant moment in the history of the Russian Federation. It is an opportunity for new faces and ideas to emerge and for the country to move forward."
 RAS_gaydaras_resignation: "Gaidar resign"
 RAS_gaydaras_resignation_desc: "Gaidar's resignation is a significant moment in the history of the Russian Federation. Gaidar's departure will also allow for a more balanced approach to governance, with a focus on both economic reform and stability. Perhaps instead of a shock therapy, we can have a more gradual approach to economic reform that takes into account the needs of the people and the economy."
 RAS_the_eighth_congress_of_deputies: "The 8th congress of deputies"
 RAS_black_october: "Black October"
 RAS_black_october_desc: "The Government has been dissolved, and the parliament is in chaos. The military is on the streets, and the people are scared. This is a critical moment in the history of the Russian Federation, and it will determine the future of the country."
