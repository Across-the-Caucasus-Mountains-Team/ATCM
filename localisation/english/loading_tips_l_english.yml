LOADING_TIP_23: "«Terror is the very last resort, especially for a state of any rank. For a person, terror is the last thing, and to elevate it to the rank of state policy, one must be a complete paranoid. And is it worth it for me, and for my government, for our young state, to sink to the level of the Russian leadership, to answer terror with terror? But the realities that have developed are as follows: for some reason, when terror, sabotage, provocations, lies, and violence against the Chechen people are committed by great-power Russia, it is called something unknown — a fight against mythical bandits. If these actions are transferred to the territory of Russia, Russian propaganda immediately starts — here is Chechen terror, terrorists, Dudayev's terror. I have stated and I state once again that transferring military actions to the territory of Russia is not only not terror, but is already a natural law, and even independent of me, whether I want it or not. Three hundred thousand men from 17 to 50 years of age, left without means of existence, without work and generally without the right to life, who for several years now have been acquiring exclusively one military profession. I no longer have any strength to hold them in this small patch of land. This war has and will have far-reaching consequences and continuations, and the behavior of Russia, the Russian leadership, which is now fed by old mercantile interests and habits of ruling, as if now we will drive the Chechens out of the cities, then they will go to the mountains, in the mountains we will finish them off with aviation. Our sons know very well how to fight in cities; we have already weaned ourselves from the mountains, but in the cities we know how to fight brilliantly. I say frankly, we need the continuation of the war with Russia. Either we will burn to the ground together with Russia, but Russia will burn together with us, or we will get out of this situation together that Russia has imposed. There is no middle ground between us. The chance for Russia to come to its senses is almost gone. As soon as this situation gets out of my control, then let Russia tremble. I will see how the Russian military defend their cities, which they destroy with such furious force in ours, and populated areas. Fortunately for Russia and the world right now, the situation is still controllable. But I will not be the least bit upset if this process starts to get out of my control, not in the least..»\n- Dzhokhar Dudayev"
