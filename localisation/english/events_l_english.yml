 Georgia.1.t: "Zviad Gamsakhurdia's Speech"
 Georgia.1.d: "„Everything that is happening today in Abkhazia is a provocation towards and against the Georgian nation. This course of actions by Moscow is not new, it is old. It aims to control the national patriotic movement in Georgia. \nIn this way, through such provocations, they want to limit and reduce our national movement and stifle all its bold initiatives at the very beginning. \nThis is the so-called trump card of Abkhazia in the hands of Moscow, in the hands of the Kremlin, which they want to play against us. But they must remember that this trump card cannot be used, because this will be opposed by the united power and effort of the Georgian people! We act according to the principle of the well-known Georgian proverb, wisdom fights stupidity, without guns and cannons!“ \n\n- Zviad Gamsakhurdia, March 15th, 1989."
 Georgia.1.a: "Sakartvelos Gaumarjos!"
 Georgia.2.t: "New Constitution"
 Georgia.2.d: "We, the people of Georgia, affirm our ancient and historic right to self-determination, inspired by our love for our land, culture, language, and independence. With the intent to safeguard our sovereignty and to protect the freedom, dignity, and well-being of all Georgian citizens, we declare this Constitution to establish the fundamental principles of governance and law in the independent Republic of Georgia.\n- Chapter I The State of Georgia\n- Georgia as a Sovereign State \n- The Republic of Georgia is an independent, sovereign state, free from any external control or influence, with full authority over its territory, population, and resources.\n- State Symbols \n- The Georgian state shall have its own national flag, coat of arms, and anthem, symbolizing the unity and historic identity of the Georgian nation.\n- Territorial Integrity \n- The territorial integrity of Georgia is inviolable. The Republic of Georgia shall be a unitary state, and no part of its territory shall be ceded or given autonomy without the consent of the Georgian people through a national referendum.\n- Chapter II The Structure of Government\n- Separation of Powers \n- The government of Georgia shall operate on the basis of a separation of powers among the executive, legislative, and judicial branches, each operating independently to serve the interests of the people.\n- The Presidency\n- The President of Georgia shall be the head of state and government, elected by direct vote of the people for a term of five years.The President shall serve as the commander-in-chief of the armed forces and the chief representative of Georgia in foreign affairs.The President shall have the power to appoint and dismiss the government, subject to parliamentary approval.\n- The Parliament\n- The Parliament of Georgia shall be a unicameral legislative body, elected by the people through free and fair elections. The Parliament shall have the authority to pass laws, approve the budget, and oversee the executive branch.\n- The Judiciary\n- The judiciary of Georgia shall be independent, with courts established to guarantee justice and uphold the rule of law. Judges shall be appointed for life and shall not be removed except by legal procedures established by the Constitution.\n- Chapter III Fundamental Rights and Freedoms\n- Equality Before the Law \n- All citizens of Georgia shall be equal before the law, regardless of ethnicity, religion, language, or social status.\n- Freedom of Speech and Press \n- The freedom of speech, press, and assembly shall be guaranteed. Censorship is prohibited, except in cases that threaten national security, public order, or the integrity of the state.\n- Right to Life and Personal Security \n- Every citizen has the right to life, liberty, and personal security. The death penalty shall be abolished, and torture or inhumane treatment is prohibited.\n- Freedom of Religion \n- The Republic of Georgia shall respect the freedom of religion and belief. The Georgian Orthodox Church shall hold a special place in the nation's cultural and spiritual life, but no religion shall be established as a state religion. \n- Protection of Private Property \n- Private property shall be inviolable. The state may only expropriate property in cases of extreme public necessity, and only with fair compensation.\n- Cultural and Language Rights \n- The Georgian language shall be the official language of the state. Ethnic minorities shall have the right to preserve their language, culture, and traditions, provided they do not threaten the unity and sovereignty of Georgia.\n- Chapter IV National Security and Defense\n- Defense of the State \n- The defense of Georgia's sovereignty and territorial integrity is the sacred duty of every citizen. Military service shall be obligatory for all able-bodied citizens, with provisions for conscientious objectors.\n- National Security Council \n- A National Security Council shall be established to advise the President on matters of defense, security, and public order.\n- Protection Against Separatism \n- Any attempt to undermine the territorial integrity of Georgia through separatism or internal division shall be considered a crime against the state.\n- Chapter V The Economy and Social Welfare\n- Free Market Economy \n- The Republic of Georgia shall adopt a market-oriented economy, ensuring free enterprise and fair competition, while the state reserves the right to intervene to ensure public welfare and national interests.\n- Social Protection \n- The state shall guarantee a minimum standard of living for all citizens, including access to healthcare, education, and social services.\n- National Resources \n- The natural resources of Georgia shall be owned and managed by the state in the interests of the people.\n- Chapter VI Amendments and Referendums\n- Amendments to the Constitution \n- The Constitution of Georgia may be amended only through a two-thirds majority vote of the Parliament, followed by ratification by a national referendum.\n- Referendums \n- Any issue of national importance, including changes to the territorial status of Georgia, may be decided by national referendum.\n- Chapter VII Transitional Provisions\n- Continuity of Laws \n- All laws in force at the time of the adoption of this Constitution, except those that conflict with it, shall remain in force until replaced or repealed by the Parliament.\n- Interim Government \n- Until the first elections are held under this Constitution, the current government shall continue to function in an interim capacity, subject to parliamentary oversight."
 Georgia.2.a: "ok"
 Georgia.3.t: "Reform Schools"
 Georgia.3.d: "During Soviet Occupation, Georgian kids were learning only the Russian language in schools. We must reform schools and teach our kids Deda ena (Georgian book, Deda ena means 'Homeland language' in Georgian) and learn Georgian if we want to keep our language alive."
 Georgia.3.a: "Do it Now"
 Georgia.4.t: "Rebuilding Churches"
 Georgia.4.d: "During communist occupation of Georgia, many churches were unfortunately destroyed, however we WILL rebuild Christianity in our country. We will never forget our faith to our God which we believe in! Glory to Georgia and Jesus Christ!"
 Georgia.4.a: "Glory To Jesus christ!"
 Georgia.5.t: "9 April Tragedy"
 Georgia.5.d: "4 april 1989 \n- Students gathered in streets and started a peaceful protest for Deda Ena \n- The Georgian communist goverment lost control on situation, Jumber patiashvili asked Gorbachev to send troops in to restore control. \n- in 9 april. Tanks and troops arrived at Rustaveli and because of danger, Ilia II (Catholic patriarch) asked the protesters to leave the place but they refused. \n- Before operation the started, Soviet troops disarmed local militia and in 9 April 3:45am Soviet APC's and troops surrounded the protest and general Igor Rodionov has claimed that the Georgian militia attacked the Soviet troops. Because of that He gave an order to the troops to clear the protest in every way possible. \n- Soviet troops started advancing towards protesters with batons and spades and started attacking them causing minor and also serious injuries to people. \n- One of the victims of the attack was a 16 year old girl who tried to get away from the advancing soldiers but was chased down and beaten to death near the steps of the government building, receiving blows to the head and chest. She was dragged out from area by her mother who was also attacked and wounded. \n- CN and CS gas was used against the protesters; vomiting, respiratory problems and sudden paralyses of the nervous system was reported. \n- The unarmed police officers attempted to evacuate the panicked protesters however a video taken secretly by opposition journalists showed that soldiers did not allow doctors and emergency workers to help the injured people even ambulances were attacked by advancing soldiers. \n- sadly this event took 21 students lives 19 girls and 2 boys. "
 Georgia.5.a: "..."
 Georgia.6.t: "Ossetians"
 Georgia.6.d: "The Ossetian seperatists in North Shida Kartli are raiding the surrounding area on a daily basis, they are using these raids as propaganda to further their aims. We must secure our rightful land and quell the seperatist movement."
 Georgia.6.a: "Ok"
 Georgia.7.t: "Abkhazians"
 Georgia.7.d: "Abkhazians had autonomy in the USSR as the Abkhaz Autonomous Soviet Socialist Republic, but this does not mean that we should let them have autonomy again. We must stop the separatists and the Russians from taking away our rightful territory!"
 Georgia.7.a: "Ok"
 Georgia.8.t: "What's Going on in Georgia?"
 Georgia.8.d: "On the bright side, Georgia is getting closer day by day to independence, however, on the dark side Georgia has many internal problems such as a  weak economy and ethnic conflict. \n- Ossetians in Shida kartli (In South Ossetia Soviet autonomous Region) Started Protests against Gamsakhurdias actions as they demand to South Ossetia remain in the Soviet Union. \n- While in the economy, rural areas can't produce enough food because of a lack of equipment, shops are empty, people are starving to death and the government can't do anything except watch people like wounded rats."
 Georgia.8.a: "..."
 Georgia.9.t: "Clashes in South Ossetia"
 Georgia.9.d: "in january 5th 1991, Ossetian Militias launched attack on Georgian National Guards. \n- under heavy fire Ossetians rised up Barricades in towns. \n- National Guard officers has sent demands to retreat from South Ossetia for now... what should we do?"
 Georgia.9.a: "Resupply National Guards and order them to hold the ground."
 Georgia.9.b: "Retreat... For now."
 Georgia.10.t: "Independence Referendum"
 Georgia.10.d: "after years of Red occupation Today Georgia got Independence with Gamsakhurdia becoming President of Independent Georgia, today Georgia Gained full independence and become Another Country who break away from the Soviet Union with Soviets couldn't do anything but watch as their Union falling slowly one by one. \n- with Georgias independence, Independence movements in Caucasus Get motivated and Speed up their effort to get Independent once for all from the USSR."
 Georgia.10.a: "Come! Sign the Independence Paper! It's our day!"
 Georgia.10.b: "We Remain..."
 Georgia.11.t: "The Future of Independent Georgia"
 Georgia.11.d: "Following the declaration of independence, the republic faces the task of building its own state institutions. The new government must determine the country’s course."
 Georgia.11.a: "Let us get to work."
 Georgia.11.b: ""
 Georgia.12.t: "The Power struggle"
 Georgia.12.d: "The power Struggle in Georgia has been started... Power Struggle between Zviad Gamsakhurdia (President), Tengiz Kitovani (Minister of Defense and Commander of National Guard) and Jaba Ioseliani (Warlord and Leader of Paramilitary Group Mkhedrioni)"
 Georgia.12.a: "We will win..."
 Georgia.13.t: "Adjara Question"
 Georgia.13.a: "Don't mind about them"
 Georgia.13.b: "Send them the ultimatum"
 Georgia.14.t: "Where is Gamsakhurdia?"
 Georgia.14.a: "Find him!"
 Georgia.14.b: "ignore it"
 Georgia.15.t: "New President For Georgia!"
 Georgia.15.d: "After Military Council Contacted Shevardnadze, he left Russia and came to Tbilisi, after that he was inaugurated as the State Council and Junta was dissolved."
 Georgia.15.a: "Gamarjoba Shevardnadze!"
 Georgia.16.t: "Aftermath of Coup"
 Georgia.16.d: "The aftermath of the 1992 Georgian coup d'état plunged the newly independent republic into a period of profound instability, internal conflict, and national disillusionment. Following the violent overthrow of President Zviad Gamsakhurdia in January 1992 by the Military Council, composed of opposition militias and ex-Soviet officials, Georgia descended into lawlessness. Tbilisi became a city scarred by gunfights, power vacuums, and shattered authority. \n The Gamsakhurdia loyalists, known as Zviadists, waged an insurgency in western Georgia, particularly in Samegrelo, further destabilizing the region. Meanwhile, the national economy ground to a halt, infrastructure decayed, and law enforcement disintegrated into bribery and banditry. The promise of independence quickly curdled into a brutal reality of factionalism, ethnic violence, and failed governance. \n\n The 1992 coup's long shadow would haunt Georgia for the rest of the decade..."
 Georgia.16.a: "What if we choiced peace?"
 Georgia.17.t: "Jaba ioseliani is arrested"
 Georgia.17.d: "Today warlord and Leader of Paramilitary mkhedrion, Jaba ioseliani got arrested and he is been sent to former KGB HQ."
 Georgia.17.a: "Good, at least he is silence now"
 Georgia.18.t: "Kitovani forces Takes Tbilisi Hotel?"
 Georgia.18.d: "As soon as Kitovani arrives in Tbilisi, battle plans are put into place. While the National Guard and government leaders fortify themselves within the Parliament building, Tengiz Sigua takes over the Tbilisi Hotel on Rustaveli Avenue, less than 250 meters away from Parliament, designating the building as the opposition's military headquarters. On 21 December, Otar Litanishvili, a commander of the Mkhedrioni, brings a detailed map of the capital within the HQ and military leaders plan the coming attacks. Tengiz Kitovani takes command of the upcoming assault on Parliament, being the most knowledgeable of the building's infrastructure, from his time as head of the National Guard."
 Georgia.18.a: "What..."
 Georgia.19.t: "Clashes near roki tunnel"
 Georgia.19.d: "Georgian troops attempted to block Roki tunnel to avoid further aid from the USSR to Ossetian militia but Ossetians Militia quickly open fire forcing our Soldiers to retreat from their positions."
 Georgia.19.a: "damned..."
 Georgia.20.t: "Anarchy continues in Georgia"
 Georgia.20.d: "even tho the civil war ended and now we are in peace, the effects of the civil war still affects our country, Robbing, overuse of Drugs and killing of at least 1 person has become a Norm and our economy is still collapsed. \n if we not do anything right now, we might collapse compleitly."
 Georgia.20.a: "damn... what about police?"
 Georgia.21.t: "The Police Situation"
 Georgia.21.d: "The aftermath of the Georgian Civil War has left the nation's police forces fractured, demoralized, and plagued with corruption. Once envisioned as guardians of public order, the Georgian police have instead become synonymous with extortion, violence, and political repression. \n In the early 1990s, amid the collapse of the Soviet Union, Georgia's law enforcement institutions disintegrated along with the state. Armed militias, political factions, and even organized crime filled the power vacuum. Many former officers either fled their posts or aligned themselves with paramilitary groups, often exploiting their positions for personal or political gain. \n By 1993, what remained of the Ministry of Internal Affairs was a shell of its Soviet-era structure. Officers were poorly trained, underpaid, and often resorted to bribes to survive. In regions like Samegrelo and Adjara, local warlords and governors exert more control over the police than the central government. \n Rebuilding the police is no small task. Trust must be re-established, Soviet-era tactics must be abandoned, and the deep-rooted influence of criminal networks must be uprooted. Georgia stands at a crossroads reform the police into a professional, accountable force or allow the rot to deepen and risk becoming a failed state."
 Georgia.21.a: "... what about mkhedrioni?"
 Georgia.22.t: "Mkhedrioni Situation"
 Georgia.22.d: "Once hailed by some as patriotic defenders of Georgia, the Mkhedrioni have now become a lawless force unto themselves — a paramilitary group that operates in the shadows, beyond the reach of the state. Formed in the chaos of independence and civil war, the Mkhedrioni originally presented themselves as nationalists loyal to the cause of Georgian unity. But in practice, they've grown into a criminal syndicate wielding more power than many government ministries. \n Led by the notorious Jaba Ioseliani, a warlord, bank robber, and self-proclaimed “knight” the Mkhedrioni played a decisive role in the 1992 ousting of President Zviad Gamsakhurdia. Their alliance with the military council and later Eduard Shevardnadze granted them political legitimacy… and impunity. \n Today, the Mkhedrioni act as kingmakers in Tbilisi, running rackets, intimidating political opponents, and openly clashing with rival factions. They are heavily armed, deeply entrenched, and increasingly defiant of any attempts to rein them in. Their presence in western Georgia is especially dominant often more visible than official security forces. \n The Georgian state faces a dangerous dilemma. To confront the Mkhedrioni risks open conflict and political instability. But tolerating them any longer undermines every effort at democratization, justice, and law. \n The question is no longer whether they are a threat, but whether we still have the strength to stop them."
 Georgia.22.a: "... Refugee situation?"
 Georgia.23.t: "Tetri artsivi Leaves the post in tskhinvali"
 Georgia.23.d: "Around 01:00, Gia Karkarashvili, who leads a militia of around 80 men known as Tetri Artsivi (\"White Eagle\"), leaves his post in Tskhinvali, where he is defending the Georgian neighborhoods of the city during the South Ossetian conflict, and sets up barricades on the main highway leading to Tbilisi from the north, in order to avoid any access to the capital, before leaving his soldiers in the outpost while bringing weapons to the opposition."
 Georgia.23.a: "huh"
 Georgia.24.t: "2 Government officials got kidnapped!"
 Georgia.24.d: "The morning of 22 December, according to the witness testimony of former deputy Sandro Bregadze, Sigua orders his personal guard, led by former Soviet secret service officer Murtaz Shaluahsvili, to position itself in Alexandrov Park (today known as the April 9 Park), in order to target the Parliament. With just the Kashveti Church serving as a buffer between both camps, government authorities send Mayor Tamaz Vashadze of Tbilisi and deputy Avtandil Rtskhiladze on a negotiation mission one last time before the beginning of the hostilities, but the two are kidnapped by Sigua's forces."
 Georgia.24.a: "What?! This can't be true! do they lost their mind?!"
 Georgia.25.t: "First Attack!"
 Georgia.25.d: "Around 07:30, Murtaz Shualashvili orders the first fire against Parliament and Karkarashvili launches four rockets on the Parliament building, inaugurating two weeks of violence. According to a New York Times report, the opposition refuses to accept any responsibility with the first attack. Throughout 22 December, both sides use rockets, grenades, and automatic weapons to fight each other. The Kashveti Church, which houses opposition soldiers, becomes a target of governmental forces. The Gamsakhurdia household, nicknamed \"Colchis Bell\", catches fire, but the family, under governmental protection during the coup, remains safe"
 Georgia.25.a: "Open the fire!"
 Georgia.26.t: "2 Officials betray!"
 Georgia.26.d: "Besik Kutateladze, the deputy minister of Defense, is sent by Zviad Gamsakhurdia to negotiate again with the opposition, but he betrays the President, joins the opposition and makes a televised declaration asking Gamsakhurdia to resign and to let a new Parliament punish all guilty parties behind the violence. Kutateladze then takes a helicopter and is sent by Sigua and Tengiz Kitovani to Zugdidi, in western Georgia, to prevent the formation of pro-Gamsakhurdia forces. Tamaz Ninua, deputy Foreign Affairs Minister, also joins the opposition."
 Georgia.26.a: "Damn them!"
 Georgia.27.t: "Second attack and Fire in the Art Museum of Georgia"
 Georgia.27.d: "The second attack on 23 December results in a temporary victory of the presidential forces, but the Art Museum of Georgia, across the street from the Parliament, catches fire. The Russian press agency TASS writes about the event that several people are stuck inside the museum with no way out, while fire brigades have no access because of the opposition blockade on the street. Gamsakhurdia recalls the remaining parts of his National Guard in Tbilisi in order to attempt a breach through the opposition's barricades outside the city, thus putting an end to any large Georgian military presence in South Ossetia."
 Georgia.27.a: "..."
 Georgia.28.t: "Opposition forces enter in the Parliament"
 Georgia.28.d: "The most severe battle of the coup d'état takes place on 27 December when Tengiz Kitovani's troops penetrate inside the Parliament and put fire to the first floor of the building with gasoline."
 Georgia.28.a: "..."
 Georgia.29.t: "Jaba is free"
 Georgia.29.d: "On 28 December, it becomes clear that government forces have lost all control outside of the presidential bunker and Tengiz Kitovani, followed by a Mkhedrioni detachment, captures the former Soviet office of the KGB in the Gldani neighborhood, where several opposition leaders are imprisoned. Eight prisoners are freed and brought to Rustaveli Avenue to encourage fighters, including Giorgi Chanturia, Giorgi Khaindrava, and the titular head of the Mkhedrioni, Jaba Ioseliani. The latter takes back his control over the militia and Chanturia announces that the civil war must continue until the resignation of Gamsakhurdia. On their way, the Kitovani troops burn down several buildings of strategic importance, including the National Bank of Georgia and the Ministry of Internal Affairs, leading to the destruction of nearly 210,000 documents (or 80% of the entirety) of governmental archives from the Soviet era."
 Georgia.29.a: "..."
 Georgia.30.t: "Deputy of minister of defence betrayed us!"
 Georgia.30.d: "On 31 December, Nodar Giorgadze, deputy Minister of Defense and leader of a militia made up of veterans from the Afghanistan War, publicly asks for Gamsakhurdia's resignation, leading to his arrest."
 Georgia.30.a: "Damn him!"
 Georgia.31.t: "Events outside of Tbilisi"
 Georgia.31.d: "While Tbilisi falls into chaos, the rest of Georgia (except for South Ossetia) remains more or less calm during the first week of the conflict. However, the events affected some rural zones in January 1992. Thus, while Georgian television falls under opposition control on 1 January, all programming is stopped in western Georgia, which had remained loyal to Gamsakhurdia, thanks to the capture of the broadcasting tower of Kutaisi by Zviadists. In the same manner, while a majority of the country stops receiving newspapers following the closure of printers in Tbilisi during the coup, western Georgia keeps its pro-Gamsakhurdia newspapers thanks to the printers of Kutaisi. \n On 4 January, Zviad Gamsakhurdia signs a decree from his bunker requiring all municipal and regional governments outside of Tbilisi to organize a large-scale mobilization of troops against the opposition, an act described by some as a call for guerrilla warfare. This order requires the mobilization to take place until 7 January and mandates the local governments to open mobilization centers to welcome all military conscripts, aged 20 to 45 years old. Local authorities are also under the obligation to organize transport for this theoretical army. However, without a National Guard, this decree cannot be enforced. \n In response, the Military Council announces the abolition of local governments and declares its intent to appoint local governors loyal to the opposition. According to an announcement by the Council, the majority of local government centers fell into the junta's control by 18:30 on 4 January. However, the country still includes some cities loyal to the President; a gun battle takes place at the Rustavi City Hall, 25 kilometers south of the capital, between the local government and Military Council troops, on 5 January. No injury is reported from this battle."
 Georgia.31.a: "at least partial victory"
 Georgia.32.t: "Repressing Demonstrations"
 Georgia.32.d: "While the Military Council issued a new decree forbidding all protestations, an assembly of 3,000 to 4,000 Gamsakhurdia supporters organize a demonstration around 12:00 on 3 January, starting from a railway station several miles from the battlefield. The protesters, including mainly middle-aged men and women, carry the President's portrait, while chanting his name (\"Zviadi!\") and walking toward Rustaveli Avenue. After just 15 minutes, a car transporting masked men of the Mkhedrioni throws smoke bombs on the crowd, which only angers and energizes it, while encouraging applause from civilians on their balconies. But a group of eight to ten masked men wearing sunglasses to hide their identities, form a line in front of the demonstrators and start shooting blanks to disperse the crowd. A few instants later, real bullets are fired at the protesters, who disperse violently while some take refuge behind cars. Two protesters are immediately killed and several are injured, including two more who would die a few days later."
 Georgia.32.a: "Damn them!"
 Georgia.33.t: "President Left the Parliament"
 Georgia.33.d: "On the morning of 6 January, around 05:00,[101] Zviad Gamsakhurdia, his family, and a personal guard of 60 dignitaries and bodyguards leave the Parliament through the road behind the building, the only way out left open by opposition troops in order to control the presidential escape and prevent a dispersion of armed Gamsakhurdia supporters across the capital. The President and his family leave in the presidential car, a Mercedes-Benz, and, followed by an all-terrain vehicle, a minibus, and two Zhigulis, escape a roadblock installed along the Mtkvari river by Giorgi Shengelia, Vakhtang Kikabadze, and Giorgi Khaindrava. Opposition forces penetrate then into the abandoned and ruined Parliament, some supporting columns of which are entirely destroyed, proclaiming victory against the Gamsakhurdia government and freeing the 40 prisoners left in the bunker."
 Georgia.33.a: "its over... its over..."
 Georgia.34.t: "Georgia Joined the UN"
 Georgia.34.d: "Georgia is recognized as independent country across the world!"
 Georgia.34.a: "cool"
 Georgia.35.t: "Kitovani Refuses to step down"
 Georgia.35.d: "Kitovani Refused to step down from his position after Zviad's Announcement to Kitovani to step down because of disloyality. \n this also Resulted National Guard to split in 2 Factions, Pro-Zviad and Anti-Zviad Factions."
 Georgia.35.a: "He wants to see we lose freedom again!?"
 Georgia.36.t: "Abkhazia Declared independence!"
 Georgia.36.d: "Today Abkhazian Parliament Declared Independence and Restored 1925 Constitution which is seen as Illegal according to Georgian Officials, they call Abkhazian Parliament to Disarm its Militia and get back to Georgia."
 Georgia.36.a: "What!?"
 Georgia.37.t: "Karkarasvhili's Speech"
 Georgia.37.d: "Today Karakarashvili (The General of the Georgian Armed forces) did Radical speech calling Georgians to rise up Guns and Join the GAF. \n part from his speech: 'If 100,000 Georgians die, then all 97,000 [Abkhazians] on your side will be killed' \n the speech was also broadcasted in Abkhazia TV Channel which also led to Abkhazians outrage as they claimed that Speech was calling Genocide towards Abkhazians."
 Georgia.37.a: "Idiot!... at least we got more men"
 Georgia.38.t: "War Declaration"
 Georgia.38.a: "And we march in..."
 Georgia.38.b: "For Abkazia!"
 Georgia.39.t: "Ossetians Uprised"
 Georgia.39.d: "Today at 7am 5th January, Ossetian militia opened fire at National Guards and build barricades in Tskhinvali, this is first armed uprising in Georgia after 1920."
 Georgia.39.a: "what!?"
 Georgia.40.t: "Attack The Ossetian militia"
 Georgia.40.a: "Here comes..."
 Georgia.40.b: "For Ossetians independence!"
 Georgia.41.t: "Zviadists Activty Increased"
 Georgia.41.a: "What!? They gone crazy?!"
 Georgia.42.t: "Zviad Launched Uprising!"
 Georgia.42.d: "today at morning Zviadist Forces Launched Uprising Against Georgian Government in Western Georgia. \n Zviadists Quickly took city Zugdidi and Near by Villages cutting off Railway Towards Abkhazia which means Georgian soldiers in Abkhazia now have hard time to get Supply. \n\n Georgian Government has two Choices. \n\n\n 1. Retreat From Abkhazia and fight back Zviadists. \n or 2. immediately strike Zviadists while leaving Forces in Abkhazia."
 Georgia.42.a: "You said he wouldn't came back but here we are you stupid moneky..."
 Georgia.43.t: "Adjara has become Semi-independent!"
 Georgia.43.a: "We can get back to this issue later..."
 Georgia.44.t: "Wanna play as exiled Zviad Gamsakhurdia?"
 Georgia.44.d: "After losing power, Zviad Gamsakhurdia and his supporters continue their struggle. We can remain with the current government or take charge of its opponents."
 Georgia.44.a: "Yes"
 Georgia.44.b: "No"
 Georgia.45.t: "Abashidze refused the demands!"
 Georgia.45.d: "Abashidze refused to disarm his militia and integrate adjara back into Georgia while also insulting our president's Parents! He already destroyed only bridge that connects Georgia and Adjara to each other while declaring martial law in adjara!"
 Georgia.45.a: "okay back down..."
 Georgia.45.b: "So he choiced war!"
 Georgia.46.t: "Abashidze Accepted our demands!"
 Georgia.46.d: "Abashidze accepted our demands and disarmed his militia and integrate Adjara into Georgia!"
 Georgia.46.a: "Good boy"
 Georgia.47.t: "Protest in Tbilisi!"
 Georgia.47.d: "Opposition started protest in Tbilisi, accussing Zviad for being dictator. \n\n in response Zviadists started their own rallies in Rustaveli Avenu, tho this didn't always go according to plan as Zviadists and Opposition supporters often clashed with each other, causing distabilization and barricades being build in streets of Tbilisi."
 Georgia.47.a: "Dictator? Seriously??? I FREED MY HOMELAND AND I'M NOW A DICTATOR?!"
 Georgia.48.t: "Kitovani National Guard declares support to Opposition"
 Georgia.48.d: "Kitovani NG declares support to opposition and daily protests continues in tbilisi."
 Georgia.48.a: "This isn't going good..."
 Georgia.49.t: "Clashes in Tbilisi!"
 Georgia.49.d: "At morning armed clashes happened in tbilisi between zviadists and kitovani NG, police quickly intervene in and with this Kitovani NG got kicked out from Tbilisi, tho this resulted few deaths and further distabilization."
 Georgia.49.a: "..."
 Georgia.50.t: "The Army Has Been Reorganized!"
 Georgia.50.d: "The reorganization of the armed forces is complete. Command will now operate under the army’s revised structure and division of responsibilities."
 Georgia.50.a: "Good!"
 Georgia.53.t: "Gamsakhurdia's propaganda"
 Georgia.53.d: "Former President Zviad Gamsakhurdia, currently in exile, has launched a new wave of propaganda against Eduard Shevardnadze. In his radio broadcasts and leaflets, he accuses the current leader of \"selling out to Moscow\" and leading Georgia under Russian influence. Gamsakhurdia claims Shevardnadze is a Russophile who \"under the guise of stability is surrendering the country's independence.\""
 Georgia.53.a: "Damn"

 adjara.1.t: "Shevardnadze Sends demands"
 adjara.1.d: "Shevardnadze wants us to disarm our militia and integrate in Georgia peacefully."
 adjara.1.a: "Fuck his mother!"
