 news.2.t: "State of emergency has been declared in Georgia"
 news.2.d: "Zviad Gamsakhurdia proclaims a state of emergency. Government then begins a new round of attacks on the press, notably when Russian journalist Albert Kochetkov has his apartment robbed by 15 armed soldiers. Tengiz Kitovani, meanwhile, promises to support the political opposition to Gamsakhurdia and sends a support message to the members of the NDP through journalist Zurab Kodalashvili, who has his equipment confiscated by authorities."
 news.2.a: "Ok"
 news.2.b: "Man i can't protest anymore :("
 news.3.t: "Opposition won The Coup in Georgia"
 news.3.d: "After weeks of bloody fights in Tbilisi streets, Georgian opposition and paramilitaries manage to capture the Parliament and declare the Victory while Zviad Gamsakhurdia flees into Chechnya with his private car."
 news.3.a: "Ok"
 news.3.b: "Dzirs Zviadi!"
 news.4.t: "Armenia is Independent"
 news.4.d: "Today Armenia Declared Independence from the Red Occupation After Independence Referendum in 21st Seqtember. \n this makes Soviet Influence over Caucasus to Sink more as Armenia is Second Country who gained Independence. \n Zviad Gamsakhurdia congratulates Armenian People and Levon Ter-Petrosyan. \n Now it is up to Azerbaijan, will they compleitly Remove Soviet Influence from South Caucasus... or will they leth it stay?"
 news.4.a: "Ok"
 news.4.b: "Park' mer angakh Hayastanin!"
 news.4.g: "Good job Armenians!"
 news.5.t: "Mod Supports Current Pro-Western Protest in Georgia!"
 news.5.d: "\n since 2024 Parliamentary Election got Rigged Protest started in Georgia, first it was small but in November 28th Government (Georgian Dream party (GD)) Suspended Talks with EU until 2028 which Caused Massive Radical Protest which calm downed in few weeks, tho Protest continues till this day and GD is Becoming More Authoritarian and Pro-Russian as they arrested students just for facebook post where Students called GD Pro-Russian and GD Arrested 4 Opposition Leaders in just 2 days."
 news.5.b: "Fire to Oligarchy!"
 news.6.t: "Azerbaijan Gained Independence"
 news.6.d: "Today Azerbaijan Declared Independence from the Red Occupation in 18th October. \n this makes Soviet Influence over South Caucasus to end as Azerbaijan was last Communist south Caucasus. \n Now what will happen in Caucasus...?"
 news.6.a: "Ok"
 news.6.b: "Musteqil Azerbaycana şan olsun!"
 news.6.g: "Its so over... blyad!"
 news.7.t: "Abkhazia Declared independence!"
 news.7.d: "Today Abkhazian Soviet Parliament restored 1925 Constitution which means that Abkhazia declared independence from Georgia. \n Georgian Authorities see this as illegal but Abkhazian authorities see it as legal, tho nobody recognizes abkhazia as independent country yet."
 news.7.a: "Ok"
 news.7.b: "This is illegal!"
 news.7.g: "Hm?"
