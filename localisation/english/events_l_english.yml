 news.1.t: "Georgia is independent"
 news.1.d: "After the independence referendum in 31st of march, Zviad Gamsakhurdia declared that the will of those who died at 9 April tragedy and the will of the Georgians has come true and Georgia had gained independence \n- Zviad Gamsakhurdia speech \n- 'it is symbolic that the independence of Georgia was announced on the 9th of April because the fate of Georgia was decided on that very day. The spirits of the martyrs look down from the Heavens onto us since their will and that of Georgian people has come true. LONG LIVE THE INDEPENDENCE OF GEORGIA! GOD SAVE US!'"
 news.1.a: "Ok"
 news.1.b: "Gaumarjos damoukidebel sakartvelos!"
