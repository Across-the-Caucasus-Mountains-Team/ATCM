 news.8.t: "Ingushetia Seperated from Chechnya"
 news.8.d: "today Ingushetia Leaders who slowly begin separation proccess in 1991, ended it in 4th June 1992, almost 1 Year after proccess begun, tho it was blodless and peaceful and Chechnya doesn't plans to invade Ingushetia, while Ingushetia Joined Russian Federation."
 news.8.a: "Ok"
 news.8.b: "why..."
 news.8.g: "Good Choice Droog, Good Choice!"
 news.9.t: "Georgia-Abkhazia War"
 news.9.d: "today at Morning Georgian Tanks and Helicopters Crossed Abkhazian-Georgian Border and started the invasion of Abkhazia. Russia sees this as Illegal Invasion while Shevardnadze says that they invading Abkhazia in order to restore the Order and re-established Controll over Abkhazia."
 news.9.a: "Civil war is keep boiling..."
 news.10.t: "Chechnya Declared Independence"
 news.10.d: "Following the collapse of the Soviet Union and the wave of nationalist movements across its former republics and regions, Chechnya, under the leadership of Dzhokhar Dudayev and the All-National Congress of the Chechen People, unilaterally declared independence from the Russian Federation. The move was rooted in a long-standing desire for national self-determination, fueled by historical grievances, repressive Soviet policies, and Chechnya's distinct ethnic and religious identity."
 news.10.a: "huh?"
 news.10.b: "Dozal Chechena Azatkhana!"
 news.10.g: "..."
 news.11.t: "War in South Ossetia"
 news.11.d: "After The Ossetians Uprised in South Ossetia, the GAF Responded them with offensive, launching offensive Towards Java and Tskhinvali. \n The Tskhinvali says that all Ossetians are ready to defend their homeland till last man while Tbilisi says that they are ready to restore the order in Samachablo."
 news.11.a: "here comes..."
 news.12.t: "Collapse of the Soviet union"
 news.12.d: "By December 1991, the once-mighty USSR, comprising 15 republics and spanning eleven time zones, ceased to exist. The Belavezha Accords declared the Soviet Union dissolved, and the Commonwealth of Independent States (CIS) emerged in its place. Boris Yeltsin, now President of the Russian Federation, inherited a shattered economy, a demoralized military, and the daunting task of steering a new, post-Soviet future. \n\n The red banner was lowered from the Kremlin on December 25, 1991"
 news.12.a: "Better be dead than Red!"
 news.12.b: "My empire..."
 news.13.t: "August Coup"
 news.13.d: "Tanks rolled into Moscow, state media was censored, and martial law loomed. But instead of rallying the nation, the coup backfired spectacularly. Boris Yeltsin, President of the Russian SFSR, emerged as the face of resistance, famously climbing atop a tank outside the Russian White House to denounce the coup and rally the public. Mass protests erupted, with civilians building barricades and confronting armored units. Much of the military refused to follow the coup plotters' orders. \n\n After three tense days, the coup collapsed on August 22."
 news.13.a: "That was close call"
 news.14.t: "Georgian Armed forces retreated from South Ossetia"
 news.14.d: "after fierce fighting and resistance in South Ossetia, the National Guard retreated from South Ossetia after suffering heavy losses, the Ossetians Got Tskhinvali and Java while also grabbing lands inside Georgia, few Kilometers away from new borders."
 news.14.a: "how they didn't manage to Crush the resistance?"
 news.15.t: "GAF Entered in South ossetia again"
 news.15.d: "Following their chaotic retreat in the spring of 1991, Georgian armed forces re-entered in South Ossetia in the summer of that same year, reigniting the already smoldering conflict with renewed intensity. After initial setbacks and mounting domestic instability, the Georgian leadership determined to reassert control over the separatist region launched a new offensive aimed at crushing the South Ossetian independence movement and dismantling its armed militias."
 news.15.a: "Oh?"
 news.16.t: "Georgian Junta made peace with South Ossetia"
 news.16.d: "After months of brutal fighting, territorial stalemate, and mounting internal pressure, the Georgian Military Council, commonly referred to as the Junta opted to make peace with South Ossetian authorities in mid-1992. Having come to power after the violent ousting of President Zviad Gamsakhurdia."
 news.16.a: "Good for them i guess."
 news.17.t: "Zviadists Uprising in Western Georgia"
 news.17.d: "today at morning Zviadist Forces Launched Uprising Against Georgian Government in Western Georgia. \n Zviadists Quickly took city Zugdidi and Near by Villages cutting off Railway Towards Abkhazia which means Georgian soldiers in Abkhazia now have hard time to get Supply. \n\n Georgian Government has two Choices. \n\n\n 1. Retreat From Abkhazia and fight back Zviadists. \n or 2. immediately strike Zviadists while leaving Forces in Abkhazia."
 news.17.a: "Zviad is coming back?"
 news.18.t: "First Chechen war"
 news.18.d: "Tensions that have long simmered in the North Caucasus have erupted into full-scale war. Following Chechnya's unilateral declaration of independence, Russian federal forces have launched a massive military operation aimed at restoring constitutional order."
 news.18.a: "welcome to hell..."
 news.19.t: "Black october"
 news.19.d: "The fragile foundations of Russia's post-Soviet democracy have crumbled into chaos. A dramatic constitutional standoff between President Boris Yeltsin and the Russian Parliament has escalated into open conflict on the streets of Moscow. After months of political paralysis and rising tensions, Yeltsin dissolved the Supreme Soviet, a move denounced as unconstitutional by his opponents, who in turn declared his presidency illegitimate and barricaded themselves inside the White House (Russian parliament building). \n On October 3rd and 4th, the standoff exploded into violence. Armed supporters of the parliament clashed with loyalist security forces, storming the Mayor's Office and attempting to seize the national television center. In response, Yeltsin ordered a military assault. Tanks opened fire on the White House, shelling the heart of Russian democracy as the world watched in shock. \n By evening, the rebellion was crushed. Dozens lay dead, hundreds were wounded, and the era of hopeful post-Soviet reform was stained with blood. Yeltsin emerged victorious—but at a terrible cost. Russia's new constitution would centralize vast power in the presidency, and the events of Black October would cast a long shadow over the country's democratic future."
 news.19.a: "Russia is still in crisis"
 news.20.t: "Dzhokhar Dudayev is dead!"
 news.20.d: "President Dzhokhar Dudayev has been killed in a targeted missile strike carried out by the Russian Air Force. Dudayev was reportedly giving a satellite phone interview near the village of Gekhi-Chu when his signal was triangulated and two precision-guided missiles were launched. As the founding leader of the Chechen Republic of Ichkeria, Dudayev was both a symbol of independence and a key figure in resisting Russian control. His death leaves a dangerous power vacuum in Grozny, with various factions scrambling for control — from Islamist radicals to nationalist moderates."
 news.20.a: "We finally got rid of him!"
 news.20.b: "Fucking Russia"
 news.20.c: "Bad news for Chechnya"
 news.22.t: "Chechen revolution"
 news.22.d: "Dramatic events unfold in Grozny, armed supporters of the opposition storm the Supreme Soviet of the Chechen-Ingush Republic. The old Soviet government collapses, and a new body — the Provisional Committee of National Salvation — declares itself in control. TV and radio stations have been seized, and crowds fill the streets demanding full independence from Moscow. The uprising is led by retired General Dzhokhar Dudayev, who calls for the immediate separation of Chechnya from both the Russian SFSR and the crumbling USSR."
 news.22.a: "Interesting"
 news.25.t: "The Russian Soviet Federative Socialist Republic (RSFSR) declares martial law in Chechnya"
 news.25.d: "In a historic step toward reducing the global nuclear threat, the Russian Federation signed the Strategic Arms Reduction Treaty II (START II) with the United States. The treaty, which aims to sharply limit the number of deployed nuclear warheads and their delivery systems, marks a milestone in post-Cold War disarmament efforts. Supporters see the agreement as a guarantee of international stability and a foundation for future cooperation, while critics express concerns about a possible weakening of Russia's strategic deterrence. The signing reflects Moscow's desire to reshape its role on the world stage, emphasizing diplomacy over confrontation."
 news.25.a: "Understood"
 news.26.t: "Tu-154 Hijacking"
 news.26.d: "Against the backdrop of the collapse of the USSR and rising tensions in the Caucasus, Shamil Basayev, a little-known Chechen activist, and a group of armed militants hijacked an Aeroflot Tu-154 passenger jet. The plane was en route from Mineralnye Vody to Moscow, but the terrorists demanded that it be rerouted to Turkey. Basayev and his accomplices claimed they were acting out of \"patriotic motives,\" protesting the actions of the Soviet authorities in Chechnya and calling for the recognition of Ichkeria's independence. After landing at Ankara Airport, Turkish authorities allowed the terrorists to hold a press conference."
 news.26.a: "Horror"
 news.27.t: "The RSFSR lifts martial law"
 news.27.d: "Following the failure of an attempt to send troops into Grozny and growing resistance from Dzhokhar Dudayev's supporters, on November 11, 1991, the Supreme Soviet of Russia lifted martial law in the Chechen-Ingush Republic."
 news.27.a: "Understood"
 news.28.t: "Grozny Taken"
 news.28.d: "After weeks of fierce street fighting, Russian troops have established complete control over the capital of Chechnya, Grozny. Battles were fought for every block, entrance, and basement. The enemy used ambushes, mortars, and anti-tank weapons, inflicting heavy losses on the advancing units. The city was virtually destroyed by artillery and air strikes. Civilian infrastructure was destroyed, and the population either fled Grozny or found itself in a humanitarian disaster zone. Despite the announcement of the city's capture, individual Chechen units continue to resist on the outskirts and suburbs. The capture of Grozny was a significant strategic and symbolic success for Russian troops, but the price of victory was extremely high. The conflict is far from over; the war is entering a guerrilla phase."
 news.28.a: "Clear"
 news.29.t: "The Death of Zviad Gamsakhurdia"
 news.29.d: "At the end of December 1993, news arrived that shocked the Transcaucasus. Zviad Gamsakhurdia, the first president of independent Georgia and leader of the armed resistance against the current government, died under circumstances that remain unclear. His death occurred against the backdrop of a protracted civil war, political schism, and the collapse of state institutions. The circumstances of his death remain a subject of debate. According to one version, Gamsakhurdia committed suicide, finding himself in a desperate situation. According to another, he was killed during persecution or as a result of an internal conflict. The lack of reliable information only heightens tensions and gives rise to new myths surrounding him."
 news.29.a: "Horror!"
 news.30.t: "Terrorist Attack in Budyonnovsk"
 news.30.d: "As a result of the terrorist attack in Budyonnovsk, which killed 129 people, including children, and wounded more than 50, Russian authorities have launched an intensified counterterrorism operation. In response to the attack, the Russian government has taken a number of decisions to enhance security and tighten anti-terrorist legislation."
 news.30.a: "Chechnya must be wiped off the face of the earth!"
 news.30.b: "Necessary Measure"
 news.30.c: "Horror!"
 
 soviet_union.1.t: "69 Years of the Union"
 soviet_union.1.d: "After the succsesuful revolution in 1917-21, Soviet union resisted Germans, defeated resistance in the Caucasus and East Europe and remaind stable until the Reformer Mikheil Gorbachev come in office, with him starting democratic reforms he allowed first Multy-party elections which was his first mistake because with this resistances in most republics woke up and started National-liberation which led to this... now its all about Gorbachev, will he accept Hardliners and Reformists protests or is he gonna stay like this...? "
 soviet_union.1.a: "Not good, not good"
 soviet_union.2.t: "Clashes in Baltics"
 soviet_union.2.d: "This year in baltics didn't started with happy celebration of new year, it started with bloodshed \n- Lithuania \n in Lithuania at 11-13 Jan, Hardline communists ordered Tanks, KGB Soldiers and VDV Soldiers to suppress rallies in Lithuania which caused 15 civilians death and 702 wounded civilians while Soviets accidently killed 1 KGB soldier but Hardliners didn't stoped here and ordered soldiers to storm in Lithuania TV tower station. \n- Latvia \n in Riga 13-27 Jan, Soviet forces were ordered by hardliners to suppress Protesters again but this time Protesters build barricades and resisted Soviet forces. this event only caused 6 deaths and and 15 woundeds while Soviets in friendly fire killed 1 OMON Soldier."
 soviet_union.2.a: "Who gave those orders?!"
 soviet_union.3.t: "Referendum ended : Majority Choice Yes"
 soviet_union.3.d: "after referendum ended and votes counted, Majority of people choice to Save the Soviet Union. thought Republics Such as Ukraine, Georgia and Armenia Majority Choiced No which shows that we are really in a big trouble."
 soviet_union.3.a: "Nice!"
 soviet_union.4.t: "Tanks in moscow"
 soviet_union.4.d: "In the early hours of August 19, armored columns rolled into the streets of Moscow, signaling a dramatic and desperate attempt by hardline members of the State Committee on the State of Emergency (GKChP) to seize control of the Soviet government. The capital is gripped by fear and uncertainty as soldiers occupy key buildings and barricades are erected by civilians determined to resist the coup. The nation stands on the brink of chaos"
 soviet_union.4.a: "oh..."
 soviet_union.5.t: "The end of the USSR"
 soviet_union.5.d: "'this is last message from the Communist Party of the Soviet union. The Union is ended.'"
 soviet_union.5.a: "Good bye The Union..."
 soviet_union.6.t: "Disobeience"
 soviet_union.6.d: "The commanding officer, Viktor Karpukhin, later alleged that he had received an order from Kryuchkov to arrest Yeltsin but disobeyed it, although his account has been questioned. The failure to arrest Yeltsin proved fatal to the plotters' plans. After the announcement of the coup at 6:30 am, Yeltsin began inviting prominent Russian officials to his dacha, including Leningrad Mayor Anatoly Sobchak, Moscow Deputy Mayor Yury Luzhkov, Colonel-General Konstantin Kobets, RSFSR Prime Minister Ivan Silayev, RSFSR Vice President Alexander Rutskoy, and RSFSR Supreme Soviet Chairman Ruslan Khasbulatov."
 soviet_union.6.a: "why he is not following the damn order!?"
 1_SOV_tt: "§RThe Coup starts..."
 soviet_union.7.t: "Gorbachev was Put in House arrest!"
 soviet_union.7.d: "Today The President Mikhail Gorbachev was put in House Arrest in Crimea by KGB Forces who stormed his House and confronted him to declare State of emergency which he refused so He was put into House arrest and KGB Forces who surrounded his House cut off all communications for him for outside world."
 soviet_union.7.a: "WHAT?! THIS CAN'T BE TRUE"
 soviet_union.8.t: "Rallies and Calls for General strike!"
 soviet_union.8.d: "Yeltsin initially wanted to remain at the dacha and organize a rival government, but Kobets advised his group to travel to the White House, Russia's parliament building, to maintain communications with coup opponents. They arrived and occupied the building at 9:00 am. Together with Silayev and Khasbulatov, Yeltsin issued a declaration \"To the Citizens of Russia\" that condemned the GKChP's actions as a reactionary anti-constitutional coup. The military was urged not to take part in the coup, and local authorities were asked to follow laws from the RSFSR President rather than the GKChP. Although he initially avoided the measure to avoid sparking a civil war, Yeltsin also subsequently took command of all Soviet military and security forces in the RSFSR. The joint declaration called for a general strike, with the demand to let Gorbachev address the people. This declaration was distributed around Moscow in the form of flyers, and disseminated nationwide through medium-wave radio and Usenet newsgroups via the RELCOM computer network. Izvestia newspaper workers threatened to go on strike unless Yeltsin's proclamation was printed in the paper."
 soviet_union.8.a: "Damn yeltsin!"
 soviet_union.9.t: "polls"
 soviet_union.9.d: "The Soviet public was divided on the coup. A poll in the RSFSR by Mnenie on the morning of 19 August showed that 23.6 percent of Russians believed the GKChP could improve living standards, while 41.9 percent had no opinion. However, separate polls by Interfax showed that many Russians, including 71 percent of Leningrad residents, feared the return of mass repression. The GKChP enjoyed strong support in the Russian-majority regions of Estonia and Transnistria, while Yeltsin enjoyed strong support in Sverdlovsk and Nizhny Novgorod."
 soviet_union.9.a: "Well..."
 soviet_union.10.t: "Demonstrators around the white house"
 soviet_union.10.d: "Afternoon, Moscow citizens began gathering around the White House, erecting barricades around it. In response, Yanayev declared a state of emergency in Moscow at 4:00 pm."
 soviet_union.10.a: "They choice liberalism!?"
 soviet_union.11.t: "Massive defection in the army"
 soviet_union.11.d: "The Soviet forces carrying out the coup began to suffer from mass defections to the RSFSR as well as soldiers refusing to obey orders to shoot civilians. Yeltsin asked his followers not to harass the soldiers and offered amnesty for any military servicemen who defected to oppose the coup."
 soviet_union.11.a: "Stop for the sake of the USSR!"
 soviet_union.12.t: "Tensions is rising"
 soviet_union.12.d: "At noon, Moscow military district commander General Nikolai Kalinin, whom Yanayev appointed military commandant of Moscow, declared a curfew in Moscow from 11:00 pm to 5:00 am, effective 20 August. This was understood as a sign that an attack on the White House was imminent. \n The defenders of the White House prepared themselves, most being unarmed. Evdokimov's tanks were moved from the White House in the evening. The makeshift White House defense headquarters was headed by General Konstantin Kobets, a Russian SFSR people's deputy. Outside, Eduard Shevardnadze, Mstislav Rostropovich, and Yelena Bonner delivered speeches in support of Yeltsin. \n In the afternoon, Kryuchkov, Yazov and Pugo finally decided to attack the White House. This decision was supported by other GKChP members (with the exception of Pavlov, who had been sent to his dacha due to drunkenness). Kryuchkov's and Yazov's deputies, KGB general Gennady Ageyev and Army general Vladislav Achalov, planned the assault, codenamed \"Operation Grom\" (Thunder), which would gather elements of the Alpha Group and Vympel elite special forces units, supported by paratroopers, Moscow OMON, Internal Troops of the ODON, three tank companies and a helicopter squadron. Alpha Group commander General Viktor Karpukhin and other senior unit officers, together with Airborne deputy commander Gen. Alexander Lebed mingled with the crowds near the White House and assessed the possibility of such an operation. Afterwards, Karpukhin and Vympel commander Colonel Boris Beskov tried to convince Ageyev that the operation would result in bloodshed and should be cancelled. Lebed, with the consent of his superior Pavel Grachev , returned to the White House and secretly informed the defense headquarters that the attack would begin at 2:00 am the following morning."
 soviet_union.12.a: "At 2Am... don't forget it Commrad"
 soviet_union.13.t: "fire near the White house!"
 soviet_union.13.d: "At about 1:00 am, not far from the White House, trolleybuses and street cleaning machines were used to barricade a tunnel against arriving Taman Guards infantry fighting vehicles (IFVs), commanded by Captain Sergey Surovikin. Three men were killed in the ensuing clash: Dmitry Komar, Vladimir Usov, and Ilya Krichevsky; several others were wounded. Komar, a 22-year-old Soviet-Afghan War veteran, was shot and crushed trying to cover a moving IFV's observation slit. Usov, a 37-year-old economist, was killed by a stray bullet while coming to Komar's aid. The crowd set fire to an IFV and Krichevsky, a 28-year-old architect, was shot dead as the troops pulled back. The three men were posthumously awarded the title Hero of the Soviet Union. According to journalist and democracy campaigner Sergey Parkhomenko, who was in the crowd defending the White House, 'those deaths played a crucial role, both sides were so horrified that it brought a halt to everything.' Alpha Group and Vympel did not move to the White House as planned, and Yazov ordered the troops to pull out of Moscow. Reports also surfaced that Gorbachev had been placed under house arrest in Crimea. During the final day of her family's exile, Raisa Gorbacheva suffered a minor stroke."
 soviet_union.13.a: "..."
 soviet_union.14.t: "day four"
 soviet_union.14.d: "At one minute past midnight, Gorbachev, his family and assistants flew to Moscow on Rutskoy's plane. The GKChP members were sent back on a different plane; only Kryuchkov flew in the presidential plane, under police custody (according to Rutskoy, \"they [would] definitely not be shot down with him on board\"). Upon arrival, Kryuchkov, Yazov and Tizyakov were arrested on the airfield, which was illegal under Soviet law as officials representing the central government could only be arrested and tried under Soviet law, which prevailed over the laws of the constituent republics. \n\n At 2:00 am, when Gorbachev arrived at Moscow's Vnukovo Airport, television showed live footage of him walking down the airstairs wearing a knitted sweater. \n\n At 6:00 am, Soviet Vice President Yanayev was arrested in his office. \n\n Boris Pugo and his wife died by suicide after being contacted by the RSFSR for a meeting over his role in the coup attempt."
 soviet_union.14.a: "We can't win... Dissolve GKChP..."
 
 armenia.1.t: "Independence!"
 armenia.1.d: "Armenia has declared independence. The republic must now consolidate its institutions, secure international recognition and ensure its own security."
 armenia.1.a: "Park' mer angakh Hayastanin!"
 armenia.2.t: "Azerbaijan Refused Referendum in Arstakh!"
 armenia.2.d: "Azerbaijan has blocked any attempts to commit to the referendum. This could cause real damage to the local Armenian population."
 armenia.2.a: "The Death is Comming!"
 armenia.2.b: "We can't win this..."
 
 Azerbaijan.1.t: "Independence!"
 Azerbaijan.1.d: "Azerbaijan has declared independence. As the institutions of the Union fall into crisis, the republic is taking responsibility for its own political future."
 Azerbaijan.1.a: "Musteqil Azerbaycana şan olsun!"
 Azerbaijan.2.t: "Armenia Demands referendum in Karabakh"
 Azerbaijan.2.d: "The Armenian side is demanding a referendum on the status of Nagorno-Karabakh. Our response will shape relations with Armenia and the course of the conflict."
 Azerbaijan.2.a: "In their stoopid dreams..."
 Azerbaijan.2.b: "Kk"

 russia.2.t: "Chechnya deports Russians"
 russia.2.d: "Reports from Chechnya describe the expulsion of Russian residents. According to the information received, [?CHE.CHE_deported_population|0] people have left their homes. We will receive [?CHE.CHE_refugees_on_map|0] in the North Caucasus; the rest are heading for other regions of Russia.\n\nDisplaced families need accommodation and assistance. Advisers are considering a diplomatic protest and an economic embargo, while some ministers call for military preparations to begin ahead of schedule. Our response will shape relations with Grozny and the course of the crisis."
 russia.2.a: "Condemn the expulsions."
 russia.3.t: "The Congress of Peoples Deputies and the Supreme Soviet dissolved!"
 russia.3.d: "On 21 September, Yeltsin declared the Congress of People's Deputies and the Supreme Soviet dissolved; this act was in contradiction with a number of articles of the Constitution of 1978 (as amended 1989-1993)."
 russia.3.a: "Finally"
 russia.4.t: "The Russian army is losing its combat capability"
 russia.4.d: "The Russian army is losing its combat capability"
 russia.4.a: "Damn"
 russia.5.t: "Communism is gaining popularity again"
 russia.5.d: "Due to the difficult economic situation, gigantic inflation and mass unemployment, the ideas of communism began to gain momentum again"
 russia.5.a: "We need to fight this"
 russia.6.t: "Fail blitz first chechen war"
 russia.6.d: "Hopes of a swift victory in Chechnya have not been fulfilled. Resistance has proved stronger than expected, forcing command to reconsider its operational plans."
 russia.6.a: "Damn"
 russia.7.t: "Triumph in Chechnya"
 russia.7.d: "Command reports that the operation in Chechnya has succeeded. The federal authorities must now consolidate these results and decide on their next steps in the region."
 russia.7.a: "Glory of Russia!"
 russia.8.t: "Mass Protest"
 russia.8.d: "Yeltsin also sparked popular unrest with his dissolution of a Congress and parliament increasingly opposed to his neoliberal economic reforms. Tens of thousands of Russians marched in the streets of Moscow seeking to bolster the parliamentary cause. The demonstrators were protesting against the deteriorating living conditions. Since 1989, the GDP had been declining, corruption was rampant, violent crime was skyrocketing, medical services were collapsing and life expectancy falling. Yeltsin was also increasingly getting the blame."
 russia.8.a: "Annoying..."
 russia.9.t: "First bloody clashes"
 russia.9.d: "On 28 September, Moscow saw the first bloody clashes between the special police and anti-Yeltsin demonstrators. Also on the same day, the Russian Interior Ministry moved to seal off the parliament building. Barricades and wire were put around the building."
 russia.9.a: "This should put silence in streets right?"
 russia.10.t: "Barricades around parliament"
 russia.10.d: "On 2 October, supporters of parliament constructed barricades and blocked traffic on Moscow's main streets. Rutskoy signed a decree that had no practical consequences on the release of Viktor Chernomyrdin from the post of Prime Minister."
 russia.10.a: "this isn't going good..."
 russia.11.t: "successful storm on the police cordon"
 russia.11.d: "On the afternoon of 3 October, armed opponents of Yeltsin successfully stormed the police cordon around the White House territory, where the Russian parliament was barricaded. Paramilitaries from factions supporting the parliament, as well as a few units of the internal military (armed forces normally reporting to the Ministry of Interior), supported the Supreme Soviet."
 russia.11.a: "ENOUGH!"
 russia.12.t: "Fire"
 russia.12.d: "By sunrise on 4 October, the Russian army encircled the parliament building, and a few hours later army tanks began to shell the White House, punching holes in the front of it. \n\n By noon, troops entered the White House and began to occupy it, floor by floor. Rutskoy's desperate appeal to Air Force pilots to bomb the Kremlin was broadcast by the Echo of Moscow radio station but went unanswered. He also tried to have the Chairman of the Constitutional Court, Valery Zorkin, call the Western embassies to guarantee Rutskoy's and his associates' safety - to no avail. Hostilities were stopped several times to allow some in the White House to leave. By mid-afternoon, popular resistance in the streets was completely suppressed, barring occasional sniper fire."
 russia.12.a: "..."
 russia.13.t: "Peace with Chechnya"
 russia.13.a: "Sure thing!"
 russia.13.b: "We must wipe out those demons"
 russia.14.t: "Failed assasination attempt on dudayev"
 russia.14.a: "ARE YOU KIDDING ME???"
 russia.15.t: "Ingushs rebeled in East Prigorodny"
 russia.15.a: "Huh"
 russia.16.t: "Clashes in East Prigorodny!"
 russia.16.a: "Send diplomats... NOW!"
 russia.17.t: "Ceasefire with Ingush rebels"
 russia.17.a: "Good job diplomats"
 russia.23.t: "Hyperinflation"
 russia.23.d: "The economic crisis in Russia has reached a critical point. After price liberalization, privatization, and the destruction of the Soviet planned system, the ruble is rapidly depreciating. In 1993, inflation has reached horrific proportions: prices are rising every day, wages are depreciating faster than they can be paid, and pensioners and the poor are on the brink of survival. Spontaneous protests break out on the streets of major cities, and confidence in Yeltsin's government is plummeting. The country is facing the worst economic disaster in its history."
 russia.23.a: "Bad news"
 russia.24.t: "Closure of enterprises"
 russia.24.d: "The collapse of the Soviet Union destroyed the unified economic system that had linked the republics into a single economic network. Thousands of factories and plants, deprived of supplies of raw materials, components and markets, were unable to continue working. Industrial giants are idle, workers are quitting en masse or not receiving wages for months. City-forming enterprises are closing, entire regions are plunging into depression, and social discontent is growing. The former Soviet republics are pursuing their own policies, refusing to fulfill their previous obligations, which only intensifies the crisis. Russia is entering a period of severe trials."
 russia.24.a: "Bad news"
 russia.30.t: "Grozny has been taken"
 russia.30.d: "During the battle for Grozny, we liberated it and drove out the Chechen fighters."
 russia.30.a: "Hurray!"
 russia.31.t: "Protests in Dagestan and Ingushetia"
 russia.31.d: "In anticipation of the troop deployment to Chechnya, the situation in the North Caucasus has sharply escalated. Mass protests against the deployment of federal forces and the possible outbreak of war have begun in Ingushetia and Dagestan. Local residents are taking to the roads, blocking highways, and lining up in front of military convoys, demanding a halt to the advance of equipment and preventing bloodshed. Troop movement has been seriously slowed. Columns are idling for hours, the offensive schedule is being disrupted, and tensions are rising among personnel. Command fears violent incidents involving civilians, which could lead to a political scandal and even greater resistance in the region." 
 russia.31.a: "Horrible!"
 russia.32.t: "Battle in Budyonnovsk"
 russia.32.d: "In the morning, an armed group of Chechen militants under the command of Shamil Basayev illegally crossed the administrative border and entered the Stavropol Krai. Traveling in KamAZ trucks and a passenger car, the militants opened fire on law enforcement officers and civilians in the city of Budyonnovsk. After an unsuccessful attempt to seize the district police department building, during which police officers and civilians were killed, the militants retreated toward the city hospital. Using automatic weapons and grenade launchers, they stormed the medical facility, which at the time housed hundreds of patients, medical staff, women, children, and newborns. Having occupied the hospital buildings, the militants organized a perimeter defense and barricaded themselves inside, turning the healthcare facility into a fortified point. All civilians inside the hospital were taken hostage and used as human shields.\" Attempts by police and internal troops to contain the situation on the spot were thwarted by heavy fire from the attackers."
 russia.32.a: "Storm the hospital!"
 russia.33.t: "Night assault on the hospital"
 russia.33.d: "Overnight, Russian security forces attempted to storm the hospital in Budyonnovsk, where militants were holding hundreds of hostages. The operation began with artillery barrages and airstrikes on the building, after which special forces and internal troops attempted to enter. However, the militants put up fierce resistance, using the hostages as human shields. Numerous hostages and law enforcement officers were killed during the assault. Despite the heroic efforts of the security forces, the operation failed, and the militants retained control of the hospital."
 russia.33.a: "We must rescue the hostages!"
 russia.34.t: "Negotiations with Terrorists"
 russia.34.d: "Following the failed attempt to storm the hospital in Budyonnovsk, the Russian government decided to open negotiations with the terrorists to free the hostages and end the bloodshed. Leading negotiators, including representatives of the Ministry of Internal Affairs and the Federal Security Service, entered into dialogue with militant leader Shamil Basayev. The negotiations took place in a tense atmosphere, with harsh demands and threats being made on both sides. The government sought to secure the release of the hostages without further violence, while the terrorists insisted on their political demands. As a result of lengthy negotiations, an agreement was reached on a ceasefire and the release of some hostages in exchange for security guarantees for the militants."
 russia.34.a: "We must rescue the hostages!"
 russia.35.t: "End of the Budyonnovsk Crisis"
 russia.35.d: "After several days of tense negotiations and a hostage exchange, the Budyonnovsk crisis has ended. Most of the hostages have been released, and the militants have received guarantees of safety and the opportunity to leave Russia. The Russian government has announced a ceasefire and launched an investigation into the incident. Despite tragic losses, the situation has been brought under control, and the government has promised to strengthen counterterrorism measures in the future."
 russia.35.a: "Good job"

 abkhazia.1.t: "Shamil Basayev Arrives"
 abkhazia.1.d: "Shamil Basayev has just arrived with a detachment of volunteers from Chechnya who have expressed their willingness to fight for the freedom of Abkhazia."
 abkhazia.1.a: "All fighters are needed"
 abkhazia.2.t: "Shamil Basayev is leaving the country"
 abkhazia.2.d: "Shamil Basayev, the Chechen volunteer who helped us defend our independence, has left our country."
 abkhazia.2.a: "Sad"
 abkhazia.3.t: "Russia sent aid"
 abkhazia.3.d: "Russia sent us aid for our just struggle against the Georgian occupiers."
 abkhazia.3.a: "Thank you, Russia!"

 generic.1.t: "Mod supports pro-European protests in Georgia!"
 generic.1.d: "Following the rigged 2024 parliamentary elections, protests erupted in Georgia. Initially minor, on November 28, the government (Georgian Dream party) suspended negotiations with the EU until 2028, sparking large-scale and radical protests. Despite a brief lull, the protests continue. The Georgian Dream party is increasingly displaying authoritarian and pro-Russian tendencies: students are being arrested for Facebook posts calling the government pro-Russian, and four opposition leaders have been arrested in just two days."
 generic.1.a: "Fire at the oligarchy!"

 ossetia.1.t: "Georgia offers peace."
 ossetia.1.d: "Georgia offers a peace agreement."
 ossetia.1.a: "Agree."
 ossetia.2.t: "Russia sent aid."
 ossetia.2.d: "Russia sent us aid for our just struggle against the Georgian occupiers."
 ossetia.2.a: "Thank you, Russia!"

 chechnya.1.t: "Ingushetia has separated from us."
 chechnya.1.d: "Despite their shared history during the Chechen-Ingush Autonomous Soviet Socialist Republic, the Ingush leadership officially rejected the offer to join the newly declared Chechen Republic of Ichkeria. Citing a desire for stability, legal continuity, and growing tensions with the Chechen separatist movement, Ingushetia declared its loyalty to the Russian Federation."
 chechnya.1.a: "Damn"
 chechnya.2.t: "Ingushetia remains part of our federation"
 chechnya.2.d: "While separatist sentiment is growing in Chechnya and the region is declaring independence, the Ingush leadership has officially announced its decision to remain part of the Russian Federation. Historically tied to Moscow and concerned about territorial disputes with North Ossetia and instability in Chechnya, Ingushetia sees security and prosperity in maintaining its membership in Russia."
 chechnya.2.a: "Excellent news"
 chechnya.3.t: "Current situation"
 chechnya.3.d: "By January 1, 1991, the Chechen-Ingush ASSR, formally part of the RSFSR and the Soviet Union, had effectively escaped Moscow's control. The communist leadership was rapidly losing power, mass nationalist rallies paralyzed the Supreme Soviet, and slogans for independence were increasingly louder on the streets of Grozny. Armed activists, Afghan War veterans, and clan militias patrolled the streets. Unemployment in the regions was rising, and a sense of impending anarchy reigned. The Russian-speaking population was panicking—the first threats and home seizures were already appearing. A spirit of restored pride and inevitable conflict hung over the republic. Against the backdrop of the weakening center, a figure emerged—Air Force General Dzhokhar. Dudayev, whose name was already whispered hopefully at markets and rallies. The collapse of the Soviet system in the region was only a matter of time."
 chechnya.3.a: "Excellent"
 chechnya.4.t: "INDEPENDENCE!"
 chechnya.4.d: "For centuries, our people have fought to preserve their identity, faith, and freedom. From battles with Tsarist expansion to the bitter betrayal of 1944, we have survived occupation, exile, and silence. But now, in the chaos of a crumbling Soviet Union, history reveals a narrow path forward—a path washed with sacrifice, but illuminated by the flame of hope. Today, we break the chains that bound us to Moscow. The Chechen Republic proclaims itself sovereign and independent of any foreign domination. No longer will decisions about our fate be made in distant halls by those who do not speak our language and do not understand our soul. This is not just a political act—it is a resurrection. The rebirth of a nation buried but never forgotten. The road ahead will be difficult. Enemies will call us rebels. Allies will waver. But the spirit The Caucasus isn't so easy to extinguish."
 chechnya.4.a: "Dozal Chechena Azatkhan!"
 chechnya.5.t: "Gamsakhurdia's arrival in Chechnya"
 chechnya.5.d: "After his overthrow during the Georgian civil conflict, former Georgian President Zviad Gamsakhurdia fled to the Chechen Republic of Ichkeria. He was welcomed by President Dzhokhar Dudayev. Gamsakhurdia is seeking political asylum and support to continue his resistance to the new regime in Tbilisi."
 chechnya.5.a: "Interesting"
 chechnya.6.t: "Russia attacked us."
 chechnya.6.d: "Early this morning, Russian troops crossed the border into the Chechen Republic of Ichkeria. Air strikes began on key targets in Grozny, and armored columns are advancing from Mozdok, Stavropol, and Dagestan. Moscow has declared an \"operation for constitutional restoration\" against so-called illegal armed groups. President Dzhokhar Dudayev has ordered a general mobilization and called on the people to resist. The war has begun. Chechnya must survive despite the overwhelming superiority of the enemy."
 chechnya.6.a: "For Ichkeria!"
 chechnya.7.t: "Russia supports the Chechen opposition"
 chechnya.7.d: "The Russian leadership, seeking to regain control of the region without direct military intervention, began providing covert support to the anti-Dudayev opposition. Through intermediaries, funds, weapons, and equipment were transferred to the opposition forces, and coordination of actions was also carried out. Moscow hoped that an internal coup would allow for the replacement of the Chechen leadership and the restoration of a loyal government."
 chechnya.7.a: "Damn Russians"
 chechnya.9.t: "The Failure of the Russian December Offensive"
 chechnya.9.d: "December 1994 was supposed to be a moment of quick victory. The Russian leadership was counting on a rapid advance, the capture of Grozny, and the collapse of the resistance in a matter of days. The operation was planned as a show of force and the restoration of control over the region without a protracted war. However, the offensive turned into a disaster. The units sent into Chechnya were poorly prepared for urban combat, coordination between units was disrupted, and intelligence was outdated or incorrect. Columns of armored vehicles entered Grozny without adequate cover and were ambushed. Chechen forces, well-versed in urban areas, used mobile groups, ATGMs, and fire from upper floors, inflicting heavy losses."
 chechnya.9.a: "Dozal Chechena Azatkhan!"
 chechnya.10.t: "Gamsakhurdia's Arrival"
 chechnya.10.d: "Gamsakhurdia has arrived"
 chechnya.10.a: "Clear"
 chechnya.11.t: "The Russian Question"
 chechnya.11.d: "Russian residents of Grozny, northern Chechnya and Gudermes are asking the authorities to guarantee their safety. Families fear threats and the loss of their homes and jobs. Doctors, teachers and industrial workers warn that a large exodus would disrupt essential services.\n\nRadical supporters of independence demand the expulsion of Russian residents. Dudayev can reject this policy or authorise a limited campaign concentrated in the cities and the north. The decision will affect thousands of families and relations with Moscow."
 chechnya.11.a: "Reject deportation. They have the right to remain."
 chechnya.11.b: "Authorise deportation."
 chechnya.13.t: "Dzhokhar Dudayev is dead!"
 chechnya.13.d: "President Dzhokhar Dudayev was killed in a targeted Russian airstrike. According to Chechen sources, Dudayev was talking on a satellite phone near the village of Gekhi-Chu when his signal was intercepted, and missiles were fired at his coordinates."
 chechnya.13.a: "May Allah grant him the highest place in Paradise."
 chechnya.14.t: "Russia staged an assassination attempt on Dudayev."
 chechnya.14.d: "Russian forces launched a targeted missile strike on the suspected location of President Dzhokhar Dudayev. However, the Chechen leader reportedly left the area minutes before the strike. Several security guards were killed and local infrastructure was damaged, but Dudayev himself was unharmed."
 chechnya.14.a: "Cursed Russia"
 chechnya.15.t: "Basayev's Victory"
 chechnya.15.d: "Shamil Basayev, a prominent Chechen field commander and nationalist leader, won the presidential elections in the Chechen Republic of Ichkeria. His victory marks a significant shift in Chechnya's political landscape, with Basayev's platform emphasizing armed resistance to Russian troops and the establishment of an Islamic state."
 chechnya.15.a: "Allahu Akbar!"
 chechnya.16.t: "Dudaev won"
 chechnya.16.d: "The first presidential elections in the Chechen Republic of Ichkeria have taken place. Dzhokhar Dudayev, a former Soviet Air Force general and prominent nationalist leader, won a decisive victory, garnering over 70% of the vote. His main rival, Umar Avturkhanov, received only 15%. The elections were marked by widespread support for Dudayev's platform of independence from Russia and his promises to restore Chechen sovereignty."
 chechnya.16.a: "For Dudayev!"
 chechnya.17.t: "Opposition seizes tower"
 chechnya.17.d: "In a shocking escalation, anti-Dudayev opposition groups stormed the national television station in Grozny. The broadcast announced the removal of President Dzhokhar Dudayev. The coup is reportedly supported by former Soviet officers, pro-Russian supporters, and disgruntled clan leaders. Armed groups are already moving toward key government buildings. The capital is in chaos. While some citizens support calls for regime change, others have taken to the streets in defense of the republic and its president. The nation stands at a crossroads."
 chechnya.17.a: "Send the National Guard there"
 chechnya.18.t: "Chechen Elections of 1991"
 chechnya.18.d: "The first presidential elections in the Chechen Republic of Ichkeria have taken place. Dzhokhar Dudayev, a former Soviet Air Force general and prominent nationalist leader, won a decisive victory, receiving over 70% of the vote. His main rival, Umar Avturkhanov, received only 15%. The elections were marked by widespread support for Dudayev's platform of independence from Russia and his promises to restore Chechen sovereignty."
 chechnya.18.a: "For Dudayev!"
 chechnya.19.t: "The National Guard is regaining control"
 chechnya.19.d: "After a tense night in Grozny, units of the Ichkerian National Guard successfully repelled the opposition's assault on key government facilities. The TV station was recaptured, the coup leaders were either arrested or eliminated, and martial law was declared in the capital."
 chechnya.19.a: "The opposition is the enemy of Ichkeria!"
 chechnya.20.t: "Islamist Protests"
 chechnya.20.d: "The 1991 elections, intended to determine the republic's future, instead of stabilizing it, turned into mass protests. From the first days of the campaign, the streets filled with rallies, accusations of fraud, and mutual threats. Various political forces—nationalists, Islamists, and supporters of the previous government—brought their supporters to the squares, attempting to influence the outcome of the vote not with ballots, but with the number of people cast."
 chechnya.20.a: "Understood"
 chechnya.21.t: "The Chechen opposition has seized the region"
 chechnya.21.d: "Reports from the northern regions of the republic confirm the worst: armed anti-Dudaev opposition groups, supported by local supporters, have completely seized the Nadterechny district. Administrative buildings have been occupied, loyal officials have been expelled, and the flags of the so-called \"National Salvation Committee\" have been raised over the territory. Local field commanders are declaring their intention to \"liberate Chechnya from the Dudayev regime\" and are calling on the population to join them. The situation is dangerous – if the district remains in the hands of the rebels, they will be able to use it as a springboard for a full-scale offensive on Grozny."
 chechnya.21.a: "Damn"
 chechnya.22.t: "Islamic Radicals in the Elections"
 chechnya.22.d: "Islamic radicals gained significant support in the recent elections, capitalizing on growing dissatisfaction with the current government and the desire for a more religiously oriented leadership. Their platform emphasizes the establishment of an Islamic state, strict adherence to Sharia law, and resistance to Russian influence."
 chechnya.22.a: "Still for Dudayev!"
 chechnya.22.b: "Islam will protect our country!"
 chechnya.23.t: "Second Congress of the Chechen National Congress"
 chechnya.23.d: "The Second Congress of the Chechen National Congress, the key body that united the Chechen national movement amid the collapse of the USSR, took place in Grozny. Delegates from all regions of the republic, as well as representatives of the diaspora, made a number of momentous decisions. The congress officially proclaimed the Chechen Republic's intention to secede from the RSFSR and the USSR and to form its own governing bodies. An executive committee was elected, headed by retired Air Force Major General Dzhokhar Dudayev."
 chechnya.23.a: "Good"
 chechnya.24.t: "Turkey sent weapons"
 chechnya.24.d: "Despite growing tensions and international isolation, the government of the Turkish Republic offered humanitarian aid to the Chechen Republic of Ichkeria—medicine, food, and equipment. However, upon arrival in Grozny, it turned out that the boxes with medical markings contained automatic weapons, ammunition, and equipment. Despite the risks, this significantly strengthens the republic's defense capability. Russian intelligence has not yet responded, but an international scandal is possible if the information leaks."
 chechnya.24.a: "Thank you, Muslim brothers."
 chechnya.26.t: "Healthcare Crisis"
 chechnya.26.d: "After the collapse of the USSR and the severing of previous economic ties, the Chechen Republic of Ichkeria found itself in a dire situation. Medical institutions lost their centralized supply of medications, and warehouses quickly emptied. In 1992, the drug shortage became critical: doctors were unable to perform surgeries, many hospitals were operating with outdated equipment, and patients were dying from diseases that had previously been easily treatable. The public demanded urgent action, as the lack of access to essential medications was undermining trust in the young republic and fueling public discontent."
 chechnya.26.a: "Bad News"
 chechnya.27.t: "Khattab's Arrival"
 chechnya.27.d: "A mysterious man calling himself Khattab, an Arab mujahideen who fought in Afghanistan and many other wars, has arrived in the mountainous regions of Chechnya. His troops are well-armed, disciplined, and fanatically devoted to the idea of ​​jihad against Russia. He quickly gained the respect of young fighters and local field commanders, offering money, weapons, and military expertise. Khattab calls for the unification of Chechen forces under the banner of the \"true faith\" and promises to transform the war for independence into a holy struggle against the infidels."
 chechnya.27.a: "He is our brother in jihad"
 chechnya.28.t: "The USSR declared martial law"
 chechnya.28.d: "Today, words were spoken in Grozny that changed the course of history in the Caucasus: \"From this day forward, the Chechen Republic of Ichkeria is a free and independent state!\" General Dzhokhar Dudayev, who became a symbol of resistance to Moscow, declared independence from the Soviet Union. Crowds of people in the square chant slogans, burn Soviet flags, and vow to defend the new republic to the last drop of blood. However, alarming signals are coming from Moscow. The Soviet leadership calls the act of independence an \"illegal rebellion\" and declares martial law in the newly formed republic."
 chechnya.28.a: "We are an independent state!"
 chechnya.29.t: "The USSR lifts martial law"
 chechnya.29.d: "Following the failure of an attempt to send troops into Grozny and growing resistance from Dzhokhar Dudayev's supporters, on November 11, 1991, the Supreme Soviet of Russia lifted martial law in the Chechen-Ingush Republic."
 chechnya.29.a: "Glory to Ichkeria!"
 chechnya.30.t: "Airborne troops at Grozny airport"
 chechnya.30.d: "Early this morning, Russian airborne troops carried out a daring assault on Grozny airport, attempting to seize a strategic facility and establish control over the capital of the Chechen Republic of Ichkeria. However, brave Chechen soldiers, warned of the approaching Russian forces, put up fierce resistance and prevented the enemy from gaining access to the airport so easily."
 chechnya.30.a: "Destroy them!"
 chechnya.31.t: "The Opposition Begins Military Action"
 chechnya.31.d: "Internal tensions that had been building for months have finally erupted into open warfare. The so-called opposition, former supporters of Soviet power, disillusioned commanders, and representatives of old clans that are puppets of Russia, have announced the creation of the 'Provisional Council of the Chechen Republic' and begun military action against the government of Dzhokhar Dudayev in Northern Chechnya."
 chechnya.31.a: "Destroy them!"
 chechnya.32.t: "Chechnya offers a white peace"
 chechnya.32.d: "After months of fierce fighting and heavy losses, the Chechen leadership sent a message to Moscow proposing an end to the war and the return of the borders that existed in November 1994."
 chechnya.32.a: "Reasonable."
 chechnya.32.b: "Russia will win!"
 chechnya.33.t: "Russia rejected peace."
 chechnya.33.d: "After our proposal for a status quo peace, the Russian government held an emergency meeting of the Security Council. The majority of participants believed that accepting such terms would mean admitting defeat and undermining the authority of the state. Despite public fatigue and international calls for de-escalation, the decision was clear: the 'operation' in Chechnya must continue until full control over the region is restored."
 chechnya.33.a: "Stupid Russians"
 chechnya.34.t: "Shamil Basayev is heading to Abkhazia"
 chechnya.34.d: "Basayev has left at the head of a detachment of volunteers for Abkhazia to participate in the Georgian-Abkhaz conflict on the Abkhaz side."
 chechnya.34.a: "Let him go"
 chechnya.35.t: "Shamil Basayev is returning"
 chechnya.35.d: "Shamil Basayev, who previously went to Abkhazia with other Chechen volunteers, has returned from there."
 chechnya.35.a: "Understood"
 chechnya.36.t: "Headquarters"
 chechnya.36.d: "Headquarters"
 chechnya.36.a: "Headquarters"
 chechnya.37.t: "Grozny is lost"
 chechnya.37.d: "Grozny has fallen. After weeks of continuous bombing and street fighting, defending the city has become impossible. The enemy's superior artillery and air power have reduced the capital to rubble. The defenders, exhausted and suffering heavy losses, were forced to abandon the city, preserving their combat-ready units. Retreating from Grozny does not mean defeat. The war is changing shape. Units are retreating to the mountains and rural areas, where a new phase of resistance begins – mobile, hidden, and protracted. The loss of the capital is becoming a symbol of tragedy, but also a cause for radicalization and growing determination to continue the fight. Grozny is lost, but the war is far from over."
 chechnya.37.a: "Oh no!!"

 chechnya.38.t: "Negotiations in Ingushetia"
 chechnya.38.d: "Amid the looming catastrophe, the two sides made a last-ditch attempt to avoid a full-scale war. Russian Defense Minister Pavel Grachev and Chechen leader Dzhokhar Dudayev held talks in Ingushetia. The atmosphere at the meeting was tense. The Russian side insisted on the immediate disarmament of the armed forces, the restoration of federal control, and subordination to legitimate authority. The Chechen delegation demanded recognition of independence and the withdrawal of troops from Chechnya's borders. Neither side was prepared to yield on key issues. The talks reached an impasse. The two sides parted, realizing that the diplomatic window was closing."
 chechnya.38.a: "War means war"
 chechnya.39.t: "New Islamic Republic"
 chechnya.39.d: "The 1991 elections in Chechnya were a turning point in our history. Against the backdrop of the collapse of the Soviet Union, the weakening of central power, and the rise of radical sentiments, Islamic political forces advocating a complete break with Moscow and the construction of a state based on Sharia law won. For a significant portion of the population, this result became a symbol of liberation from the previous order and a promise of justice, order, and national revival. However, other groups—secular elites, nationalists, and representatives of minorities—were alarmed by the course toward Islamization of power and the uncertainty of the future state structure. The proclamation of a new Islamic republic changes the balance of power throughout the North Caucasus. Questions of external legitimacy, internal stability, and relations with Russia remain open. Victory in the elections is only the beginning of a long and dangerous paths. The future of the young republic now depends on what kind of state this will become: a centralized religious regime, an arena of internal conflicts, or the core of a broader Islamic movement in the region."
 chechnya.39.a: "Allahu Akbar!"
 chechnya.40.t: "Ingushetia wants to secede from Ichkeria"
 chechnya.40.d: "Amid the collapse of old administrative structures and radical political changes in Chechnya, demands from Ingush elites and public movements for Ingushetia to secede from the general state entity are growing louder. In Grozny, the Islamization of power and the concentration of authority are growing, causing concern in the Ingush districts, where fears of losing autonomy and being drawn into a future armed conflict are strong. In Nazran, meetings of elders and rallies are taking place, calling for the creation of a separate Ingush republic and direct dialogue with Moscow. Administrative structures are beginning to sabotage decisions by the central Chechen government, and local security forces are refusing to obey orders from Grozny. The Ingush issue is ceasing to be an internal dispute and is becoming a threat to the collapse of the state. Any wrong decision could lead to a political crisis, internal conflict, or the intervention of external forces."
 chechnya.40.a: "Horror!"
 chechnya.41.t: "Rebels are arming themselves."
 chechnya.41.d: "The peaceful protests sweeping the region are entering a new and dangerous phase. The dispersal of rallies, the detention of activists, and the lack of political dialogue have led to the radicalization of the protest movement. Cases of weapons being seized from warehouses, individual security forces deserting, and the formation of the first armed self-defense units are becoming more and more common. Roadside barricades are giving way to checkpoints, slogans to orders. Protesters are no longer relying solely on street pressure and are preparing for a violent confrontation. The region is rapidly sliding toward internal conflict, where the line between civil resistance and armed rebellion is becoming increasingly thin."
 chechnya.41.a: "Martial law must be declared!"
 chechnya.42.t: "Shooting Begins"
 chechnya.42.d: "Tension that had been building for weeks has erupted into open violence. The first shots have been fired at checkpoints and intersections. Still chaotic and uncoordinated, gunfights are breaking out between armed protesters and forces loyal to the central government. Small arms are being used, and the first casualties have been reported on both sides."
 chechnya.42.a: "Shoot all protesters!"
 chechnya.43.t: "Uprising in Ingushetia"
 chechnya.43.d: "The situation in Ingushetia has deteriorated rapidly. The growing unrest and the increasing number of armed groups have led to a full-scale uprising. The Ingush people, who had previously been passive, are now actively resisting the central authority in Chechnya. The conflict has spread beyond the borders of Chechnya, and the Russian government is struggling to maintain control."
 chechnya.43.a: "We must act quickly!"
 chechnya.44.t: "Protests in Grozny"
 chechnya.44.d: "The announced election results have provoked a sharp reaction from pro-Dudaev forces. Movement representatives stated that the vote was flawed, pressured, and did not reflect the true will of the people. In Grozny and several districts, there are statements about an \"illegitimate government\" and a refusal to submit to the new government. Dudayev's supporters retain control of some administrative buildings, armed forces, and communications facilities. The orders of the new government are being ignored, and parallel structures are being created. The political crisis is rapidly escalating into the threat of a violent confrontation."
 chechnya.44.a: "We need to sort this out..."
 chechnya.45.t: "Dissolution of Parliament"
 chechnya.45.d: "Amid a growing political crisis and internal confrontation, President Dzhokhar Dudayev took a radical step. Accusing parliament of sabotage, ties to the opposition, and attempts to undermine the foundations of the new government, he announced its dissolution and the concentration of power in the hands of the executive branch. This decision marked a turning point in the history of Ichkeria. The formal institutions inherited from the Soviet system were effectively eliminated, and governance of the republic increasingly relied on presidential decrees and forceful methods. Some deputies left Grozny or joined the open opposition, while others were forced out of the political process."
 chechnya.45.a: "Parliament is a reducer of the past"
 chechnya.46.t: "Russia proposes a federal treaty"
 chechnya.46.d: "Following the collapse of the Soviet Union and the growing crisis in relations with Chechnya, the Russian leadership is attempting to resolve the conflict politically. It is important for Moscow to preserve the territorial integrity of the state and avoid a violent scenario that could lead to large-scale destabilization of the region. The Russian side has officially proposed that the Chechen leadership sign a federal treaty. The document provides for broad autonomy, the republic's participation in federal structures, and economic guarantees in exchange for recognition of Chechnya as a subject of the Russian Federation. The Kremlin hopes that a compromise will allow the region to return to the legal framework without the use of force."
 chechnya.46.a: "Chechnya will be independent!"
 chechnya.47.t: "Chechnya has rejected the treaty."
 chechnya.47.d: "Our proposal for Chechnya to sign an updated federal treaty with us was rejected by the Cabinet of Ministers of the Chechen Republic."
 chechnya.47.a: "They shouldn't have refused!"
 chechnya.48.t: "Russian units have completely left Chechnya."
 chechnya.48.d: "Following the collapse of the Soviet Union and protracted negotiations, the last Russian troops stationed there since the Soviet era have finally withdrawn from Chechnya. Military camps are emptying, equipment and property are either being removed or handed over to local structures. Symbolically, the era of direct military presence from the center in the republic is coming to an end."
 chechnya.48.a: "Excellent!"

 chechnya.49.t: "Railroad Halt"
 chechnya.49.d: "Due to the increasing frequency of attacks on trains, sabotage on tracks, and cargo robberies, train service in the region is becoming impossible. Engine drivers are refusing to go on trips, security guards are unable to cope with the threats, and insurance and transportation companies are curtailing operations. The railway, which once connected the region to the outside world, is becoming a risk point. Deliveries of fuel, food, and industrial goods are disrupted, and the economy is experiencing a severe shortage of resources. Isolation is intensified not by political decisions, but by the actual loss of security."
 chechnya.49.a: "The opposition is to blame!"

 chechnya.50.t: "Dudaev's residence is blockaded"
 chechnya.50.d: "Today, at 11 a.m., during the height of Grozny's activity, several unidentified vehicles pulled up to the residence. Several dozen armed men emerged from these vehicles and surrounded President Dudayev's residence. During negotiations, it emerged that these were members of the opposition National Salvation Committee, led by former Dudayev supporter I. Suleimenov, who blockaded Dudayev's residence and put forward a number of political demands."
 chechnya.50.a: "We need to calm them down..."
 chechnya.51.t: "Unblocking the residence"
 chechnya.51.d: "During the negotiations, which lasted approximately 20 hours, all the opposition members who participated in the blockade of Dudayev's residence defected to our side and are once again supporting the president."
 chechnya.51.a: "Excellent!"
 chechnya.52.t: "Constitutional Court Decision"
 chechnya.52.d: "The Constitutional Court of Chechnya issues an unprecedented ruling, directly accusing President Dzhokhar Dudayev of committing criminal acts aimed at the illegal seizure and retention of power. The ruling states that the dissolution of Parliament, the removal of representative bodies, and the formation of alternative governing structures were carried out in circumvention of constitutional norms and in direct violation of the foundations of the state structure. The court recognizes that Dudayev's actions were deliberate and aimed at eliminating the system of checks and balances. The stripping of Parliament of its powers and the creation of an unconstitutional government, according to the judges, completely undermined the legal legitimacy of the current government and led to the usurpation of governance in the republic."
 chechnya.52.a: "How dare they?!?!"
 chechnya.53.t: "Storming the City Assembly"
 chechnya.53.d: "Armed forces under the command of Shamil Basayev seize the Grozny City Assembly building – the site of the parliament and the Constitutional Court, which were then in session, in opposition to Dzhokhar Dudayev. The attack was carried out swiftly and without attempting to conceal the political nature of the operation."
 chechnya.53.a: "We caught the scoundrels!"
 chechnya.54.t: "Checkpoints on the Border"
 chechnya.54.d: "North Ossetian authorities are taking emergency measures to strengthen security on the border with Checheno-Ingushetia. Eight checkpoints, reinforced by thirteen armored vehicles, are being established at key locations. The official goal is to prevent the possible infiltration of armed groups and destabilization of the republic. The decision is being made against the backdrop of the disintegration of union structures, rising interethnic tensions, and uncertainty in neighboring regions. The lack of a unified command center and rumors of armed forces' movements are forcing the North Ossetian leadership to act independently, relying on force."
 chechnya.54.a: "Clear"
 chechnya.55.t: "An Operation to Turn the Tide of the War"
 chechnya.55.d: "After the loss of our capital, Grozny, and a series of defeats on the battlefield, the Chechen leadership must take decisive measures to turn the tide of the war. A meeting of senior military leaders was convened to discuss ideas for restoring the initiative. One of the key proposals was a series of daring \"breakthroughs\" into the enemy's rear, aimed at disrupting their logistics, communications, and morale. Only one thing remains: we need to decide where and to what end this breakthrough will be made."
 chechnya.55.a: "Mineralnye Vody is our target"
 chechnya.56.t: "Beginning of the operation"
 chechnya.56.d: "Early in the morning, a detachment of over one hundred and sixty fighters left Chechnya. The convoy moved through Dagestan in the direction of Stavropol Krai, using stolen military trucks and a passenger car disguised as a police car. The fighters were dressed in law enforcement uniforms.\n\nAt checkpoints, the convoy claimed to be escorting \"Cargo 200\"—the bodies of fallen soldiers. Their camouflage and confident actions allowed them to pass through checkpoints without inspection. The plan called for a quick breakthrough to a major transportation hub, followed by a political strike capable of changing the course of the war.\n\nHowever, upon arrival in the Budyonnovsky District, the situation spiraled out of control. Local Interior Ministry leadership ordered the convoy to be stopped and Send her to the city for inspection. This decision disrupted the original operation route and forced the detachment to operate under changed conditions."
 chechnya.56.a: "Forward!"
 chechnya.57.t: "Battle in Budyonnovsk"
 chechnya.57.d: "Upon entering Budyonnovsk, the operation entered its active phase. A shootout with traffic police officers ensued, after which the detachment began moving toward the district police department building. The main forces, in trucks and an accompanying vehicle, approached the police department and opened fire with small arms and grenade launchers. The fighting quickly engulfed the building itself and the surrounding streets. Despite the element of surprise and the losses inflicted, it was not possible to completely take control of the police department - the resistance was stiffer than expected. After approximately twenty minutes of fighting, the detachment withdrew, taking hostages from among the institution's employees and visitors. The attempt to quickly seize the security facility failed. It became clear almost immediately that enemy forces were beginning to converge. Internal troops, special forces of the Ministry of Internal Affairs and the FSB, as well as army units, were moving into the area. The central The district hospital. The seizure of the facility brought thousands of civilians—patients and staff—under control. All previously captured hostages were also brought there. The operation headquarters was established inside the hospital, and the building itself was prepared for defense. The demands were extremely political: an end to the war, the withdrawal of troops, and recognition of independence. To increase pressure on the enemy, a public format was imposed—through journalists and direct negotiations. Federal forces were being deployed to the city, but any sudden move now threatened catastrophic consequences."
 chechnya.57.a: "Work, brothers!"
 chechnya.58.t: "Night Assault"
 chechnya.58.d: "Early in the morning, federal forces attempted a forcible release of the hostages. Elite special forces units and internal troops participated in the operation. Despite meticulous preparation on paper, the element of surprise was lost, and information about the assault's start time became known to us. The attack fizzled out almost immediately. The special forces achieved only limited success in one of the buildings, but they failed to hold the main objective. The fighting quickly became chaotic, a fire broke out, and the hostage losses sharply increased public outcry."
 chechnya.58.a: "Stop!"
 chechnya.59.t: "Peace Negotiations"
 chechnya.59.d: "After the failure of the military assault, the initiative gradually shifts to negotiations. On orders from \"Aslambek the Big,\" doctors Vera Chepurina and Pyotr Kostyuchenko again leave the hospital building under the Red Cross flag with an offer to release pregnant women and children in exchange for an end to the assault. However, Interior Minister Erin refuses to reconsider the military plan.\n\nDeputies Sergei Kovalev and Yuli Rybakov take the negotiations into their own hands. Through a chain of contacts—from headquarters in Budyonnovsk to Prime Minister Viktor Chernomyrdin—a direct line is established with Basayev. The initial demand for an immediate withdrawal of troops from Chechnya is deemed technically impossible and is replaced by a ceasefire.\n\nOn the morning of June 18, a group of deputies arrives at the hospital. Food supplies are delivered almost immediately. Negotiations The negotiations drag on for a day, amid chaos, pressure from security forces, and media attention. A key compromise is reached: the release of women and children in exchange for guarantees of a ceasefire and the beginning of political dialogue. A telephone conversation between Chernomyrdin and Basayev, broadcast on television without the knowledge of headquarters, becomes a turning point in the crisis. As a result, an agreement is signed to end hostilities and begin peace talks on the status of Chechnya."
 chechnya.59.a: "We need to end this!"
 chechnya.60.t: "Return to Chechnya"
 chechnya.60.d: "After the agreement was signed, Prime Minister Viktor Chernomyrdin instructed Sergei Stepashin to urgently provide transport for the evacuation of Basayev's detachment and the hostages. Ikarus buses and a refrigerated truck for the bodies of the dead militants were allocated for the column. The column departs Budyonnovsk at around 4:00 PM. Along the route are troops, armored vehicles, and attack helicopters. There is a general belief on the buses that an assault could begin at any moment. The operation is discussed in the government and headquarters, but no order is given. The initial route through North Ossetia is abandoned. After a missile strike on the road ahead of the column, Basayev is ordered to change direction and proceed through Dagestan. Despite his outrage at the form of the order, he agrees. There are reports of an ambush being prepared in North Ossetia, but the republic's leadership is blocking this scenario, fearing interethnic conflict. The road remains open, but under strict control. In Khasavyurt, the convoy remains at a standstill for several hours. Some local residents greet Basayev as a symbol of the end of the war. Then comes the mountain route to the Chechen village of Zandak. There, the militants dissolve into the crowd. The volunteer hostages return to the federal checkpoint."
 chechnya.60.a: "Excellent"


 news.23.t: "Rocket attacks on Chechnya"
 news.23.d: "Following the refusal of the Chechen authorities to accept the Russian Federation’s ultimatum, Moscow has launched a military response. The skies above Grozny and other strategic locations now light up with missile strikes. Although the stated targets are military infrastructure, civilian casualties are already being reported. The Chechen Republic of Ichkeria has declared full mobilization and calls on the international community to intervene. The people brace for war."
 news.23.a: "They forced us!"
 news.23.b: "God bless Chechnya"
 news.24.t: "Russia signs START-II"
 news.24.d: "In a historic step towards reducing the global nuclear threat, the Russian Federation has signed the Strategic Arms Reduction Treaty II with the United States. The treaty aims to drastically limit the number of deployed nuclear warheads and delivery systems, marking a major milestone in post-Cold War disarmament efforts. While proponents hail the agreement as a guarantee of international stability and a foundation for future cooperation, critics voice concerns about the potential weakening of Russia’s strategic deterrence. The signing reflects Moscow’s desire to reshape its role on the global stage, emphasizing diplomacy over confrontation."
 news.24.a: "Interesting"
 russia.2.b: "Impose an embargo on Chechnya."
 russia.2.c: "Begin military preparations ahead of schedule."
 CHE_dudayev_russian_deportation_tt: "If these states remain under our control, population falls by §Y22,000§! in Grozny, §Y6,000§! in northern Chechnya, §Y1,500§! around Gudermes and §Y500§! in Grozny district: up to §R30,000§! people. Half of those actually displaced are added to Russian state population on the map; the rest leave the playable area. §RRussia receives a response event.§!"
 CHE_islamist_russian_deportation_tt: "If these states remain under our control, population falls by §Y44,000§! in Grozny, §Y12,000§! in northern Chechnya, §Y3,000§! around Gudermes and §Y1,000§! in Grozny district: up to §R60,000§! people. Half of those actually displaced are added to Russian state population on the map; the rest leave the playable area. §RRussia receives a response event.§!"
 RAS_early_chechen_preparations_tt: "Immediately completes §YSupport the Chechen Opposition§! if it is not already complete. Military preparations, operation selection, the ultimatum and blitzkrieg can proceed ahead of their usual dates without requiring the new constitution. The remaining focuses must still be completed; this response does not declare war. §YOnly a human player can choose this response. The AI cannot use it.§!"
 RAS_early_chechen_war_allowed_tt: "A human player began military preparations early in response to the deportation."

 economy_event.1.t: "Critical Budget Deficit"
 economy_event.1.d: "Our cash reserves are exhausted and the budget is in deficit. Spending must be reviewed and additional sources of income found."
 economy_event.1.a: "We must balance the budget."
 adjara.2.t: "Militias Cross the Border"
 adjara.2.d: "Armed groups supporting the Georgian government have crossed into Adjara."
 adjara.2.a: "Prepare our defences."
 armenia.3.t: "The Nagorno-Karabakh Question"
 armenia.3.d: "The status of Nagorno-Karabakh requires a decision."
 armenia.3.a: "We must act."
 chechnya.8.t: "A Report from the Republic"
 chechnya.8.d: "A report on the situation in the republic has been received."
 chechnya.8.a: "Acknowledged."
 chechnya.12.t: "The Russian Embargo"
 chechnya.12.d: "The Russian authorities have imposed restrictions on us."
 chechnya.12.a: "We will have to adapt."
 chechnya.12.b: "We will not back down."
 chechnya.25.t: "Russia Imposes an Embargo"
 chechnya.25.d: "In response to the deportation and exodus of Russian-speaking residents from Chechnya, Moscow has announced a comprehensive economic embargo. Trade and transport links have been cut, supplies of food, fuel and industrial goods halted, and bank accounts frozen. Shortages are already affecting daily life and increasing the risk of unrest."
 chechnya.25.a: "Damn it."
 chechnya.43.b: "Let them follow their own path."
 chechnya.61.t: "The Kizlyar Operation"
 chechnya.61.d: "The command is considering an operation in Kizlyar to draw opposing forces away from the main front. The proposed raid would extend the conflict beyond Chechnya and place further pressure on the Russian leadership."
 chechnya.61.a: "Acknowledged."
 chechnya.62.t: "The Raid on Kizlyar"
 chechnya.62.d: "A Chechen armed detachment has crossed into Dagestan and entered Kizlyar. Attacks on military targets and the occupation of parts of the city have caused panic among residents. The command claims that the raid will force Moscow to negotiate."
 chechnya.62.a: "Forward!"
 chechnya.63.t: "Hostages in the Hospital"
 chechnya.63.d: "The detachment has occupied a hospital complex containing civilians and medical staff. The hostage crisis is attracting international attention and increasing pressure on both sides. Conditions inside are deteriorating as medical supplies run low and tensions rise."
 chechnya.63.a: "Continue the operation."
 chechnya.64.t: "The Road to Pervomayskoye"
 chechnya.64.d: "After the fighting in Kizlyar, the exhausted detachment has withdrawn towards Pervomayskoye. Vehicles are damaged and the number of wounded is growing. Federal forces are blocking the roads and tightening the encirclement. Commanders must decide how to get their men out."
 chechnya.64.a: "We must keep moving."
 chechnya.65.t: "Returning Home"
 chechnya.65.d: "After several days of fighting around Pervomayskoye, the encircled detachment attempted a night breakout. Some groups escaped towards Chechnya, while others became separated in the surrounding countryside. The withdrawal brought further casualties and confusion."
 chechnya.65.a: "We have returned."
 chechnya.66.t: "The Future of Ingushetia"
 chechnya.66.d: "The future status of Ingushetia must be decided. We can establish a separate autonomous republic or maintain the existing arrangement."
 chechnya.66.a: "Establish a separate autonomous republic."
 chechnya.66.b: "Maintain the existing arrangement."
 chechnya.67.t: "Russian Officers Captured"
 chechnya.67.d: "During the fighting for Grozny, the forces of the Provisional Council suffered heavy losses. Russian officers and tank crews have been taken prisoner. Moscow denies direct involvement in the assault, while the prisoners have become a source of controversy and diplomatic tension."
 chechnya.67.a: "A serious development."
 chechnya.68.t: "The Legacy of Soviet Aviation"
 chechnya.68.d: "The withdrawal of Russian troops has left a large collection of former Soviet training aircraft at Khankala and Kalinovskaya. The inventory includes L-29 and L-39 trainers, older MiG fighters, transport aircraft and helicopters. Their condition varies considerably, and only serviceable machines can form the basis of our air force."
 chechnya.68.a: "Start with the aircraft that can still fly."
 chechnya.69.t: "After the Chechen Revolution"
 chechnya.69.d: "The fighting around the Supreme Soviet has ended, but Grozny now faces the collapse of the old institutions. Doku Zavgayev has been overthrown, and the Chechen National Congress under Dzhokhar Dudayev has taken control. The new leadership must turn its declaration of independence into a functioning state."
 chechnya.69.a: "Freedom for Chechnya!"
 chechnya.70.t: "The Fate of the Communists"
 chechnya.70.d: "Our government must decide how to treat officials and specialists associated with the former Soviet system. Many remain essential to administration, industry, education and healthcare. Radicals demand their removal, while others warn that dismissing experienced personnel will weaken the state."
 chechnya.70.a: "Leave them alone."
 chechnya.70.b: "They must convert to Islam."
 chechnya.70.c: "Remove them from office."
 chechnya.71.t: "An Agreement with Dudayev"
 chechnya.71.d: "Dzhokhar Dudayev remains a prominent opponent of the Islamic government. His nationalist movement shares our desire for independence but has a different vision of the state. Advisers propose arresting him, making use of his military experience in the air force, or forming a coalition."
 chechnya.71.a: "Arrest Dudayev."
 chechnya.71.b: "Let him lead our air force."
 chechnya.71.c: "We can form a coalition with him."
 chechnya.72.t: "The Future of the Oil Industry"
 chechnya.72.d: "Oil extraction and refining remain central to the republic's economy. Much of the industry is still managed by directors appointed under Soviet rule. Keeping them may preserve production and expertise, while supporters of nationalisation demand direct state control over these resources."
 chechnya.72.a: "Let them continue extracting oil."
 chechnya.72.b: "Nationalise the oil industry."
 chechnya.73.t: "Negotiations with the Elders"
 chechnya.73.d: "Community elders continue to exercise considerable authority in rural areas. They offer cooperation in return for recognition of local customs and autonomy. An agreement could strengthen the government, but advocates of centralisation reject limits on the state's religious and legal authority."
 chechnya.73.a: "Establish a council of elders."
 chechnya.73.b: "Sharia must take precedence over adat."
 chechnya.74.t: "The Question of Secular Muslims"
 chechnya.74.d: "Many residents regard Islam as a matter of personal faith and tradition rather than a programme for political transformation. They oppose compulsory religious restrictions despite supporting independence. The government must choose whether to impose uniform religious rules or allow different practices."
 chechnya.74.a: "Enforce our religious rules."
 chechnya.74.b: "Let them practise their faith as they see fit."
 chechnya.75.t: "The Sufi Clergy"
 chechnya.75.d: "Sufi brotherhoods and their religious leaders retain deep roots in local communities. Relations with the government's radical wing are becoming strained. We can recognise their influence and seek cooperation, or attempt to subordinate religious institutions to the state."
 chechnya.75.a: "Reach an agreement with the Sufi sheikhs."
 chechnya.75.b: "Place the clergy under state control."
 gamsakhurdia.1.t: "Mobilising the Economy"
 gamsakhurdia.1.d: "Continuing the struggle requires resources."
 gamsakhurdia.1.a: "Secure the resources to continue."
 gamsakhurdia.2.t: "Military Mobilisation"
 gamsakhurdia.2.d: "More fighters are needed to sustain the resistance."
 gamsakhurdia.2.a: "Call on our supporters."
 gamsakhurdia.3.t: "Uniting the Zviadists"
 gamsakhurdia.3.d: "Gamsakhurdia's supporters are stepping up their activities."
 gamsakhurdia.3.a: "Continue the struggle."
 gamsakhurdia.4.t: "The Death of Zviad Gamsakhurdia"
 gamsakhurdia.4.d: "Reports have arrived of Zviad Gamsakhurdia's death."
 gamsakhurdia.4.a: "The struggle enters a new phase."
 Georgia.13.d: "The status of Adjara remains disputed."
 Georgia.14.d: "Following the change of government, the whereabouts and plans of Zviad Gamsakhurdia remain uncertain. His supporters may still influence events in the country."
 Georgia.38.d: "The confrontation with Abkhazia is turning into open war."
 Georgia.40.d: "The conflict over South Ossetia is entering a new phase."
 Georgia.41.d: "Zviadist activity is expanding in western Georgia. Their supporters are strengthening their networks and creating new difficulties for the government."
 Georgia.43.d: "The leadership of Adjara is asserting greater independence from the central authorities."
 Georgia.51.t: "Tskhinvali Holds"
 Georgia.51.d: "The attempt to take control of Tskhinvali has failed."
 Georgia.51.a: "We must reconsider our approach."
 Georgia.52.t: "Tskhinvali Captured"
 Georgia.52.d: "The military reports that Tskhinvali is now under our control."
 Georgia.52.a: "Consolidate our positions."
 Georgia.54.t: "The Death of Zviad Gamsakhurdia"
 Georgia.54.d: "Reports indicate that Zviad Gamsakhurdia has died while moving through the conflict zone. The death of the rebellion's leading figure may give the government an opportunity to restore order and bring the Zviadist uprising to an end."
 Georgia.54.a: "A significant development."
 news.5.a: "We are following developments."
 news.21.t: "Peace in Chechnya"
 news.21.d: "The Russian and Chechen sides have agreed to end the war."
 news.21.a: "There is hope for peace."
 news.31.t: "The Attack on Kizlyar"
 news.31.d: "An armed Chechen detachment has attacked Kizlyar, fought security forces and taken civilian hostages. The attackers subsequently withdrew towards Pervomayskoye, where federal troops surrounded the area. The crisis has caused casualties among both security personnel and civilians."
 news.31.a: "An appalling attack."
 news.31.b: "The conflict is spreading."
 news.31.c: "Horrifying."
 news.32.t: "Mass Killings in Samashki"
 news.32.d: "Reports of civilian deaths during an operation by Russian federal forces in Samashki have attracted international attention. Accounts of destruction and mistreatment have prompted calls for an investigation and renewed concern over the protection of civilians during the war."
 news.32.a: "An investigation is needed."
 news.32.b: "An atrocity."
 news.32.c: "A tragedy for the civilian population."
 russia.1.t: "The Collective Security Treaty"
 russia.1.d: "The government has announced the formation of a collective security organisation. It is intended to provide a framework for cooperation and mutual assistance with future partners."
 russia.1.a: "Let us combine our efforts."
 russia.13.d: "Chechnya is proposing an end to the war."
 russia.14.d: "The attempt to kill Dzhokhar Dudayev has failed."
 russia.15.d: "Ingush armed groups have become more active in the eastern part of Prigorodny District."
 russia.16.d: "Armed clashes continue in Prigorodny District. Casualties have been reported among both combatants and local residents."
 russia.17.d: "A ceasefire has been agreed with the Ingush armed groups."
 russia.18.t: "Chechnya Accepts Peace"
 russia.18.d: "The Chechen side has accepted the proposal to end the war."
 russia.18.a: "It is time to stop the bloodshed."
 russia.19.t: "Chechnya Rejects the Peace Proposal"
 russia.19.d: "The Chechen side has rejected the proposed peace terms."
 russia.19.a: "The conflict continues."
 russia.26.t: "The Military Opposes Reform"
 russia.26.d: "The proposed changes have encountered resistance within the armed forces."
 russia.26.a: "We must resolve these disagreements."
 russia.29.t: "An Airborne Landing at Grozny"
 russia.29.d: "Russian airborne troops have secured a foothold at Grozny airport after encountering Chechen resistance. Holding the airfield may support further operations, but the fighting continues and the position remains vulnerable to counterattacks."
 russia.29.a: "Hold your positions."
 russia.36.t: "A Chechen Attack on Kizlyar"
 russia.36.d: "An armed group has attacked Kizlyar in Dagestan. Federal forces have been placed on alert, and army and special forces units are being sent to the region."
 russia.36.a: "Send reinforcements immediately."
 russia.37.t: "Hostages in Kizlyar Hospital"
 russia.37.d: "Security agencies report a large hostage crisis in Kizlyar. Civilians are being held in hospitals, schools and residential buildings. The threat to their lives has complicated preparations for an assault, while negotiators seek their release."
 russia.37.a: "Horrifying."
 russia.38.t: "The Road to Pervomayskoye"
 russia.38.d: "The armed column holding hostages has attempted to break through federal checkpoints towards Pervomayskoye. Russian troops are monitoring its movements while trying to avoid further civilian casualties."
 russia.38.a: "A dangerous situation."
 russia.39.t: "The Armed Group Returns to Chechnya"
 russia.39.d: "Following the withdrawal from Pervomayskoye and negotiations with federal authorities, the armed group has moved towards Chechnya. Hostages from the column have been handed over to federal forces in safe areas."
 russia.39.a: "The hostages are safe."
 russia.40.t: "Grozny Airport Held"
 russia.40.d: "Russian troops have held Grozny airport against repeated attempts to retake it. The runway may allow further reinforcements to arrive, provided the airfield can be secured. The General Staff is considering the next phase of the operation."
 russia.40.a: "Build on this success."
 russia.41.t: "Mass Killings in Samashki"
 russia.41.d: "A federal operation in Samashki has resulted in civilian deaths. Reports of destruction and mistreatment have caused widespread concern and further damaged trust between local residents and the federal authorities."
 russia.41.a: "An appalling tragedy."
 soviet_union.15.t: "Chechnya Declares Independence"
 soviet_union.15.d: "Armed supporters of Dzhokhar Dudayev have seized government buildings in Grozny and announced the creation of an independent Chechen Republic of Ichkeria. Representatives of the security services and Defence Ministry are being sent from Moscow, but the wider crisis in the Soviet Union limits the centre's room for action."
 soviet_union.15.a: "Declare martial law in Chechnya."
 soviet_union.16.t: "An Airliner Is Hijacked"
 soviet_union.16.d: "An armed group has hijacked a passenger aircraft and issued political demands. The lives of the passengers are at risk, and the government is under pressure to respond to the crisis."
 soviet_union.16.a: "Lift martial law."
 soviet_union.17.t: "The Pavlov Monetary Reform"
 soviet_union.17.d: "Faced with economic crisis, shortages and the growth of the informal economy, the Soviet government has introduced emergency monetary measures. The exchange of large banknotes is being carried out at short notice, disrupting household finances and adding to public frustration."
 soviet_union.17.a: "Understood."
